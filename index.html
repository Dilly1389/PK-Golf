<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PK Golf</title>
<!-- Absolute /golf/... paths, not relative - the app's real address is
     pksport.co.za/golf (no trailing slash), and a relative path from a URL
     with no trailing slash resolves against the parent directory, not this
     one. PK Fishing solves the same problem with an injected <base> tag from
     its proxy; golf's proxy (pk-fishing's _worker.js) does a plain passthrough
     with no rewriting, so absolute paths are the simpler fix here. -->
<link rel="icon" href="/golf/icon-192.png?v=3">
<link rel="apple-touch-icon" href="/golf/icon-192.png?v=3">
<link rel="manifest" href="/golf/manifest.json">
<meta name="theme-color" content="#a11212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PK Golf">
<style>
  :root{
    --ink:#1a1a1a;
    --paper:#ffffff;
    --line:#e0d5d5;
    --brand-dark:#7a0f0f;
    --brand:#a11212;
    --brand-light:#c41818;
    --brand-dim:#fbe9e9;
    --gold:#c9a227;
    --gold-dim:#fdf6e3;
    --danger:#3a3a3a;
    --muted:#7a7a7a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  .wrap{max-width:960px;margin:0 auto;padding:0 0 80px;}
  .content{padding:20px 16px 0;}
  .app-header{
    background:linear-gradient(135deg, var(--brand-dark), var(--brand));
    color:var(--gold-dim);
    padding:14px 16px 12px;
    border-bottom:3px solid var(--gold);
  }
  .app-header h1{color:#fff;margin:0 0 2px;font-size:1.2rem;letter-spacing:-0.01em;}
  .app-header .subtitle{color:var(--gold-dim);opacity:.85;margin:0;font-size:.8rem;}
  .app-header .top-bar{margin-bottom:8px;}
  h2{font-size:1.02rem;margin:22px 0 10px;color:var(--brand-dark);border-bottom:2px solid var(--gold-dim);padding-bottom:6px;font-weight:700;}
  label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px;margin-top:12px;}
  input[type=text], input[type=number], select{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;
    background:#fff;font-size:1rem;color:var(--ink);
  }
  input:focus, select:focus{outline:2px solid var(--brand-light);outline-offset:1px;}
  /* Buttons/links default to the browser's native focus ring, which can be low-contrast against
     the dark-red header/sidebar or a colored team swatch - give every interactive element
     (real or role="button"-marked custom row) a consistent, on-brand focus style instead. */
  a:focus-visible, button:focus-visible, [role="button"]:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
    border-radius:4px;
  }
  button{
    font-family:inherit;font-size:.9rem;font-weight:600;
    border:1px solid var(--brand-dark);background:var(--brand-dark);color:var(--gold-dim);
    padding:9px 16px;border-radius:6px;cursor:pointer;
  }
  button.secondary{background:transparent;color:var(--brand-dark);}
  .cta-new-round{display:block;width:100%;padding:16px 16px;font-size:1.05rem;font-weight:700;border-radius:999px;margin:14px 0 14px;box-shadow:0 4px 14px rgba(122,15,15,.22);}
  button.ghost{background:transparent;color:var(--muted);border-color:var(--line);}
  .btn-pill-secondary{display:block;width:100%;padding:14px 16px;font-size:.95rem;font-weight:700;border-radius:999px;background:var(--gold-dim);color:var(--brand-dark);border:1px solid var(--line);margin-bottom:22px;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:#fff;box-shadow:0 1px 3px rgba(26,10,10,.06), 0 1px 2px rgba(26,10,10,.04);}
  table{width:100%;border-collapse:collapse;font-size:.85rem;}
  th,td{border:1px solid var(--line);padding:5px 6px;text-align:center;}
  th{background:var(--brand-dark);font-weight:600;font-size:.75rem;color:#fff;}
  td.name-col, th.name-col{text-align:left;min-width:110px;}
  .hole-input{width:52px;padding:6px 2px;text-align:center;font-size:1rem;}
  .hole-input::-webkit-outer-spin-button,
  .hole-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .hole-input[type=number]{-moz-appearance:textfield;}
  /* Hole Par/S.I. editor — one row per hole, Front 9 / Back 9 side by side */
  .holes-editor-grid{align-items:start;}
  .holes-editor-label{font-weight:700;color:var(--brand-dark);font-size:.85rem;margin:0 0 4px;}
  table.holes-table{font-size:.9rem;}
  table.holes-table th,table.holes-table td{padding:6px 4px;}
  table.holes-table td.hole-num-col{font-weight:700;color:var(--brand-dark);background:var(--gold-dim);width:20%;}
  table.holes-table .hole-input{width:100%;box-sizing:border-box;padding:9px 2px;font-size:1.05rem;}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:600;}
  .pill.mode{background:var(--gold-dim);color:var(--brand-dark);margin:2px 4px 2px 0;border:1px solid var(--gold);}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin:8px 0;}
  .checkbox-row input{width:auto;}
  .link-box{display:flex;gap:8px;align-items:center;background:var(--gold-dim);border:1px solid var(--gold);border-radius:8px;padding:10px 12px;margin-top:8px;}
  .link-box input{background:#fff;font-size:.8rem;}
  .muted{color:var(--muted);font-size:.82rem;}
  .team-a{color:var(--brand-light);font-weight:600;}
  .team-b{color:var(--ink);font-weight:700;}
  .status-up{color:var(--brand-light);font-weight:700;}
  .status-down{color:var(--danger);font-weight:700;}
  .status-all-sq{color:var(--muted);font-weight:700;}
  .leader-row{font-weight:700;background:var(--gold-dim);}
  .top-bar{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .header-status-row{display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px;}
  .badge-live{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;color:var(--gold);padding:4px 2px;}
  .conn-indicator{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;opacity:.95;padding:4px 2px;}
  .conn-indicator.conn-online{color:#8fd9a8;}
  .conn-indicator.conn-offline{color:#ffb4a8;}
  .conn-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .conn-online .conn-dot{background:#4caf50;}
  .conn-offline .conn-dot{background:#e05a4a;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:pulse 1.6s infinite;}
  .account-chip{display:inline-flex;align-items:center;gap:5px;font-size:.92rem;font-weight:700;color:var(--gold-dim);opacity:.95;text-decoration:none;padding:6px 2px;}
  .account-chip:hover{opacity:1;text-decoration:underline;}

  /* Home screen's big centered hero (phone layout only - desktop keeps the plain sidebar
     header). Red-to-gold gradient standing in for a course photo, branding centered in the
     middle, three stacked action pills below. */
  .home-hero{
    background:linear-gradient(165deg, var(--brand-dark) 0%, var(--brand) 45%, var(--brand-light) 68%, var(--gold) 120%);
    padding:14px 20px 36px;
    color:#fff;
    border-bottom:3px solid var(--gold);
    /* Fills the whole screen on first load (matching the full-bleed reference look) instead of
       stopping dead at its own content height and leaving plain white page background below it
       whenever there's no "current round" card to fill the rest - min-height, not height, so it
       still grows normally if that card does appear. 100dvh accounts for mobile browser chrome
       (address bar etc.) better than 100vh; vh is the fallback for browsers without dvh support. */
    min-height:100vh;
    min-height:100dvh;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
  }
  .home-hero-topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;}
  .home-hero-topbar .header-status-row{justify-content:flex-end;}
  /* Takes up whatever space is left under the top bar and centers the branding+actions group
     within it, so the top bar stays pinned to the very top regardless of hero height. */
  .home-hero-body{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .home-hero-brand{text-align:center;padding:30px 0 34px;}
  .home-hero-logo{width:140px;height:140px;border-radius:30px;box-shadow:0 6px 20px rgba(0,0,0,.25);}
  .home-hero-brand h1{margin:14px 0 0;font-size:1.9rem;font-weight:800;letter-spacing:-0.01em;color:#fff;}
  .home-hero-tagline{margin:4px 0 0;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-dim);opacity:.85;}
  .home-hero-actions{display:flex;flex-direction:column;gap:12px;max-width:420px;margin:0 auto;}
  .home-hero-pill{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    padding:15px 16px;border-radius:999px;font-size:1rem;font-weight:700;font-family:inherit;
    cursor:pointer;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .home-hero-pill-primary{background:#fff;color:var(--brand-dark);border-color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.2);}

  /* Slide-in nav drawer, opened from the hamburger button in the header - sized for a thumb
     to reach and tap on a phone (78vw wide, 44px+ tall link rows). */
  .menu-btn{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;font-size:1.3rem;line-height:1;padding:7px 11px;border-radius:8px;cursor:pointer;flex-shrink:0;}
  .menu-btn:active{background:rgba(255,255,255,.18);}
  .app-drawer-overlay{position:fixed;inset:0;background:rgba(26,10,10,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;}
  .app-drawer-overlay.open{opacity:1;pointer-events:auto;}
  .app-drawer{position:fixed;top:0;left:0;bottom:0;width:78vw;max-width:300px;background:#fff;z-index:41;box-shadow:2px 0 18px rgba(0,0,0,.25);transform:translateX(-100%);transition:transform .22s ease;display:flex;flex-direction:column;padding:10px 0;overflow-y:auto;}
  .app-drawer.open{transform:translateX(0);}
  .app-drawer-head{display:flex;align-items:center;padding:10px 18px 16px;border-bottom:1px solid var(--line);margin-bottom:8px;font-size:1.05rem;font-weight:800;color:var(--brand-dark);}
  .drawer-link{display:flex;align-items:center;gap:12px;padding:14px 18px;color:var(--ink);text-decoration:none;font-size:1rem;font-weight:600;}
  .drawer-link:active{background:var(--gold-dim);color:var(--brand-dark);}

  /* Account screen's profile header, GolfPad-style - initials avatar in place of a photo
     (no photo-upload feature exists), name, and handicap index front and center. */
  .profile-header{text-align:center;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line);}
  .profile-avatar{
    width:84px;height:84px;border-radius:50%;margin:0 auto 12px;
    display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:#fff;
    background:linear-gradient(135deg, var(--brand-dark), var(--brand));box-shadow:0 6px 18px rgba(122,15,15,.25);
  }
  .profile-name{margin:0;font-size:1.3rem;font-weight:800;color:var(--ink);border:none;padding:0;}
  .profile-handicap{margin:4px 0 0;font-size:.85rem;color:var(--brand-dark);font-weight:700;}

  /* GolfPad-style round card for Playing history: course/date on the left, up to 3 circular
     stat badges on the right. */
  .round-card{
    border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:#fff;
    box-shadow:0 1px 3px rgba(26,10,10,.06), 0 1px 2px rgba(26,10,10,.04);
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .round-card-info{flex:1;min-width:140px;}
  .round-card-stats{display:flex;gap:10px;flex-shrink:0;}
  .stat-ring{position:relative;width:50px;display:flex;flex-direction:column;align-items:center;}
  .stat-ring-svg{width:50px;height:50px;transform:rotate(-90deg);}
  .stat-ring-track{fill:none;stroke:var(--line);stroke-width:3;}
  .stat-ring-progress{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;}
  .stat-ring-progress.complete{stroke:#3fa34d;}
  .stat-ring-value{position:absolute;top:15px;left:0;right:0;text-align:center;font-weight:800;font-size:.86rem;color:var(--ink);}
  .stat-ring-label{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}

  /* Desktop sidebar dashboard (>=1100px wide) - same URLs, same page content, different shell.
     #app.app-desktop cancels .wrap's phone-width max-width/margin (ID beats class specificity
     regardless of source order) so the sidebar+main layout can use the full viewport. */
  #app.app-desktop{max-width:none;margin:0;padding:0;}
  .desktop-shell{display:flex;min-height:100vh;}
  .desktop-sidebar{
    width:240px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;
    background:linear-gradient(180deg, var(--brand-dark), var(--brand));
    display:flex;flex-direction:column;
  }
  .desktop-sidebar-head{display:flex;align-items:center;gap:10px;padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.15);color:#fff;}
  .desktop-sidebar-head strong{font-size:1.1rem;letter-spacing:-0.01em;}
  .desktop-nav{flex:1;padding:14px 0;}
  .desktop-nav-link{display:flex;align-items:center;gap:12px;padding:12px 18px;color:var(--gold-dim);text-decoration:none;font-weight:600;font-size:.95rem;opacity:.8;border-right:3px solid transparent;}
  .desktop-nav-link:hover{opacity:1;background:rgba(255,255,255,.08);}
  .desktop-nav-link.active{opacity:1;background:rgba(255,255,255,.14);border-right-color:var(--gold);color:#fff;}
  .desktop-sidebar-foot{padding:14px 18px 18px;border-top:1px solid rgba(255,255,255,.15);}
  .desktop-account-link{display:flex;align-items:center;gap:8px;color:var(--gold-dim);text-decoration:none;font-weight:700;font-size:.9rem;margin-top:8px;}
  .desktop-account-link:hover{color:#fff;text-decoration:underline;}
  .desktop-main{flex:1;min-width:0;padding:30px 40px 60px;}
  .desktop-main-inner{max-width:1000px;}
  .desktop-topstrip{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
  .desktop-topstrip h1{margin:0 0 4px;font-size:1.5rem;color:var(--brand-dark);letter-spacing:-0.01em;}
  .desktop-topstrip .subtitle{margin:0;font-size:.88rem;color:var(--muted);}
  .auth-gate{
    min-height:100vh;background:linear-gradient(135deg, var(--brand-dark), var(--brand));
    display:flex;align-items:center;justify-content:center;padding:24px 16px;
  }
  .auth-gate-card{
    background:#fff;border-radius:14px;max-width:420px;width:100%;
    padding:28px 24px 24px;box-shadow:0 10px 40px rgba(0,0,0,.25);
  }
  .auth-gate-logo{width:96px;height:96px;border-radius:20px;margin:0 auto 14px;display:block;box-shadow:0 4px 14px rgba(0,0,0,.2);}
  .auth-gate-appname{color:var(--brand-dark);font-size:1.4rem;font-weight:800;margin:0 0 2px;}
  .password-checklist{list-style:none;padding:0;margin:8px 0 0;font-size:12px;}
  .password-checklist li{display:flex;align-items:center;gap:7px;padding:2px 0;color:var(--muted);}
  .password-checklist li.met{color:#1f9254;}
  .password-checklist .pw-check-icon{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1.5px solid currentColor;font-size:10px;line-height:1;flex-shrink:0;}
  .password-checklist li.met .pw-check-icon{background:#1f9254;border-color:#1f9254;color:#fff;}
  input[type=email], input[type=password]{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;
    background:#fff;font-size:1rem;color:var(--ink);
  }
  .auth-switch-link{background:none;border:none;color:var(--brand-light);font-weight:700;cursor:pointer;font-family:inherit;font-size:inherit;padding:0;text-decoration:underline;}
  @keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
  .hole-nav{display:flex;align-items:center;gap:10px;margin:10px 0;}
  .hole-nav button{padding:6px 10px;}
  .hole-nav .current{font-weight:700;font-size:1.05rem;min-width:110px;text-align:center;color:var(--brand-dark);}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  @media (max-width:600px){.grid-2{grid-template-columns:1fr;}}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  @media (max-width:600px){.grid-3{grid-template-columns:1fr;}}
  .config-note{font-size:.78rem;color:var(--muted);border:1px dashed var(--line);padding:8px 10px;border-radius:8px;margin-bottom:16px;}
  a{color:var(--brand-light);}

  /* tab bar, matching the tabbed layout of the other apps */
  .tab-bar{
    display:flex;gap:4px;background:var(--brand-dark);
    padding:4px;margin:0;position:sticky;top:0;z-index:5;
  }
  .tab-btn{
    flex:1;background:transparent;border:none;color:var(--gold-dim);
    padding:10px 8px;font-size:.85rem;font-weight:600;border-radius:6px;opacity:.7;
  }
  .tab-btn.active{background:var(--gold);color:var(--brand-dark);opacity:1;}

  /* Piekfyn Kompetisie scoreboard (competition/standings pages) */
  .pf-bar-track{display:flex;height:12px;border-radius:6px;overflow:hidden;margin-top:18px;background:var(--line);}
  .pf-bar-seg, .pf-bar-seg-a, .pf-bar-seg-b{height:100%;}
  .pf-tab-bar{display:flex;gap:4px;background:var(--brand-dark);padding:4px;border-radius:8px;margin:14px 0;}
  .pf-tab-btn{flex:1;background:transparent;border:none;color:var(--gold-dim);padding:10px 8px;font-size:.85rem;font-weight:600;border-radius:6px;opacity:.7;font-family:inherit;cursor:pointer;}
  .pf-tab-btn.active{background:var(--gold);color:var(--brand-dark);opacity:1;}
  .pf-tab-panel{display:none;}
  .pf-tab-panel.active{display:block;}
  .pf-fb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;}
  .pf-fb-card{padding:14px 16px;}
  .pf-match-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;}
  .pf-match-row + .pf-match-row{border-top:1px solid var(--line);}
  .pf-match-row[data-match]{cursor:pointer;}
  .pf-match-row[data-match]:active{background:var(--gold-dim);}
  .pf-match-row .pf-chev{color:var(--muted);font-size:1.1rem;line-height:1;margin-left:2px;}
  table.scorecard-table td.mc-up{background:#e6f2e6;color:#1d5e1d;font-weight:800;}
  table.scorecard-table td.mc-down{background:#fbe8e8;color:var(--danger);font-weight:800;}
  table.scorecard-table td.mc-sq{font-weight:700;color:var(--muted);}
  table.scorecard-table tr.mc-side-row td.label-col{font-weight:800;}
  table.scorecard-table tr.mc-team-score-row{background:var(--gold-dim);}
  table.scorecard-table tr.mc-team-score-row td.label-col{font-weight:800;color:var(--brand-dark);}
  /* Hero team chips — two color styles: jersey-fade gradient (default) and flat plain red/white.
     Both keep the same text colors (A white, B red); only the fill differs. */
  .pf-hero-chips{display:flex;align-items:stretch;gap:8px;}
  .pf-chip{flex:1;border-radius:10px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-width:0;position:relative;overflow:hidden;color:#fff;}
  .pf-chip-name{font-size:18px;font-weight:800;overflow-wrap:anywhere;position:relative;}
  .pf-chip-num{font-size:clamp(2rem,10vw,2.8rem);font-weight:800;line-height:1;margin-top:4px;position:relative;}
  .pf-vs{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);width:18px;flex-shrink:0;}
  .pf-live-wrap{display:flex;justify-content:center;margin-bottom:8px;}
  .pf-live{display:inline-flex;align-items:center;gap:5px;font-size:.66rem;font-weight:800;letter-spacing:.08em;color:#c62828;background:#fdecea;border:1px solid #f3b8b3;padding:2px 9px;border-radius:999px;}
  .pf-live.pf-final{color:var(--muted);background:var(--gold-dim);border-color:var(--line);}
  .pf-live-dot{width:7px;height:7px;border-radius:50%;background:#e53935;animation:pfPulse 1.4s ease-in-out infinite;}
  @keyframes pfPulse{0%,100%{opacity:1;}50%{opacity:.25;}}
  @media (prefers-reduced-motion: reduce){
    .pf-live-dot{animation:none;}
    .app-drawer, .app-drawer-overlay{transition:none;}
  }
  .pf-pill{font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;flex-shrink:0;}
  .pf-pill.status-all-sq{background:var(--gold-dim);color:var(--ink);border:1px solid var(--gold);}
  .pf-team-tag{display:inline-block;font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:999px;}
  .pf-color-picker-row{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;}
  .pf-color-group{display:flex;align-items:center;gap:8px;}
  .pf-color-group-label{font-size:.72rem;font-weight:700;color:var(--muted);width:14px;flex-shrink:0;}
  .pf-swatches{display:flex;gap:8px;flex-wrap:wrap;}

<body>
<div class="wrap" id="app"></div>

<script type="module">
/* ======================= CONFIG =======================

   > Your apps > SDK setup and configuration.
*/

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, addDoc, getDoc, getDocs, updateDoc, deleteDoc,

} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  GoogleAuthProvider, signInWithPopup

const configured = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("YOUR_");
let db = null;
let auth = null;
if (configured){
  const app = initializeApp(firebaseConfig);
  // Persistent cache: scores captured with no signal on the course are kept on the device and
  // synced when the connection returns, even if the page is reloaded in between. Falls back to
  // the default in-memory cache where IndexedDB isn't available.
  try{
    db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  } catch(err){
    db = getFirestore(app);
  }
  auth = getAuth(app);
}

const GAME_MODES = [
  { key: "stroke",     label: "Stroke play (gross/net)" },
  { key: "stableford",  label: "Stableford" },
  { key: "matchplay",  label: "Match play (2 v 2)" },
  { key: "matchplay3", label: "3-way match play" },
  { key: "betterball", label: "Betterball Stableford" },
  { key: "alliance",   label: "Alliance" },
  { key: "bbb",        label: "Bingo Bango Bongo" },
  { key: "piekfyn",    label: "Piekfyn Kompetisie" },
];

// Modes with a fixed player count other than the usual 4 (3-way match play needs
// exactly 3 - a real Three-ball, not a 4th unused slot). Anything not listed
// here uses the default of 4.
const MODE_PLAYER_COUNT = { matchplay3: 3 };
function playerCountForMode(mode){
  return MODE_PLAYER_COUNT[mode] || 4;
}

const TEE_BOXES = ["White", "Yellow", "Red", "Blue", "Black", "Gold"];
function teeBoxOptions(selected){
  return TEE_BOXES.map(t => `<option value="${t}" ${t === selected ? "selected" : ""}>${t}</option>`).join("");
}

// Every screen in this app builds its markup as an HTML string and assigns it via innerHTML -
// so any user-controlled text (round/player/team/competition/course names, free-text date/tee
// time fields) MUST go through this before being interpolated into one of those templates.
// Several of those screens (the "All rounds" history list, spectator/standings links) are
// visible to other users or to anyone with a link, with no further sanitization layer, so this
// is the only thing standing between a crafted name and a stored XSS.
function escapeHtml(str){
  if (str == null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/* ---------- scoring helpers ---------- */
function strokesReceived(hcp, si){
  hcp = Math.max(0, hcp|0);
  const base = Math.floor(hcp / 18);
  const remainder = hcp % 18;
  return base + (si <= remainder ? 1 : 0);
}
function stablefordPoints(par, netStrokes){
  if (netStrokes == null) return null;
  const diff = netStrokes - par;
  return Math.max(2 - diff, 0);
}
function fmtDiff(n){
  if (n > 0) return "+" + n;
  if (n === 0) return "E";
  return String(n);
}

/* ---------- course database (golf_courses) ---------- */
function slugify(name){
  return (name || "course").toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "course";
}
async function saveCourseToDatabase(courseName, holes, source, extra, ratingSlope){
  const slug = slugify(courseName);
  const data = {
    name: courseName,
    holes: holes.map(h => {
      const hole = { holeNumber: h.holeNumber, par: h.par, strokeIndex: h.strokeIndex };
      if (h.yards) hole.yards = h.yards;
      return hole;
    }),
    updatedAt: serverTimestamp()
  };
  if (source){ data.source = source.name; data.sourceUrl = source.url; }
  if (extra){
    if (extra.parTotal) data.parTotal = extra.parTotal;
    if (extra.tees && extra.tees.length) data.tees = extra.tees;
  }
  // Editable on New Round, re-saved every time a round is created with this course — so a
  // club re-rating its slope/course rating actually sticks instead of staying stale forever.
  if (ratingSlope){
    if (ratingSlope.courseRating != null) data.courseRating = ratingSlope.courseRating;
    if (ratingSlope.slopeRating != null) data.slopeRating = ratingSlope.slopeRating;
  }
  await setDoc(doc(db, "golf_courses", slug), data);
}
function matchTeeRatingSlope(tees, teeBoxName){
  if (!tees || !tees.length) return null;
  const target = (teeBoxName || "").trim().toLowerCase();
  const exact = tees.find(t => (t.name || "").trim().toLowerCase() === target);
  const starts = exact || tees.find(t => (t.name || "").trim().toLowerCase().startsWith(target));
  const tee = starts || tees[0];
  return (tee && tee.rating != null && tee.slope != null) ? { courseRating: tee.rating, slopeRating: tee.slope } : null;
}
// Remembers the loaded course's tees so the teeBox dropdown's change handler (wired in
// renderNewRound) can re-pick rating/slope without a re-fetch.
let currentCourseTees = null;
function fillRatingSlope(tees, flat){
  currentCourseTees = tees || null;
  const teeBox = document.getElementById("teeBox").value;
  const picked = flat || matchTeeRatingSlope(currentCourseTees, teeBox);
  document.getElementById("courseRating").value = picked ? picked.courseRating : "";
  document.getElementById("slopeRating").value = picked ? picked.slopeRating : "";
}

// GolfCore course search (api.golfcore.org) — free tier, keyless until 2026-12-04 per their
// docs. ToS permits caching/displaying this to our own users with attribution + a link back
// to the source course page, which golfcoreSourceSelected carries through to saveCourseToDatabase.
let golfcoreSourceSelected = null;
async function searchGolfCore(){
  const q = document.getElementById("golfcoreSearchInput").value.trim();
  const resultsEl = document.getElementById("golfcoreResults");
  if (!q){ resultsEl.innerHTML = ""; return; }
  resultsEl.innerHTML = `<p class="muted" style="font-size:.78rem;">Searching…</p>`;
  try{
    const res = await fetch(`https://api.golfcore.org/v1/courses?q=${encodeURIComponent(q)}&limit=8`);
    const data = await res.json();
    const courses = data.courses || [];
    resultsEl.innerHTML = courses.length === 0
      ? `<p class="muted" style="font-size:.78rem;">No matches.</p>`
      : courses.map(c => `
        <div class="golfcore-result" data-slug="${c.slug}" data-url="${c.url}" role="button" tabindex="0" style="cursor:pointer;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-top:6px;">
          <strong>${escapeHtml(c.name)}</strong>
          <div class="muted" style="font-size:.78rem;">${escapeHtml(c.city) || ""}${c.region ? ", " + escapeHtml(c.region) : ""}${c.country ? " · " + escapeHtml(c.country).toUpperCase() : ""} · Par ${c.par_total || "?"}</div>
        </div>`).join("");
    resultsEl.querySelectorAll(".golfcore-result").forEach(el => {
      el.onclick = () => selectGolfCoreCourse(el.dataset.slug, el.dataset.url);
    });
  } catch(err){
    resultsEl.innerHTML = `<p class="muted" style="font-size:.78rem;">Search failed — check the connection and try again.</p>`;
  }
}
async function selectGolfCoreCourse(slug, url){
  const resultsEl = document.getElementById("golfcoreResults");
  resultsEl.innerHTML = `<p class="muted" style="font-size:.78rem;">Loading scorecard…</p>`;
  try{
    const res = await fetch(`https://api.golfcore.org/v1/courses/${slug}`);
    const data = await res.json();
    const layout = (data.layouts || [])[0];
    if (!layout || !layout.holes || layout.holes.length !== 18){
      resultsEl.innerHTML = `<p class="muted" style="font-size:.78rem;">That course doesn't have a full 18-hole scorecard available.</p>`;
      return;
    }
    document.getElementById("courseName").value = data.name;
    const holesYards = {};
    layout.holes.forEach(h => {
      const parCell = document.querySelector(`.h-par[data-hole="${h.position}"]`);
      const siCell = document.querySelector(`.h-si[data-hole="${h.position}"]`);
      if (parCell) parCell.value = h.par;
      if (siCell) siCell.value = h.stroke_index;
      if (h.yards) holesYards[h.position] = h.yards;
    });
    const tees = (layout.tees || []).map(t => ({ name: t.name, rating: t.rating, slope: t.slope, yards: t.yards, par: t.par }));
    golfcoreSourceSelected = { name: "GolfCore", url, parTotal: data.par_total || layout.par, tees, holesYards };
    fillRatingSlope(tees, null);
    const teeInfo = tees.length ? ` (${tees.length} tee${tees.length>1?"s":""} — rating/slope saved)` : "";
    resultsEl.innerHTML = `<p class="muted" style="font-size:.78rem;">Loaded ${escapeHtml(data.name)} — par, stroke index &amp; yardage filled in below${teeInfo}.</p>`;
    const credit = document.getElementById("golfcoreCredit");
    credit.style.display = "";
    credit.innerHTML = `Course data via <a href="${url}" target="_blank" rel="noopener">GolfCore</a>`;
  } catch(err){
    resultsEl.innerHTML = `<p class="muted" style="font-size:.78rem;">Couldn't load that course's scorecard.</p>`;
  }
}
async function loadCoursesList(){
  const snap = await getDocs(collection(db, "golf_courses"));
  return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => a.name.localeCompare(b.name));
}
async function loadRoundsList(){
  try{
    const snap = await getDocs(query(collection(db, "golf_rounds"), orderBy("createdAt", "desc"), limit(25)));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(err){
    // orderBy needs the field on every doc; fall back to unordered if that ever fails
    const snap = await getDocs(collection(db, "golf_rounds"));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }
}

async function loadCompetitionsList(){
  try{
    const snap = await getDocs(query(collection(db, "golf_competitions"), orderBy("createdAt", "desc"), limit(10)));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(err){
    const snap = await getDocs(collection(db, "golf_competitions"));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }
}

// Deleting/restoring a competition cascades to every fourball round linked to it, so the whole
// thing disappears from (or comes back to) both the Competitions and All rounds lists together.
// Nothing is erased — same soft-delete pattern a single round already uses.
async function deleteCompetition(competitionId){
  const roundsSnap = await getDocs(query(collection(db, "golf_rounds"), where("competitionId", "==", competitionId)));
  const batch = writeBatch(db);
  batch.update(doc(db, "golf_competitions", competitionId), { deleted: true, deletedAt: serverTimestamp() });
  roundsSnap.docs.forEach(d => batch.update(doc(db, "golf_rounds", d.id), { deleted: true, deletedAt: serverTimestamp() }));
  await batch.commit();
}
async function restoreCompetition(competitionId){
  const roundsSnap = await getDocs(query(collection(db, "golf_rounds"), where("competitionId", "==", competitionId)));
  const batch = writeBatch(db);
  batch.update(doc(db, "golf_competitions", competitionId), { deleted: false, deletedAt: null });
  roundsSnap.docs.forEach(d => batch.update(doc(db, "golf_rounds", d.id), { deleted: false, deletedAt: null }));
  await batch.commit();
}

/* ---------- Auth & golfer profiles ---------- */
let currentUser = null;
let currentGolferProfile = null; // {name, handicap, email}
let authResolved = false; // true once Firebase has told us the real signed-in/out state

const GOOGLE_ICON_SVG = `<svg width="18" height="18" viewBox="0 0 48 48" style="flex-shrink:0;">
  <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
  <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.9 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
  <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.3 35.4 26.8 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
  <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.7l6.3 5.3C39.9 37 44 31 44 24c0-1.3-.1-2.7-.4-3.5z"/>
</svg>`;

async function getGolferProfile(uid){
  const snap = await getDoc(doc(db, "golfers", uid));
  return snap.exists() ? snap.data() : null;
}
// Called on every sign-in/sign-up — creates a default profile the first time this
// account is seen, so there's always something to show on the Account screen.
async function ensureGolferProfile(user){
  let profile = await getGolferProfile(user.uid);
  if (!profile){
    profile = {
      name: user.displayName || (user.email ? user.email.split("@")[0] : "Golfer"),
      handicap: 0,
      email: user.email || "",
      createdAt: serverTimestamp()
    };
    await setDoc(doc(db, "golfers", user.uid), profile);
  }
  return profile;
}
async function saveGolferProfile(uid, data){
  await setDoc(doc(db, "golfers", uid), data, { merge: true });
  if (currentGolferProfile) Object.assign(currentGolferProfile, data);
}

async function loadMyRoundsList(uid){
  try{
    const snap = await getDocs(query(collection(db, "golf_rounds"), where("ownerUid", "==", uid), orderBy("createdAt", "desc"), limit(25)));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(err){
    // Composite index (ownerUid + createdAt) may not exist yet — fall back to an
    // unordered query and sort client-side instead of failing outright.
    const snap = await getDocs(query(collection(db, "golf_rounds"), where("ownerUid", "==", uid)));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
  }
}

// For "My rounds" cards on Playing history: this round's primary player's gross/net score so
// far, and holes completed. Deliberately NOT loadRoundBundle (which reads every player's every
// hole score) - History can list up to 25 rounds, so each row uses targeted, filtered queries
// instead: one player doc (lowest sortOrder = the round's creator, by convention) and only
// THAT player's score docs, plus the full holes subcollection (needed for stroke index, to
// compute net). Returns null when there's no "my score" to show (creator was marking-only, or
// the round has no players/holes yet).
async function loadRoundScoreSummary(round){
  if (round.creatorIsPlaying === false) return null;
  try{
    const playerSnap = await getDocs(query(collection(db, "golf_rounds", round.id, "players"), orderBy("sortOrder"), limit(1)));
    if (playerSnap.empty) return null;
    const player = { id: playerSnap.docs[0].id, ...playerSnap.docs[0].data() };

    const holesSnap = await getDocs(collection(db, "golf_rounds", round.id, "holes"));
    const holes = holesSnap.docs.map(d => d.data());
    if (!holes.length) return null;

    const scoresSnap = await getDocs(query(collection(db, "golf_rounds", round.id, "scores"), where("playerId", "==", player.id)));
    const grossByHole = {};
    scoresSnap.docs.forEach(d => { const s = d.data(); grossByHole[s.holeNumber] = s.grossStrokes; });

    let gross = 0, net = 0, thru = 0;
    holes.forEach(h => {
      const g = grossByHole[h.holeNumber];
      if (g == null) return;
      thru++;
      gross += g;
      net += g - strokesReceived(player.playingHandicap, h.strokeIndex);
    });
    return { gross, net, thru, totalHoles: holes.length };
  } catch(err){
    return null;
  }
}

function setKeepSignedIn(keep){
  return setPersistence(auth, keep ? browserLocalPersistence : browserSessionPersistence);
}

// Must match the password policy set in Firebase (Authentication > Settings > Password
// policy) — one rule list feeds both the live tick-list and the submit-time check so
// they can't drift apart, same approach PK Fishing uses.
const PASSWORD_RULE_TEXT = 'At least 8 characters, with a lowercase letter, an uppercase letter, a number and a symbol.';
const PASSWORD_RULES = [
  {label: 'At least 8 characters', test: pw => pw.length >= 8},
  {label: 'A lowercase letter (a-z)', test: pw => /[a-z]/.test(pw)},
  {label: 'An uppercase letter (A-Z)', test: pw => /[A-Z]/.test(pw)},
  {label: 'A number (0-9)', test: pw => /[0-9]/.test(pw)},
  {label: 'A symbol (e.g. ! ? # $)', test: pw => /[^A-Za-z0-9]/.test(pw)}
];
function passwordProblem(pw){
  const ok = PASSWORD_RULES.every(r => r.test(pw));
  return ok ? '' : 'Password needs: ' + PASSWORD_RULE_TEXT;
}
function passwordChecklistHtml(pw){
  return PASSWORD_RULES.map(r => {
    const met = r.test(pw);
    return '<li class="' + (met ? 'met' : '') + '"><span class="pw-check-icon">' + (met ? '✓' : '') + '</span>' + r.label + '</li>';
  }).join('');
}
function wirePasswordChecklist(inputId, listId){
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  if (!input || !list) return;
  const update = () => { list.innerHTML = passwordChecklistHtml(input.value); };
  input.addEventListener('input', update);
  update();
}
async function doSignUp(name, handicap, email, password, keepSignedIn){
  await setKeepSignedIn(keepSignedIn);
  const cred = await createUserWithEmailAndPassword(auth, email, password);
  await setDoc(doc(db, "golfers", cred.user.uid), {
    name: name || email.split("@")[0], handicap: handicap || 0, email, createdAt: serverTimestamp()
  });
}
async function doSignIn(email, password, keepSignedIn){
  await setKeepSignedIn(keepSignedIn);
  await signInWithEmailAndPassword(auth, email, password);
}
async function doGoogleSignIn(){
  await setKeepSignedIn(true);
  await signInWithPopup(auth, new GoogleAuthProvider());
}
async function doSignOut(){
  await signOut(auth);
}
async function doForgotPassword(email){
  await sendPasswordResetEmail(auth, email);
}

if (auth){
  onAuthStateChanged(auth, async (user) => {
    currentUser = user;
    currentGolferProfile = user ? await ensureGolferProfile(user) : null;
    authResolved = true;
    render();
  });
} else {
  authResolved = true; // not configured — don't block the home screen forever
}

// Small inline-SVG line icons (Lucide-style: 24x24, stroke-based) - used instead of emoji so
// nav/account icons render consistently across platforms and can take currentColor/stroke-width
// like real icons. aria-hidden since every usage sits next to its own visible text label.
function svgIcon(name){
  const paths = {
    home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
    menu: '<path d="M3 6h18M3 12h18M3 18h18"/>',
    trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0V4Z"/><path d="M8 5H5a3 3 0 0 0 3 3"/><path d="M16 5h3a3 3 0 0 1-3 3"/><path d="M12 13v3"/><path d="M9 20h6"/><path d="M10 20v-2.5a2 2 0 0 1 4 0V20"/>',
  };
  return `<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.15em;flex-shrink:0;" aria-hidden="true">${paths[name] || ""}</svg>`;
}

// badge/connection/account status row - shared by the plain header and Home's custom hero.
function renderHeaderStatus(badge){

    ? `<span class="badge-live"><span class="dot"></span>live</span>`
    : badge === "final"
      ? `<span class="badge-live" style="color:#fff;opacity:.85;"><span class="dot" style="animation:none;background:#fff;"></span>final</span>`
      : "";

// title/subtitle are escaped here (not by each of mountPage's ~10 callers) since most of them
// pass straight-through user-controlled text (a round's name as the title, its course name as
// the subtitle, etc.) - one choke point here and in renderDesktopShell below covers every
// current and future caller instead of relying on each one to remember.
function renderAppHeader(title, subtitle, badge){
  // badge: "live" | "final" | undefined
  title = escapeHtml(title);
  subtitle = escapeHtml(subtitle);

/* ---------- desktop sidebar dashboard shell ----------
   Same URLs and page content as the phone layout, just a different wrapper above
   DESKTOP_BREAKPOINT. Live scoring entry (renderScorer/renderScoringOnly/renderSpectator)
   never uses this - those stay the single-column phone layout at any width, since Fishing's
   desktop precedent keeps data entry phone-only and only the "review" screens get a desktop
   shell. mountPage() is how every other screen picks a shell; see its call sites. */
const DESKTOP_BREAKPOINT = 1100;
function isDesktopWidth(){ return window.innerWidth >= DESKTOP_BREAKPOINT; }

const DESKTOP_NAV_ITEMS = [
  { route: "home", href: "#/", icon: svgIcon("home"), label: "My rounds" },
  { route: "new-round", href: "#/new-round", icon: svgIcon("plus"), label: "New round" },
  { route: "history", href: "#/history", icon: svgIcon("clock"), label: "History" },
  { route: "competitions", href: "#/competitions", icon: svgIcon("trophy"), label: "Competitions" },
];

// route: which sidebar nav item (if any) to highlight as active - "home" | "new-round" |
// "history" | "account" | null. Competition/standings pages pass null since they're reached
// by clicking into a specific competition, not via a persistent sidebar destination.
function renderDesktopShell({ title, subtitle, badge, route, bodyHtml }){
  title = escapeHtml(title);
  subtitle = escapeHtml(subtitle);
  const online = navigator.onLine;
  const accountLabel = escapeHtml(currentUser ? (currentGolferProfile && currentGolferProfile.name) || currentUser.email || "Account" : "Sign in");
  const navLinksHtml = DESKTOP_NAV_ITEMS.map(item => `
    <a href="${item.href}" class="desktop-nav-link${route === item.route ? " active" : ""}">${item.icon} ${item.label}</a>`).join("");
  const badgeHtml = badge === "live"
    ? `<span class="badge-live" style="color:var(--brand-dark);"><span class="dot" style="background:var(--brand-dark);"></span>live</span>`
    : badge === "final"
      ? `<span class="badge-live" style="color:var(--muted);"><span class="dot" style="animation:none;background:var(--muted);"></span>final</span>`
      : "";
  return `
    <div class="desktop-shell">
      <aside class="desktop-sidebar">
        <div class="desktop-sidebar-head">
          <img src="/golf/icon-header.png" alt="" style="height:30px;width:30px;">
          <strong>PK Golf</strong>
        </div>
        <nav class="desktop-nav">${navLinksHtml}</nav>
        <div class="desktop-sidebar-foot">
          <span class="conn-indicator ${online ? "conn-online" : "conn-offline"}" id="connIndicator">
            <span class="conn-dot"></span>${online ? "Connected" : "Offline"}
          </span>
          <a href="#/account" class="desktop-account-link">${svgIcon("user")} ${accountLabel}</a>
        </div>
      </aside>
      <main class="desktop-main">
        <div class="desktop-main-inner">
          <div class="desktop-topstrip">
            <div>
              <h1>${title}</h1>
              ${subtitle ? `<p class="subtitle">${subtitle}</p>` : ""}
            </div>
            ${badgeHtml}
          </div>
          ${bodyHtml}
        </div>
      </main>
    </div>`;
}

// Shared entry point for the 5 "review" screens (home, history, new-round, account,
// competition/standings) - picks the phone header or the desktop sidebar shell based on
// current width. bodyHtml is exactly what used to go inside <div class="content">...</div>.
// mobileHeroHtml: an optional full replacement for the plain header+content on the phone
// layout only (used by Home's big centered hero) - desktop always uses the normal sidebar
// shell with title/bodyHtml regardless, so it's not plumbed through to renderDesktopShell.
function mountPage({ title, subtitle, badge, route, bodyHtml, mobileHeroHtml }){
  const app = document.getElementById("app");
  app.classList.toggle("app-desktop", isDesktopWidth());
  app.innerHTML = isDesktopWidth()
    ? renderDesktopShell({ title, subtitle, badge, route, bodyHtml })
    : (mobileHeroHtml || `${renderAppHeader(title, subtitle, badge)}<div class="content">${bodyHtml}</div>`);
}

/* ---------- tiny router ---------- */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, "");
  return h.split("/").filter(Boolean);
}
window.addEventListener("hashchange", render);

// Every view opens its own live listeners. Without this, leaving a view left them running and they
// kept re-rendering into whatever page came next (both scorer and spectator draw into #boards).
function stopLiveListeners(){
  [scorerUnsub, scorerBbbUnsub, scorerScrambleUnsub, spectatorUnsub, spectatorBbbUnsub, spectatorScrambleUnsub]
    .forEach(u => { if (u) u(); });
  scorerUnsub = scorerBbbUnsub = scorerScrambleUnsub = null;
  spectatorUnsub = spectatorBbbUnsub = spectatorScrambleUnsub = null;
  siblingUnsubs.forEach(u => u()); siblingUnsubs = [];
  competitionUnsubs.forEach(u => u()); competitionUnsubs = [];
}

async function render(){
  stopLiveListeners();
  const parts = parseHash();
  const app = document.getElementById("app");
  // Only mountPage() (the 5 "review" screens) ever wants the desktop shell - clear it here so
  // it can't leak onto scorer/spectator/sign-in-gate/etc, which stay phone-width at any size.
  // mountPage() re-adds it right after, for the routes that do want it.
  app.classList.remove("app-desktop");

  if (!configured){
    app.innerHTML = `
      ${renderAppHeader("PK Golf", "Setup needed")}
      <div class="content">
      <div class="card">
        <strong>Setup needed</strong>
        <p class="muted">Open this file's &lt;script&gt; section and fill in <code>firebaseConfig</code>
        with your Firebase project's values (Project Settings &gt; General &gt; Your apps), create a
        Firestore database for the project (test mode is fine to start), apply the security rules
        from the setup notes, then reload this page.</p>
      </div>
      </div>`;
    return;
  }

  if (parts[0] === "score" && parts[1]) return renderScorer(parts[1]);
  if (parts[0] === "play" && parts[1]) return renderScoringOnly(parts[1]);
  if (parts[0] === "spectate" && parts[1]) return renderSpectator(parts[1]);
  if (parts[0] === "competition" && parts[1]) return renderCompetition(parts[1]);
  if (parts[0] === "standings" && parts[1]) return renderStandings(parts[1]);
  if (parts[0] === "account") return renderAccount();

  // Home screen requires sign-in, same as PK Fishing's gate — shared round/spectator/
  // scoring links above stay open to anyone with the link regardless of auth state.
  if (!authResolved) return renderAuthLoading();
  if (!currentUser) return renderSignInGate();
  if (parts[0] === "new-round") return renderNewRound();
  if (parts[0] === "history") return renderHistory();
  if (parts[0] === "competitions") return renderCompetitionsList();
  return renderHome();
}

   ACCOUNT VIEW — sign up / sign in / profile

let accountMode = "signin"; // "signin" | "signup" — which form shows when signed out

function renderAccount(){
  mountPage({
    title: "PK Golf",

// Full-screen sign-in gate shown on the home screen when nobody's signed in, matching
// PK Fishing's own gate (big logo, no app header bar behind it). Shared round/spectator/
// scoring links stay open to anyone with the link — only the home screen is gated.
function renderAuthLoading(){
  document.getElementById("app").innerHTML = `<div class="auth-gate"></div>`;
}

function renderSignInGate(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="auth-gate">
      <div class="auth-gate-card" id="authGateCard"></div>
    </div>
  `;
  renderAuthGateCard();
}

function renderAuthGateCard(){
  const card = document.getElementById("authGateCard");
  if (!card) return;
  card.innerHTML = accountMode === "signup" ? signUpFormHtml(true) : signInFormHtml(true);
  wireAccountForm(renderAuthGateCard);
}

function renderAccountCard(){
  const card = document.getElementById("accountCard");
  if (!card) return;

  if (currentUser){
    const name = (currentGolferProfile && currentGolferProfile.name) || "";
    const handicap = currentGolferProfile && currentGolferProfile.handicap;
    const initials = escapeHtml((name || currentUser.email || "?").trim().charAt(0).toUpperCase());
    card.innerHTML = `
      <div class="profile-header">
        <div class="profile-avatar">${initials}</div>
        <h2 class="profile-name">${escapeHtml(name) || "My account"}</h2>
        <p class="profile-handicap">Handicap index: ${handicap != null ? handicap : "–"}</p>
        <p class="muted" style="margin:2px 0 0;">${escapeHtml(currentUser.email) || ""}</p>
      </div>
      <label>Display name</label>
      <input type="text" id="profileName">
      <label>Handicap</label>
      <input type="number" id="profileHandicap">
      <div class="row" style="margin-top:14px;">
        <button id="saveProfileBtn">Save details</button>
        <span id="profileMsg" class="muted"></span>
      </div>
      <div class="row" style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px;">
        <button class="ghost" id="signOutBtn">Sign out</button>
      </div>
    `;
    document.getElementById("profileName").value = (currentGolferProfile && currentGolferProfile.name) || "";
    document.getElementById("profileHandicap").value = (currentGolferProfile && currentGolferProfile.handicap) ?? 0;
    document.getElementById("saveProfileBtn").onclick = async () => {
      const msg = document.getElementById("profileMsg");
      const name = document.getElementById("profileName").value.trim();
      const handicap = parseInt(document.getElementById("profileHandicap").value || "0", 10);
      if (!name){ msg.textContent = "Enter a name."; return; }
      msg.textContent = "Saving…";
      try{
        await saveGolferProfile(currentUser.uid, { name, handicap });
        msg.textContent = "Saved.";
      }catch(err){ msg.textContent = "Error: " + err.message; }
    };
    document.getElementById("signOutBtn").onclick = () => doSignOut();
    return;
  }

  card.innerHTML = accountMode === "signup" ? signUpFormHtml(false) : signInFormHtml(false);
  wireAccountForm();
}

function wireAccountForm(renderCard){
  renderCard = renderCard || renderAccountCard;
  const showSignup = document.getElementById("showSignupLink");
  if (showSignup) showSignup.onclick = () => { accountMode = "signup"; renderCard(); };
  const showSignin = document.getElementById("showSigninLink");
  if (showSignin) showSignin.onclick = () => { accountMode = "signin"; renderCard(); };

  wirePasswordChecklist("signupPassword", "signupPasswordChecklist");

  const forgotLink = document.getElementById("forgotPasswordLink");
  if (forgotLink) forgotLink.onclick = () => {
    const form = document.getElementById("forgotPasswordForm");
    form.style.display = form.style.display === "none" ? "" : "none";
  };
  const forgotSendBtn = document.getElementById("forgotSendBtn");
  if (forgotSendBtn) forgotSendBtn.onclick = async () => {
    const msg = document.getElementById("forgotMsg");
    const email = document.getElementById("forgotEmail").value.trim();
    if (!email){ msg.textContent = "Enter your email."; return; }
    msg.textContent = "Sending…";
    try{ await doForgotPassword(email); msg.textContent = "Check your email for a reset link."; }
    catch(err){ msg.textContent = "Error: " + err.message; }
  };

  const googleBtn = document.getElementById("googleSigninBtn");
  if (googleBtn) googleBtn.onclick = async () => {
    const msg = document.getElementById("accountMsg");
    if (msg) msg.textContent = "Opening Google sign-in…";
    try{ await doGoogleSignIn(); }
    catch(err){ if (msg) msg.textContent = "Error: " + err.message; }
  };

  const signinBtn = document.getElementById("signinBtn");
  if (signinBtn) signinBtn.onclick = async () => {
    const msg = document.getElementById("accountMsg");
    const email = document.getElementById("signinEmail").value.trim();
    const password = document.getElementById("signinPassword").value;
    if (!email || !password){ msg.textContent = "Enter your email and password."; return; }
    msg.textContent = "Signing in…";
    try{ await doSignIn(email, password, document.getElementById("keepSignedIn").checked); }
    catch(err){ msg.textContent = "Error: " + err.message; }
  };

  const signupBtn = document.getElementById("signupBtn");
  if (signupBtn) signupBtn.onclick = async () => {
    const msg = document.getElementById("accountMsg");
    const name = document.getElementById("signupName").value.trim();
    const email = document.getElementById("signupEmail").value.trim();
    const password = document.getElementById("signupPassword").value;
    if (!name){ msg.textContent = "Enter your name."; return; }
    if (!email || !password){ msg.textContent = "Enter an email and password."; return; }
    const pwProblem = passwordProblem(password);
    if (pwProblem){ msg.textContent = pwProblem; return; }
    msg.textContent = "Creating account…";
    try{ await doSignUp(name, 0, email, password, true); }
    catch(err){ msg.textContent = "Error: " + err.message; }
  };
}

function refreshPairingOptions(){
  const box = document.getElementById("pairingOptions");
  if (!box) return;
  const positions = [1,2,3,4].map(i => ({
    pos: i,
    name: document.getElementById(`p${i}-name`).value.trim() || `Player ${i}`,
    team: document.getElementById(`p${i}-team`).value
  }));
  const teamA = positions.filter(p => p.team === "A");
  const teamB = positions.filter(p => p.team === "B");
  if (teamA.length !== 2 || teamB.length !== 2){
    box.innerHTML = `<p class="muted" style="font-size:.78rem;">Piekfyn needs exactly 2 players on Team A and 2 on Team B (set above).</p>`;
    return;
  }
  const [a1, a2] = teamA, [b1, b2] = teamB;
  const opt1 = [{a:a1.pos,b:b1.pos},{a:a2.pos,b:b2.pos}];
  const opt2 = [{a:a1.pos,b:b2.pos},{a:a2.pos,b:b1.pos}];
  box.innerHTML = `
    <div class="checkbox-row">
      <input type="radio" name="pairingChoice" id="pairing1" value='${JSON.stringify(opt1)}' checked>
      <label style="margin:0" for="pairing1">${escapeHtml(a1.name)} vs ${escapeHtml(b1.name)} &nbsp;·&nbsp; ${escapeHtml(a2.name)} vs ${escapeHtml(b2.name)}</label>
    </div>
    <div class="checkbox-row">
      <input type="radio" name="pairingChoice" id="pairing2" value='${JSON.stringify(opt2)}'>
      <label style="margin:0" for="pairing2">${escapeHtml(a1.name)} vs ${escapeHtml(b2.name)} &nbsp;·&nbsp; ${escapeHtml(a2.name)} vs ${escapeHtml(b1.name)}</label>
    </div>`;
}

// Hole-by-hole Par/S.I. editor, used both on the New Round form and the round-edit screen.
// Laid out as one row per hole (Hole / Par / S.I.), split into Front 9 / Back 9 side by side —
// far easier to read and tap on a phone than the old 18-column table that needed horizontal
// scrolling and had cells too small to hit accurately.
function holesEditorHtml(parClass, siClass, parFor, siFor){
  function half(title, startHole){
    const rows = Array.from({length: 9}, (_, i) => {
      const n = startHole + i;
      return `
        <tr>
          <td class="hole-num-col">${n}</td>
          <td><input class="hole-input ${parClass}" data-hole="${n}" type="number" inputmode="numeric" value="${parFor(n)}" onfocus="this.select()"></td>
          <td><input class="hole-input ${siClass}" data-hole="${n}" type="number" inputmode="numeric" value="${siFor(n)}" onfocus="this.select()"></td>
        </tr>`;
    }).join("");
    return `
      <div>
        <p class="holes-editor-label">${title}</p>
        <table class="holes-table">
          <thead><tr><th>Hole</th><th>Par</th><th>S.I.</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }
  return `<div class="grid-2 holes-editor-grid">${half("Front 9", 1)}${half("Back 9", 10)}</div>`;
}

// Read-only version of the same layout, for the Schedule tab where holes are shown but not edited.
function holesReadOnlyHtml(holes){
  const byHole = {};
  holes.forEach(h => { byHole[h.holeNumber] = h; });
  function half(title, startHole){
    const rows = Array.from({length: 9}, (_, i) => {
      const n = startHole + i;
      const h = byHole[n] || {};
      return `<tr><td class="hole-num-col">${n}</td><td>${h.par ?? "-"}</td><td>${h.strokeIndex ?? "-"}</td></tr>`;
    }).join("");
    return `
      <div>
        <p class="holes-editor-label">${title}</p>
        <table class="holes-table">
          <thead><tr><th>Hole</th><th>Par</th><th>S.I.</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }
  return `<div class="grid-2 holes-editor-grid">${half("Front 9", 1)}${half("Back 9", 10)}</div>`;
}

// The installed app always reopens at /golf (the #/score/... part of the address is lost), and the
// home screen used to list only competitions - so a standalone round could only be reached through
// Playing history. Remember the round being scored on this device so Home can offer it straight away.
function rememberRound(round, route){
  try{ localStorage.setItem("pkgolf_last_round", JSON.stringify({ id: round.id, route })); } catch(e){}
}
function recallRound(){
  try{ return JSON.parse(localStorage.getItem("pkgolf_last_round") || "null"); } catch(e){ return null; }
}
async function loadCurrentRounds(){
  const routeById = {};
  const found = {};
  if (currentUser){
    try{
      (await loadMyRoundsList(currentUser.uid))
        .filter(r => !r.deleted && r.status !== "finished" && !r.competitionId)
        .forEach(r => { found[r.id] = r; routeById[r.id] = "score"; });
    } catch(e){}
  }
  const last = recallRound();
  if (last && last.id && !found[last.id]){
    try{
      const snap = await getDoc(doc(db, "golf_rounds", last.id));
      if (snap.exists()){
        const r = { id: snap.id, ...snap.data() };
        if (!r.deleted && r.status !== "finished"){ found[r.id] = r; routeById[r.id] = last.route === "play" ? "play" : "score"; }
      }
    } catch(e){}
  }
  return Object.values(found)
    .sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0))
    .map(r => ({ r, route: routeById[r.id] }));
}

// One circular stat badge for a round card (GolfPad-style). ringPct (0-100), when given, draws
// a colored progress ring (used for "thru" holes completed); omitted it's just a plain outline.
function statRingHtml(value, label, ringPct, complete){
  const circumference = 125.6; // 2 * pi * r(20)
  const ring = ringPct != null
    ? `<circle class="stat-ring-progress${complete ? " complete" : ""}" cx="24" cy="24" r="20" style="stroke-dasharray:${(ringPct / 100 * circumference).toFixed(1)} ${circumference};"></circle>`
    : "";
  return `
    <div class="stat-ring">
      <svg class="stat-ring-svg" viewBox="0 0 48 48"><circle class="stat-ring-track" cx="24" cy="24" r="20"></circle>${ring}</svg>
      <span class="stat-ring-value">${value}</span>
      <span class="stat-ring-label">${label}</span>
    </div>`;
}

// Stat badges for one "My rounds" card: real gross/net score + holes-completed progress ring,
// fetched via loadRoundScoreSummary. Falls back to the plain Final/Active pill when there's no
// "my score" to show (creator was marking-only, or nothing's been scored yet).
function roundCardStatsHtml(r, summary){
  if (!summary || summary.thru === 0){
    return `<span class="pill mode" style="background:${r.status==='finished' ? 'var(--brand-dim)' : 'var(--gold-dim)'};">${r.status === "finished" ? "Final" : "Active"}</span>`;
  }
  const pct = Math.round(summary.thru / summary.totalHoles * 100);
  return `<div class="round-card-stats">
    ${statRingHtml(summary.gross, "Score")}
    ${statRingHtml(summary.net, "Net")}
    ${statRingHtml(`${summary.thru}/${summary.totalHoles}`, "Thru", pct, summary.thru === summary.totalHoles)}
  </div>`;
}

      ? "More than 1 links the fourballs into one Piekfyn competition with a combined team score. Individual match pairings below are for Fourball 1; extra fourballs default to pairing by team position (adjust afterward from that fourball's Schedule tab if needed)."
      : isMatchStyle
        ? "More than 1 runs several separate head-to-head groups side by side — each keeps its own result, players and scoring link, but they aren't combined into one ranking."
        : "More than 1 groups the fourballs into one competition with a combined leaderboard, plus its own scoring link for each fourball.";
    if (isPiekfyn) refreshPairingOptions();
    document.querySelectorAll(".team-col").forEach(col => { col.style.display = isTeamMode ? "" : "none"; });
    // 3-way match play needs exactly 3 player slots per group instead of 4 -
    // re-render whenever the mode changes (not just when the fourball count does).
    renderPlayersBox();
  }
  document.querySelectorAll('input[name="gameMode"]').forEach(radio => {
    radio.addEventListener("change", updateModeVisibility);
  });

  // Fourball 1 always uses the plain p{i}-* ids (unchanged, so every existing single-round
  // code path — validation, single-round creation, Piekfyn's own pairing picker — keeps working
  // untouched). Fourball 2+ use fb{fb}-p{i}-* ids instead.
  function playerFieldId(fb, i, field){
    return (fb === 1 ? `p${i}` : `fb${fb}-p${i}`) + `-${field}`;
  }
  let playerFieldMemory = {};
  function renderPlayersBox(){
    const fourballCount = parseInt(document.getElementById("fourballCount").value, 10) || 1;
    const selectedMode = document.querySelector('input[name="gameMode"]:checked')?.value;
    const playerCount = playerCountForMode(selectedMode);
    const playerSlots = Array.from({length: playerCount}, (_,i) => i+1);
    const playersBox = document.getElementById("playersBox");

    // Remember anything already typed, accumulating across every change — so a fourball's
    // details survive even if the count is shrunk past it and later grown back to it again.
    playersBox.querySelectorAll("input.p-name, input.p-hcp, select.p-team, input.fb-tee-time").forEach(el => {
      if (el.value) playerFieldMemory[el.id] = el.value;
    });

    const teeTimeLabel = document.getElementById("teeTimeLabel");
    if (teeTimeLabel) teeTimeLabel.textContent = fourballCount > 1 ? "Fourball 1 tee time" : "Tee time";

    // Fourball 1's tee time is the field up in Round details, above; every other fourball gets
    // its own here, since tournaments commonly stagger tee-off times between groups.
    const teeTimeField = (fb) => fb === 1 ? "" : `
      <div style="max-width:220px;margin-bottom:8px;">
        <label>Fourball ${fb} tee time</label>
        <input type="text" class="fb-tee-time" id="fb${fb}-teeTime" placeholder="e.g. 07:40">
      </div>`;

    const oneFourballHtml = (fb) => teeTimeField(fb) + playerSlots.map(i => `
      <div class="grid-2" style="margin-bottom:8px;">
        <div>
          <label>Player ${i} name</label>
          <input type="text" class="p-name" id="${playerFieldId(fb,i,'name')}" placeholder="Player ${i}">
        </div>
        <div class="row" style="gap:8px;">
          <div style="flex:1">
            <label>Playing handicap</label>
            <input type="number" class="p-hcp" id="${playerFieldId(fb,i,'hcp')}" value="0">
          </div>
          <div class="team-col" style="flex:1;display:none;">
            <label>Team</label>
            <select class="p-team" id="${playerFieldId(fb,i,'team')}">
              <option value="A" ${i<=2?"selected":""}>A</option>
              <option value="B" ${i>2?"selected":""}>B</option>
            </select>
          </div>
        </div>
      </div>`).join("");

    playersBox.innerHTML = Array.from({length: fourballCount}, (_,idx) => {
      const fb = idx + 1;
      const heading = fourballCount > 1
        ? `<p class="muted" style="font-weight:700;color:var(--ink);margin:${fb===1?"0":"16px"} 0 4px;">Fourball ${fb}</p>`
        : "";
      return heading + oneFourballHtml(fb);
    }).join("");

    Object.entries(playerFieldMemory).forEach(([id, value]) => {
      const el = document.getElementById(id);
      if (el) el.value = value;
    });

    playerSlots.forEach(i => {
      document.getElementById(`p${i}-name`).addEventListener("input", refreshPairingOptions);
      const teamSel = document.getElementById(`p${i}-team`);
      if (teamSel) teamSel.addEventListener("change", refreshPairingOptions);
    });

    document.querySelectorAll(".team-col").forEach(col => {
      col.style.display = (selectedMode === "matchplay" || selectedMode === "piekfyn" || selectedMode === "betterball") ? "" : "none";
    });
  }
  renderPlayersBox();
  document.getElementById("fourballCount").addEventListener("change", renderPlayersBox);

  // Pre-fill Player 1 from the signed-in golfer's saved profile — still editable,
  // just saves re-typing your own name and handicap every round.
  if (currentUser && currentGolferProfile){
    const p1Name = document.getElementById("p1-name");
    const p1Hcp = document.getElementById("p1-hcp");
    if (p1Name && !p1Name.value) p1Name.value = currentGolferProfile.name || "";
    if (p1Hcp && (!p1Hcp.value || p1Hcp.value === "0") && currentGolferProfile.handicap){
      p1Hcp.value = currentGolferProfile.handicap;
    }
  }

  updateModeVisibility();

  const holesTable = document.getElementById("holesTable");
  function buildHolesTable(){
    holesTable.innerHTML = holesEditorHtml("h-par", "h-si", () => 4, n => n);
  }
  buildHolesTable();

  document.getElementById("createBtn").onclick = createRound;
}

function readPlayersForFourball(fb, playerCount){
  const slots = Array.from({length: playerCount || 4}, (_,i) => i+1);
  return slots.map(i => {
    const idPrefix = fb === 1 ? `p${i}` : `fb${fb}-p${i}`;
    const teamEl = document.getElementById(`${idPrefix}-team`);
    return {
      name: document.getElementById(`${idPrefix}-name`).value.trim() || `Fourball ${fb} · Player ${i}`,
      playingHandicap: parseInt(document.getElementById(`${idPrefix}-hcp`).value || "0", 10),
      team: teamEl ? teamEl.value : null,
      sortOrder: i
    };
  });
}

function readTeeTimeForFourball(fb){
  const el = document.getElementById(fb === 1 ? "teeTime" : `fb${fb}-teeTime`);
  return el ? el.value.trim() : "";
}

async function createRound(){
  const msg = document.getElementById("createMsg");
  const roundName = document.getElementById("roundName").value.trim() || "Fourball";
  const courseName = document.getElementById("courseName").value.trim() || "Course";
  const roundDate = document.getElementById("roundDate").value.trim();
  const teeTime = document.getElementById("teeTime").value.trim();
  const teeBox = document.getElementById("teeBox").value;
  const courseRatingVal = parseFloat(document.getElementById("courseRating").value);
  const slopeRatingVal = parseInt(document.getElementById("slopeRating").value, 10);
  const ratingSlope = (!isNaN(courseRatingVal) && !isNaN(slopeRatingVal)) ? { courseRating: courseRatingVal, slopeRating: slopeRatingVal } : null;
  const modes = Array.from(document.querySelectorAll(".mode-cb:checked")).map(cb => cb.value);
  if (modes.length === 0){ msg.textContent = "Pick at least one game mode."; return; }
  const allianceCount = parseInt(document.getElementById("allianceCount").value, 10);
  const scrambleDrive = (modes.includes("alliance") || modes.includes("betterball")) && document.getElementById("scrambleDriveCb").checked;
  const scrambleDriveParTypes = scrambleDrive
    ? Array.from(document.querySelectorAll(".scramble-par-cb:checked")).map(cb => parseInt(cb.value, 10))
    : [];
  const fourballCount = parseInt(document.getElementById("fourballCount").value, 10) || 1;

  let teamAName = null, teamBName = null, piekfynPairs = null, teamColorStyle = null, teamAColor = null, teamBColor = null;
  if (modes.includes("piekfyn")){
    const teamACount = [1,2,3,4].filter(i => document.getElementById(`p${i}-team`).value === "A").length;
    const teamBCount = [1,2,3,4].filter(i => document.getElementById(`p${i}-team`).value === "B").length;
    if (teamACount !== 2 || teamBCount !== 2){
      msg.textContent = "Piekfyn Kompetisie needs exactly 2 players on Team A and 2 on Team B.";
      return;
    }
    const selectedRadio = document.querySelector('input[name="pairingChoice"]:checked');
    if (!selectedRadio){
      msg.textContent = "Couldn't read the pairing choice — check the Piekfyn options above.";
      return;
    }
    teamAName = document.getElementById("teamAName").value.trim() || "Team A";
    teamBName = document.getElementById("teamBName").value.trim() || "Team B";
    teamColorStyle = (document.querySelector('input[name="teamColorStyle"]:checked') || {}).value || "gradient";
    teamAColor = document.getElementById("teamAColor").value;
    teamBColor = document.getElementById("teamBColor").value;
    piekfynPairs = JSON.parse(selectedRadio.value);

    for (let fb = 2; fb <= fourballCount; fb++){
      const aCount = [1,2,3,4].filter(i => document.getElementById(`fb${fb}-p${i}-team`).value === "A").length;
      const bCount = [1,2,3,4].filter(i => document.getElementById(`fb${fb}-p${i}-team`).value === "B").length;
      if (aCount !== 2 || bCount !== 2){
        msg.textContent = `Fourball ${fb} needs exactly 2 players on Team A and 2 on Team B.`;
        return;
      }
    }
  }

  const playerCount = playerCountForMode(modes[0]);
  const players = Array.from({length: playerCount}, (_,idx) => idx+1).map(i => ({
    name: document.getElementById(`p${i}-name`).value.trim() || `Player ${i}`,
    playingHandicap: parseInt(document.getElementById(`p${i}-hcp`).value || "0", 10),
    team: document.getElementById(`p${i}-team`).value,
    sortOrder: i
  }));

  const holes = Array.from({length:18},(_,i)=>{
    const n = i+1;
    const hole = {
      holeNumber: n,
      par: parseInt(document.querySelector(`.h-par[data-hole="${n}"]`).value || "4", 10),
      strokeIndex: parseInt(document.querySelector(`.h-si[data-hole="${n}"]`).value || String(n), 10),
    };
    const yards = golfcoreSourceSelected && golfcoreSourceSelected.holesYards && golfcoreSourceSelected.holesYards[n];
    if (yards) hole.yards = yards;
    return hole;
  });

  const creatorIsPlaying = (document.querySelector('input[name="creatorRole"]:checked') || {}).value !== "marking";

  msg.textContent = "Creating…";
  try{
    if (fourballCount > 1){
      const playersByFourball = Array.from({length: fourballCount}, (_, idx) => readPlayersForFourball(idx + 1, playerCount));
      const teeTimesByFourball = Array.from({length: fourballCount}, (_, idx) => readTeeTimeForFourball(idx + 1));
      await createCompetition({
        roundName, courseName, roundDate, teeBox, modes, allianceCount, scrambleDrive, scrambleDriveParTypes,
        teamAName, teamBName, teamColorStyle, teamAColor, teamBColor, piekfynPairs, playersByFourball, teeTimesByFourball, holes, fourballCount, creatorIsPlaying, ratingSlope
      });
      return;
    }

    const spectatorCode = Math.random().toString(36).slice(2,8);

    const roundRef = await addDoc(collection(db, "golf_rounds"), {
      name: roundName, courseName, roundDate, teeTime, teeBox, gameModes: modes, allianceCount, scrambleDrive, scrambleDriveParTypes,
      teamAName, teamBName, teamColorStyle, teamAColor, teamBColor, piekfynPairs, spectatorCode, ownerUid: currentUser ? currentUser.uid : null, creatorIsPlaying,
      status: "active", deleted: false, startedAt: null, finishedAt: null, createdAt: serverTimestamp()
    });

    const batch = writeBatch(db);
    holes.forEach(h => {
      batch.set(doc(db, "golf_rounds", roundRef.id, "holes", String(h.holeNumber)), h);
    });
    const playerIds = [];
    players.forEach(p => {
      const pRef = doc(collection(db, "golf_rounds", roundRef.id, "players"));
      playerIds.push(pRef.id);
      batch.set(pRef, p);
    });
    await batch.commit();
    await saveCourseToDatabase(courseName, holes, golfcoreSourceSelected, golfcoreSourceSelected, ratingSlope);

    location.hash = `#/score/${roundRef.id}`;
  } catch(err){
    msg.textContent = "Error: " + err.message;
  }
}

// Pairs the two Team A players against the two Team B players by position — the same rule the
// setup screen's own pairing picker uses for Fourball 1 — based on whatever teams were actually
// entered for this fourball, rather than assuming a fixed layout.
function defaultPairsFor(players){
  const teamA = players.filter(p => p.team === "A");
  const teamB = players.filter(p => p.team === "B");
  if (teamA.length !== 2 || teamB.length !== 2) return [{a:1,b:3},{a:2,b:4}];
  return [{a:teamA[0].sortOrder,b:teamB[0].sortOrder},{a:teamA[1].sortOrder,b:teamB[1].sortOrder}];
}

async function createCompetition(cfg){
  const {
    roundName, courseName, roundDate, teeBox, modes, allianceCount, scrambleDrive, scrambleDriveParTypes,
    teamAName, teamBName, teamColorStyle, teamAColor, teamBColor, piekfynPairs, playersByFourball, teeTimesByFourball, holes, fourballCount, creatorIsPlaying, ratingSlope
  } = cfg;
  const isPiekfyn = modes.includes("piekfyn");

  const compRef = await addDoc(collection(db, "golf_competitions"), {
    name: roundName, teamAName: isPiekfyn ? teamAName : null, teamBName: isPiekfyn ? teamBName : null,
    teamColorStyle: isPiekfyn ? teamColorStyle : null,
    teamAColor: isPiekfyn ? teamAColor : null, teamBColor: isPiekfyn ? teamBColor : null,
    courseName, roundDate, teeTime: teeTimesByFourball[0] || "", teeBox,
    fourballCount, gameModes: modes, createdAt: serverTimestamp()
  });

  for (let fb = 1; fb <= fourballCount; fb++){
    const isFirst = fb === 1;
    const spectatorCode = Math.random().toString(36).slice(2,8);
    const roundRef = await addDoc(collection(db, "golf_rounds"), {
      name: `${roundName} — Fourball ${fb}`, courseName, roundDate, teeTime: teeTimesByFourball[fb - 1] || "", teeBox,
      gameModes: modes, allianceCount, scrambleDrive, scrambleDriveParTypes,
      teamAName: isPiekfyn ? teamAName : null, teamBName: isPiekfyn ? teamBName : null,
      teamColorStyle: isPiekfyn ? teamColorStyle : null,
      teamAColor: isPiekfyn ? teamAColor : null, teamBColor: isPiekfyn ? teamBColor : null,
      piekfynPairs: isPiekfyn ? (isFirst ? piekfynPairs : defaultPairsFor(playersByFourball[fb - 1])) : null,
      spectatorCode, competitionId: compRef.id, fourballIndex: fb, ownerUid: currentUser ? currentUser.uid : null, creatorIsPlaying,
      status: "active", deleted: false, startedAt: null, finishedAt: null, createdAt: serverTimestamp()
    });

    const batch = writeBatch(db);
    holes.forEach(h => batch.set(doc(db, "golf_rounds", roundRef.id, "holes", String(h.holeNumber)), h));
    playersByFourball[fb - 1].forEach(p => {
      const pRef = doc(collection(db, "golf_rounds", roundRef.id, "players"));
      batch.set(pRef, p);
    });
    await batch.commit();
  }

  await saveCourseToDatabase(courseName, holes, golfcoreSourceSelected, golfcoreSourceSelected, ratingSlope);
  location.hash = `#/competition/${compRef.id}`;
}

let scorerData = null; // {round, holes, players, scores}

let currentBundle = null; // whichever bundle (scorer or spectator) is currently on screen — used for scorecard lookups
let scorerUnsub = null;
