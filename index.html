<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PK Golf</title>
<style>
  :root{
    --ink:#1a1a1a;
    --paper:#ffffff;
    --line:#e0d5d5;
    --green-dark:#7a0f0f;
    --green:#a11212;
    --green-light:#c41818;
    --green-dim:#fbe9e9;
    --gold:#a11212;
    --gold-dim:#fbe9e9;
    --red:#3a3a3a;
    --muted:#7a7a7a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  .wrap{max-width:960px;margin:0 auto;padding:0 0 80px;}
  .content{padding:20px 16px 0;}
  .app-header{
    background:linear-gradient(135deg, var(--green-dark), var(--green));
    color:var(--gold-dim);
    padding:18px 16px 16px;
    border-bottom:3px solid var(--gold);
  }
  .app-header h1{color:#fff;margin:0 0 2px;font-size:1.3rem;letter-spacing:-0.01em;}
  .app-header .subtitle{color:var(--gold-dim);opacity:.85;margin:0;font-size:.85rem;}
  .app-header .top-bar{margin-bottom:0;}
  h2{font-size:1.02rem;margin:22px 0 10px;color:var(--green-dark);border-bottom:2px solid var(--gold-dim);padding-bottom:6px;font-weight:700;}
  label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px;margin-top:12px;}
  input[type=text], input[type=number], select{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;
    background:#fff;font-size:.95rem;color:var(--ink);
  }
  input:focus, select:focus{outline:2px solid var(--green-light);outline-offset:1px;}
  button{
    font-family:inherit;font-size:.9rem;font-weight:600;
    border:1px solid var(--green-dark);background:var(--green-dark);color:var(--gold-dim);
    padding:9px 16px;border-radius:6px;cursor:pointer;
  }
  button.secondary{background:transparent;color:var(--green-dark);}
  button.ghost{background:transparent;color:var(--muted);border-color:var(--line);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:#fff;}
  table{width:100%;border-collapse:collapse;font-size:.85rem;}
  th,td{border:1px solid var(--line);padding:5px 6px;text-align:center;}
  th{background:var(--green-dark);font-weight:600;font-size:.75rem;color:#fff;}
  td.name-col, th.name-col{text-align:left;min-width:110px;}
  .hole-input{width:52px;padding:6px 2px;text-align:center;font-size:1rem;}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:600;}
  .pill.mode{background:var(--gold-dim);color:var(--green-dark);margin:2px 4px 2px 0;border:1px solid var(--gold);}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin:8px 0;}
  .checkbox-row input{width:auto;}
  .link-box{display:flex;gap:8px;align-items:center;background:var(--gold-dim);border:1px solid var(--gold);border-radius:8px;padding:10px 12px;margin-top:8px;}
  .link-box input{background:#fff;font-size:.8rem;}
  .muted{color:var(--muted);font-size:.82rem;}
  .team-a{color:var(--green-light);font-weight:600;}
  .team-b{color:var(--ink);font-weight:700;}
  .status-up{color:var(--green-light);font-weight:700;}
  .status-down{color:var(--red);font-weight:700;}
  .status-all-sq{color:var(--muted);font-weight:700;}
  .leader-row{font-weight:700;background:var(--gold-dim);}
  .top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
  .badge-live{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;color:var(--gold);}
  .conn-indicator{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;opacity:.85;}
  .conn-indicator.conn-online{color:#8fd9a8;}
  .conn-indicator.conn-offline{color:#ffb4a8;}
  .conn-dot{width:6px;height:6px;border-radius:50%;}
  .conn-online .conn-dot{background:#4caf50;}
  .conn-offline .conn-dot{background:#e05a4a;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
  .hole-nav{display:flex;align-items:center;gap:10px;margin:10px 0;}
  .hole-nav button{padding:6px 10px;}
  .hole-nav .current{font-weight:700;font-size:1.05rem;min-width:110px;text-align:center;color:var(--green-dark);}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  @media (max-width:600px){.grid-2{grid-template-columns:1fr;}}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  @media (max-width:600px){.grid-3{grid-template-columns:1fr;}}
  .config-note{font-size:.78rem;color:var(--muted);border:1px dashed var(--line);padding:8px 10px;border-radius:8px;margin-bottom:16px;}
  a{color:var(--green-light);}

  /* tab bar, matching the tabbed layout of the other apps */
  .tab-bar{
    display:flex;gap:4px;background:var(--green-dark);
    padding:4px;margin:0;position:sticky;top:0;z-index:5;
  }
  .tab-btn{
    flex:1;background:transparent;border:none;color:var(--gold-dim);
    padding:10px 8px;font-size:.85rem;font-weight:600;border-radius:6px;opacity:.7;
  }
  .tab-btn.active{background:var(--gold);color:var(--green-dark);opacity:1;}

  /* clickable player names */
  .player-name-link{color:var(--green-light);cursor:pointer;font-weight:700;text-decoration:underline;text-decoration-style:dotted;}
  .player-name-link:hover{color:var(--green-dark);}
  .team-scorecard-link{color:var(--green-light);cursor:pointer;font-weight:700;text-decoration:underline;text-decoration-style:dotted;margin-top:6px;font-size:.85rem;}
  .team-scorecard-link:hover{color:var(--green-dark);}
  .circled-score{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:20px;height:20px;border-radius:50%;
    border:2px solid var(--green-dark);background:var(--gold-dim);
    font-weight:800;padding:0 2px;margin-top:2px;font-size:.75rem;
  }
  .shot-count{font-size:.65rem;color:var(--muted);line-height:1;}
  .pts-plain{display:inline-block;margin-top:2px;font-weight:700;font-size:.75rem;}

  /* individual scorecard modal */
  .scorecard-overlay{
    position:fixed;inset:0;background:rgba(20,10,10,.6);z-index:50;
    display:flex;align-items:flex-start;justify-content:center;
    padding:16px;overflow-y:auto;
  }
  .scorecard-panel{
    background:#fffdf8;border-radius:10px;max-width:820px;width:100%;
    padding:18px 16px 20px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.35);
    border:2px solid var(--green-dark);
  }
  .scorecard-close{
    position:absolute;top:8px;right:10px;background:transparent;border:none;
    color:var(--muted);font-size:1.4rem;cursor:pointer;padding:4px 10px;line-height:1;
  }
  .scorecard-heading{text-align:center;margin-bottom:12px;}
  .scorecard-heading .course{font-weight:700;color:var(--green-dark);font-size:1.05rem;letter-spacing:.02em;text-transform:uppercase;}
  .scorecard-heading .meta{color:var(--muted);font-size:.78rem;margin-top:2px;}
  .scorecard-player-name{font-size:1.3rem;font-weight:800;color:var(--ink);text-align:center;margin:6px 0 14px;}
  .scorecard-table-wrap{overflow-x:auto;}
  table.scorecard-table{width:100%;border-collapse:collapse;font-size:.72rem;}
  table.scorecard-table th, table.scorecard-table td{
    border:1px solid var(--line);padding:5px 3px;text-align:center;min-width:24px;
  }
  table.scorecard-table th.label-col, table.scorecard-table td.label-col{
    text-align:left;min-width:64px;font-weight:700;background:var(--gold-dim);position:sticky;left:0;
  }
  table.scorecard-table thead th{background:var(--green-dark);color:#fff;font-size:.68rem;}
  table.scorecard-table td.agg-col, table.scorecard-table th.agg-col{background:var(--gold-dim);font-weight:800;}
  table.scorecard-table tr.gross-row td{font-weight:800;font-size:.8rem;color:var(--green-dark);}
  table.scorecard-table tr.gross-row td.label-col{background:var(--green-dim);}
  .scorecard-summary{display:flex;justify-content:center;gap:22px;margin-top:14px;flex-wrap:wrap;}
  .scorecard-summary div{text-align:center;}
  .scorecard-summary .val{font-size:1.3rem;font-weight:800;color:var(--green-dark);}
  .scorecard-summary .lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script type="module">
/* ======================= CONFIG =======================
   Firebase config is public-by-design (security lives in
   Firestore rules, not this key) — fine to leave hardcoded
   once you've filled it in from Project Settings > General
   > Your apps > SDK setup and configuration.
*/
const firebaseConfig = {
  apiKey: "AIzaSyBXE-xMV0-p1WPt_o5a7NTUnHsJngLK-yc",
  authDomain: "pk-golf-9ba98.firebaseapp.com",
  projectId: "pk-golf-9ba98",
  storageBucket: "pk-golf-9ba98.firebasestorage.app",
  messagingSenderId: "51812040569",
  appId: "1:51812040569:web:05e4b66a9480b9793639a8"
};
/* ======================================================= */

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, addDoc, getDoc, getDocs, updateDoc, deleteDoc,
  query, where, orderBy, onSnapshot, writeBatch, serverTimestamp, limit
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const configured = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("YOUR_");
let db = null;
if (configured){
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
}

const GAME_MODES = [
  { key: "stroke",     label: "Stroke play (gross/net)" },
  { key: "stableford",  label: "Stableford" },
  { key: "matchplay",  label: "Match play (2 v 2)" },
  { key: "betterball", label: "Betterball Stableford" },
  { key: "alliance",   label: "Alliance" },
  { key: "bbb",        label: "Bingo Bango Bongo" },
  { key: "piekfyn",    label: "Piekfyn Kompetisie" },
];

const TEE_BOXES = ["White", "Yellow", "Red", "Blue", "Black", "Gold"];
function teeBoxOptions(selected){
  return TEE_BOXES.map(t => `<option value="${t}" ${t === selected ? "selected" : ""}>${t}</option>`).join("");
}

/* ---------- scoring helpers ---------- */
function strokesReceived(hcp, si){
  hcp = Math.max(0, hcp|0);
  const base = Math.floor(hcp / 18);
  const remainder = hcp % 18;
  return base + (si <= remainder ? 1 : 0);
}
function stablefordPoints(par, netStrokes){
  if (netStrokes == null) return null;
  const diff = netStrokes - par;
  return Math.max(2 - diff, 0);
}
function fmtDiff(n){
  if (n > 0) return "+" + n;
  if (n === 0) return "E";
  return String(n);
}

/* ---------- course database (golf_courses) ---------- */
function slugify(name){
  return (name || "course").toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "course";
}
async function saveCourseToDatabase(courseName, holes){
  const slug = slugify(courseName);
  await setDoc(doc(db, "golf_courses", slug), {
    name: courseName,
    holes: holes.map(h => ({ holeNumber: h.holeNumber, par: h.par, strokeIndex: h.strokeIndex })),
    updatedAt: serverTimestamp()
  });
}
async function loadCoursesList(){
  const snap = await getDocs(collection(db, "golf_courses"));
  return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => a.name.localeCompare(b.name));
}
async function loadRoundsList(){
  try{
    const snap = await getDocs(query(collection(db, "golf_rounds"), orderBy("createdAt", "desc"), limit(25)));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(err){
    // orderBy needs the field on every doc; fall back to unordered if that ever fails
    const snap = await getDocs(collection(db, "golf_rounds"));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }
}

async function loadCompetitionsList(){
  try{
    const snap = await getDocs(query(collection(db, "golf_competitions"), orderBy("createdAt", "desc"), limit(10)));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(err){
    const snap = await getDocs(collection(db, "golf_competitions"));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }
}

/* ---------- shared header ---------- */
function renderAppHeader(title, subtitle, badge){
  // badge: "live" | "final" | undefined
  const badgeHtml = badge === "live"
    ? `<span class="badge-live"><span class="dot"></span>live</span>`
    : badge === "final"
      ? `<span class="badge-live" style="color:#fff;opacity:.85;"><span class="dot" style="animation:none;background:#fff;"></span>final</span>`
      : "";
  const online = navigator.onLine;
  const connHtml = `<span class="conn-indicator ${online ? "conn-online" : "conn-offline"}" id="connIndicator">
    <span class="conn-dot"></span>${online ? "Connected" : "Offline"}
  </span>`;
  return `
    <div class="app-header">
      <div class="top-bar">
        <div>
          <h1>⛳ ${title}</h1>
          <p class="subtitle">${subtitle || ""}</p>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
          ${badgeHtml}
          ${connHtml}
        </div>
      </div>
    </div>`;
}

/* ---------- tiny router ---------- */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, "");
  return h.split("/").filter(Boolean);
}
window.addEventListener("hashchange", render);

async function render(){
  const parts = parseHash();
  const app = document.getElementById("app");

  if (!configured){
    app.innerHTML = `
      ${renderAppHeader("PK Golf", "Setup needed")}
      <div class="content">
      <div class="card">
        <strong>Setup needed</strong>
        <p class="muted">Open this file's &lt;script&gt; section and fill in <code>firebaseConfig</code>
        with your Firebase project's values (Project Settings &gt; General &gt; Your apps), create a
        Firestore database for the project (test mode is fine to start), apply the security rules
        from the setup notes, then reload this page.</p>
      </div>
      </div>`;
    return;
  }

  if (parts[0] === "score" && parts[1]) return renderScorer(parts[1]);
  if (parts[0] === "play" && parts[1]) return renderScoringOnly(parts[1]);
  if (parts[0] === "spectate" && parts[1]) return renderSpectator(parts[1]);
  if (parts[0] === "competition" && parts[1]) return renderCompetition(parts[1]);
  if (parts[0] === "standings" && parts[1]) return renderStandings(parts[1]);
  return renderSetup();
}

/* ============================================================
   SETUP VIEW — create a round
   ============================================================ */
function refreshPairingOptions(){
  const box = document.getElementById("pairingOptions");
  if (!box) return;
  const positions = [1,2,3,4].map(i => ({
    pos: i,
    name: document.getElementById(`p${i}-name`).value.trim() || `Player ${i}`,
    team: document.getElementById(`p${i}-team`).value
  }));
  const teamA = positions.filter(p => p.team === "A");
  const teamB = positions.filter(p => p.team === "B");
  if (teamA.length !== 2 || teamB.length !== 2){
    box.innerHTML = `<p class="muted" style="font-size:.78rem;">Piekfyn needs exactly 2 players on Team A and 2 on Team B (set above).</p>`;
    return;
  }
  const [a1, a2] = teamA, [b1, b2] = teamB;
  const opt1 = [{a:a1.pos,b:b1.pos},{a:a2.pos,b:b2.pos}];
  const opt2 = [{a:a1.pos,b:b2.pos},{a:a2.pos,b:b1.pos}];
  box.innerHTML = `
    <div class="checkbox-row">
      <input type="radio" name="pairingChoice" id="pairing1" value='${JSON.stringify(opt1)}' checked>
      <label style="margin:0" for="pairing1">${a1.name} vs ${b1.name} &nbsp;·&nbsp; ${a2.name} vs ${b2.name}</label>
    </div>
    <div class="checkbox-row">
      <input type="radio" name="pairingChoice" id="pairing2" value='${JSON.stringify(opt2)}'>
      <label style="margin:0" for="pairing2">${a1.name} vs ${b2.name} &nbsp;·&nbsp; ${a2.name} vs ${b1.name}</label>
    </div>`;
}

function renderSetup(){
  const app = document.getElementById("app");
  app.innerHTML = `
    ${renderAppHeader("PK Golf", "Set up a round, score it live, share a spectator link.")}
    <div class="content">

    <h2>Existing rounds</h2>
    <div class="card" id="roundsListCard"><p class="muted">Loading…</p></div>

    <h2>New round</h2>
    <div class="card">
      <label>Load saved course (optional)</label>
      <select id="savedCourseSelect"><option value="">— none —</option></select>

      <label>Round name</label>
      <input type="text" id="roundName" placeholder="e.g. Saturday Fourball">
      <label>Course name</label>
      <input type="text" id="courseName" placeholder="e.g. Unika Golf Club">
      <div class="grid-3">
        <div>
          <label>Date</label>
          <input type="text" id="roundDate" placeholder="e.g. 2026-08-29" value="${new Date().toISOString().slice(0,10)}">
        </div>
        <div>
          <label>Tee time</label>
          <input type="text" id="teeTime" placeholder="e.g. 07:30">
        </div>
        <div>
          <label>Tee box</label>
          <select id="teeBox">${teeBoxOptions("White")}</select>
        </div>
      </div>

      <h2>Game mode</h2>
      <div id="modesBox"></div>

      <h2>Players &amp; handicaps</h2>
      <div id="playersBox"></div>

      <h2>Holes — par &amp; stroke index</h2>
      <p class="muted">Quick default fills par 4 / sequential SI — edit any cell, or load a saved course above.</p>
      <div style="overflow-x:auto"><table id="holesTable"></table></div>

      <div class="row" style="margin-top:16px;">
        <button id="createBtn">Create round</button>
        <span id="createMsg" class="muted"></span>
      </div>
    </div>
    </div>
  `;

  function populateCompetitionsList(){
    const card = document.getElementById("competitionsListCard");
    if (!card) return;
    loadCompetitionsList().then(comps => {
      if (comps.length === 0){ card.innerHTML = `<p class="muted">No competitions yet — create one below by naming more than 1 fourball.</p>`; return; }
      card.innerHTML = comps.map(c => `
        <div class="row comp-item" data-comp="${c.id}" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;">
          <div>
            <strong>${c.name}</strong>
            <div class="muted" style="font-size:.78rem;">${c.teamAName || "Team A"} vs ${c.teamBName || "Team B"} · ${c.fourballCount} fourball${c.fourballCount>1?"s":""}${c.courseName ? " · " + c.courseName : ""}</div>
          </div>
          <span class="pill mode" style="background:var(--gold-dim);">View</span>
        </div>`).join("");
      card.querySelectorAll(".comp-item").forEach(el => {
        el.addEventListener("click", () => { location.hash = `#/competition/${el.dataset.comp}`; });
      });
    });
  }

  loadRoundsList().then(rounds => {
    const card = document.getElementById("roundsListCard");
    const active = rounds.filter(r => !r.deleted);
    const deleted = rounds.filter(r => r.deleted);

    const itemHtml = (r, isDeleted) => `
      <div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);${isDeleted ? "opacity:.6;" : ""}">
        <div class="round-item" data-round="${r.id}" style="cursor:${isDeleted ? "default" : "pointer"};flex:1;">
          <strong>${r.name}</strong>
          <div class="muted" style="font-size:.78rem;">${r.courseName || ""}${r.roundDate ? " · " + r.roundDate : ""}${r.teeBox ? " · " + r.teeBox + " tees" : ""}${r.competitionId ? ` · Fourball ${r.fourballIndex || ""}` : ""}</div>
        </div>
        ${isDeleted
          ? `<button class="ghost restore-item" data-round="${r.id}" style="font-size:.75rem;padding:4px 10px;">Restore</button>`
          : `<span class="pill mode" style="background:${r.status==='finished' ? 'var(--green-dim)' : 'var(--gold-dim)'};">${r.status === "finished" ? "Final" : "Active"}</span>`}
      </div>`;

    let html = active.length === 0
      ? `<p class="muted">No rounds yet — create one below.</p>`
      : active.map(r => itemHtml(r, false)).join("");

    if (deleted.length > 0){
      html += `
        <div style="margin-top:10px;">
          <button class="ghost" id="toggleDeletedBtn" style="font-size:.75rem;padding:4px 10px;">Show deleted (${deleted.length})</button>
          <div id="deletedList" style="display:none;margin-top:8px;">${deleted.map(r => itemHtml(r, true)).join("")}</div>
        </div>`;
    }
    card.innerHTML = html;

    card.querySelectorAll(".round-item").forEach(el => {
      el.addEventListener("click", () => { location.hash = `#/score/${el.dataset.round}`; });
    });
    const toggleBtn = document.getElementById("toggleDeletedBtn");
    if (toggleBtn){
      toggleBtn.onclick = () => {
        const list = document.getElementById("deletedList");
        const showing = list.style.display !== "none";
        list.style.display = showing ? "none" : "";
        toggleBtn.textContent = showing ? `Show deleted (${deleted.length})` : "Hide deleted";
      };
    }
    card.querySelectorAll(".restore-item").forEach(btn => {
      btn.onclick = async () => {
        await updateDoc(doc(db, "golf_rounds", btn.dataset.round), { deleted: false, deletedAt: null });
        renderSetup();
      };
    });
  });

  loadCoursesList().then(courses => {
    const select = document.getElementById("savedCourseSelect");
    courses.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c.id; opt.textContent = c.name;
      select.appendChild(opt);
    });
    select.addEventListener("change", () => {
      const course = courses.find(c => c.id === select.value);
      if (!course) return;
      document.getElementById("courseName").value = course.name;
      course.holes.forEach(h => {
        const parCell = document.querySelector(`.h-par[data-hole="${h.holeNumber}"]`);

async function createRound(){
  const msg = document.getElementById("createMsg");
  const roundName = document.getElementById("roundName").value.trim() || "Fourball";
  const courseName = document.getElementById("courseName").value.trim() || "Course";
  const roundDate = document.getElementById("roundDate").value.trim();
  const teeTime = document.getElementById("teeTime").value.trim();
  const teeBox = document.getElementById("teeBox").value;
  const modes = Array.from(document.querySelectorAll(".mode-cb:checked")).map(cb => cb.value);
  if (modes.length === 0){ msg.textContent = "Pick at least one game mode."; return; }
  const allianceCount = parseInt(document.getElementById("allianceCount").value, 10);
  const scrambleDrive = (modes.includes("alliance") || modes.includes("betterball")) && document.getElementById("scrambleDriveCb").checked;

  let teamAName = null, teamBName = null, piekfynPairs = null, fourballCount = 1;
  if (modes.includes("piekfyn")){
    const teamACount = [1,2,3,4].filter(i => document.getElementById(`p${i}-team`).value === "A").length;
    const teamBCount = [1,2,3,4].filter(i => document.getElementById(`p${i}-team`).value === "B").length;
    if (teamACount !== 2 || teamBCount !== 2){
      msg.textContent = "Piekfyn Kompetisie needs exactly 2 players on Team A and 2 on Team B.";
      return;
    }
    const selectedRadio = document.querySelector('input[name="pairingChoice"]:checked');
    if (!selectedRadio){
      msg.textContent = "Couldn't read the pairing choice — check the Piekfyn options above.";
      return;
    }
    teamAName = document.getElementById("teamAName").value.trim() || "Team A";
    teamBName = document.getElementById("teamBName").value.trim() || "Team B";
    piekfynPairs = JSON.parse(selectedRadio.value);
    fourballCount = parseInt(document.getElementById("fourballCount").value, 10) || 1;
  }

  const players = [1,2,3,4].map(i => ({
    name: document.getElementById(`p${i}-name`).value.trim() || `Player ${i}`,
    playingHandicap: parseInt(document.getElementById(`p${i}-hcp`).value || "0", 10),
    team: document.getElementById(`p${i}-team`).value,
    sortOrder: i
  }));

  const holes = Array.from({length:18},(_,i)=>{
    const n = i+1;
    return {
      holeNumber: n,
      par: parseInt(document.querySelector(`.h-par[data-hole="${n}"]`).value || "4", 10),
      strokeIndex: parseInt(document.querySelector(`.h-si[data-hole="${n}"]`).value || String(n), 10),
    };
  });

  msg.textContent = "Creating…";
  try{
    if (fourballCount > 1){
      await createPiekfynCompetition({
        roundName, courseName, roundDate, teeTime, teeBox, modes, allianceCount,
        teamAName, teamBName, piekfynPairs, players, holes, fourballCount
      });
      return;
    }

    const spectatorCode = Math.random().toString(36).slice(2,8);

    const roundRef = await addDoc(collection(db, "golf_rounds"), {
      name: roundName, courseName, roundDate, teeTime, teeBox, gameModes: modes, allianceCount, scrambleDrive,
      teamAName, teamBName, piekfynPairs, spectatorCode,
      status: "active", deleted: false, createdAt: serverTimestamp()
    });

    const batch = writeBatch(db);
    holes.forEach(h => {
      batch.set(doc(db, "golf_rounds", roundRef.id, "holes", String(h.holeNumber)), h);
    });
    const playerIds = [];
    players.forEach(p => {
      const pRef = doc(collection(db, "golf_rounds", roundRef.id, "players"));
      playerIds.push(pRef.id);
      batch.set(pRef, p);
    });
    await batch.commit();
    await saveCourseToDatabase(courseName, holes);

    location.hash = `#/score/${roundRef.id}`;
  } catch(err){
    msg.textContent = "Error: " + err.message;
  }
}

async function createPiekfynCompetition(cfg){
  const {
    roundName, courseName, roundDate, teeTime, teeBox, modes, allianceCount,
    teamAName, teamBName, piekfynPairs, players, holes, fourballCount
  } = cfg;

  const compRef = await addDoc(collection(db, "golf_competitions"), {
    name: roundName, teamAName, teamBName, courseName, roundDate, teeTime, teeBox,
    fourballCount, gameModes: modes, createdAt: serverTimestamp()
  });

  const defaultPlayersFor = (fbIndex) => [1,2,3,4].map(i => ({
    name: `Fourball ${fbIndex} · Player ${i}`,
    playingHandicap: 0,
    team: i <= 2 ? "A" : "B",
    sortOrder: i
  }));
  const defaultPairs = [{a:1,b:3},{a:2,b:4}];

  let firstRoundId = null;
  for (let fb = 1; fb <= fourballCount; fb++){
    const isFirst = fb === 1;
    const spectatorCode = Math.random().toString(36).slice(2,8);
    const roundRef = await addDoc(collection(db, "golf_rounds"), {
      name: `${roundName} — Fourball ${fb}`, courseName, roundDate, teeTime, teeBox,
      gameModes: modes, allianceCount,
      teamAName, teamBName,
      piekfynPairs: isFirst ? piekfynPairs : defaultPairs,
      spectatorCode, competitionId: compRef.id, fourballIndex: fb,
      status: "active", deleted: false, createdAt: serverTimestamp()
    });
    if (isFirst) firstRoundId = roundRef.id;

    const batch = writeBatch(db);
    holes.forEach(h => batch.set(doc(db, "golf_rounds", roundRef.id, "holes", String(h.holeNumber)), h));
    const fbPlayers = isFirst ? players : defaultPlayersFor(fb);
    fbPlayers.forEach(p => {
      const pRef = doc(collection(db, "golf_rounds", roundRef.id, "players"));
      batch.set(pRef, p);
    });
    await batch.commit();
  }

  await saveCourseToDatabase(courseName, holes);
  location.hash = `#/competition/${compRef.id}`;
}

async function loadRoundBundle(roundId){
  const roundSnap = await getDoc(doc(db, "golf_rounds", roundId));
  if (!roundSnap.exists()) return { round: null };
  const round = { id: roundSnap.id, ...roundSnap.data() };

  const holesSnap = await getDocs(collection(db, "golf_rounds", roundId, "holes"));
  const holes = holesSnap.docs.map(d => d.data()).sort((a,b)=>a.holeNumber-b.holeNumber);

  const playersSnap = await getDocs(collection(db, "golf_rounds", roundId, "players"));
  const players = playersSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>a.sortOrder-b.sortOrder);

  const scoresSnap = await getDocs(collection(db, "golf_rounds", roundId, "scores"));
  const scores = scoresSnap.docs.map(d => d.data());

  const bbbSnap = await getDocs(collection(db, "golf_rounds", roundId, "bbb"));
  const bbb = bbbSnap.docs.map(d => d.data());

  const scrambleSnap = await getDocs(collection(db, "golf_rounds", roundId, "scrambleDrives"));
  const scrambleDrives = scrambleSnap.docs.map(d => d.data());

  return { round, holes, players, scores, bbb, scrambleDrives };
}

function buildEditPairingRadios(positions, currentPairs){
  const teamA = positions.filter(p => p.team === "A");
  const teamB = positions.filter(p => p.team === "B");
  if (teamA.length !== 2 || teamB.length !== 2){
    return `<p class="muted" style="font-size:.78rem;">Piekfyn needs exactly 2 players on Team A and 2 on Team B (set below).</p>`;
  }
  const [a1,a2] = teamA, [b1,b2] = teamB;
  const opt1 = [{a:a1.sortOrder,b:b1.sortOrder},{a:a2.sortOrder,b:b2.sortOrder}];
  const opt2 = [{a:a1.sortOrder,b:b2.sortOrder},{a:a2.sortOrder,b:b1.sortOrder}];
  const opt1Checked = currentPairs ? JSON.stringify(currentPairs) === JSON.stringify(opt1) : true;
  return `
    <div class="checkbox-row">
      <input type="radio" name="editPairingChoice" id="editPairing1" value='${JSON.stringify(opt1)}' ${opt1Checked ? "checked" : ""}>
      <label style="margin:0" for="editPairing1">${a1.name} vs ${b1.name} &nbsp;·&nbsp; ${a2.name} vs ${b2.name}</label>
    </div>
    <div class="checkbox-row">
      <input type="radio" name="editPairingChoice" id="editPairing2" value='${JSON.stringify(opt2)}' ${!opt1Checked ? "checked" : ""}>
      <label style="margin:0" for="editPairing2">${a1.name} vs ${b2.name} &nbsp;·&nbsp; ${a2.name} vs ${b1.name}</label>
    </div>`;
}

async function saveSchedule(spectatorUrl){
  const msg = document.getElementById("scheduleMsg");
  const courseName = document.getElementById("editCourseName").value.trim() || scorerData.round.courseName;
  const roundDate = document.getElementById("editRoundDate").value.trim();
  const teeTime = document.getElementById("editTeeTime").value.trim();
  const teeBox = document.getElementById("editTeeBox").value;
  const holes = scorerData.holes.map(h => ({
    holeNumber: h.holeNumber,
    par: parseInt(document.querySelector(`.h-par-edit[data-hole="${h.holeNumber}"]`).value || h.par, 10),
    strokeIndex: parseInt(document.querySelector(`.h-si-edit[data-hole="${h.holeNumber}"]`).value || h.strokeIndex, 10),
  }));

  const players = scorerData.players.map(p => ({
    id: p.id,
    name: document.querySelector(`.edit-p-name[data-id="${p.id}"]`).value.trim() || p.name,
    playingHandicap: parseInt(document.querySelector(`.edit-p-hcp[data-id="${p.id}"]`).value || p.playingHandicap, 10),
    team: document.querySelector(`.edit-p-team[data-id="${p.id}"]`).value,
  }));

  const updates = { courseName, roundDate, teeTime, teeBox };
  if (scorerData.round.gameModes.includes("piekfyn")){
    const teamAEl = document.getElementById("editTeamAName");
    const teamBEl = document.getElementById("editTeamBName");
    if (teamAEl && teamBEl){
      updates.teamAName = teamAEl.value.trim() || "Team A";
      updates.teamBName = teamBEl.value.trim() || "Team B";
    }
    const pairingEl = document.querySelector('input[name="editPairingChoice"]:checked');
    if (pairingEl) updates.piekfynPairs = JSON.parse(pairingEl.value);
  }

  msg.textContent = "Saving…";
  try{
    await updateDoc(doc(db, "golf_rounds", scorerData.round.id), updates);

    const batch = writeBatch(db);
    holes.forEach(h => batch.set(doc(db, "golf_rounds", scorerData.round.id, "holes", String(h.holeNumber)), h));
    players.forEach(p => batch.update(doc(db, "golf_rounds", scorerData.round.id, "players", p.id), {
      name: p.name, playingHandicap: p.playingHandicap, team: p.team
    }));
    await batch.commit();
    await saveCourseToDatabase(courseName, holes);

    Object.assign(scorerData.round, updates);
    scorerData.holes = holes;
    scorerData.players = scorerData.players.map(p => {
      const updated = players.find(pl => pl.id === p.id);
      return updated ? { ...p, ...updated } : p;
    });
    scheduleEditMode = false;

    // header shows course name in the subtitle — refresh the whole scorer view
    await renderScorer(scorerData.round.id);
    switchScorerTab("schedule");
  } catch(err){
    msg.textContent = "Error: " + err.message;
  }
}

async function deleteRound(roundId){
  if (!confirm("Delete this round? It'll be hidden from your rounds list, but can be restored later.")) return;
  try{
    await updateDoc(doc(db, "golf_rounds", roundId), { deleted: true, deletedAt: serverTimestamp() });
    location.hash = "";
  } catch(err){
    alert("Couldn't delete round: " + err.message);
  }
}

async function restoreRound(roundId){
  await updateDoc(doc(db, "golf_rounds", roundId), { deleted: false, deletedAt: null });
  scorerData.round.deleted = false;
  renderScorer(roundId);
}

async function finishRound(roundId){
  if (!confirm("Finish this round? Scores will be locked from further entry.")) return;
  await updateDoc(doc(db, "golf_rounds", roundId), { status: "finished" });
  scorerData.round.status = "finished";
  renderScorer(roundId);
}

function switchScorerTab(which){
  const scheduleTab = document.getElementById("scheduleTab");
  if (scheduleTab) scheduleTab.style.display = which === "schedule" ? "" : "none";
  document.getElementById("scoreTab").style.display = which === "score" ? "" : "none";
  document.getElementById("boardsTab").style.display = which === "boards" ? "" : "none";
  const tabScheduleBtn = document.getElementById("tabScheduleBtn");
  if (tabScheduleBtn) tabScheduleBtn.classList.toggle("active", which === "schedule");
  document.getElementById("tabScoreBtn").classList.toggle("active", which === "score");
  document.getElementById("tabBoardsBtn").classList.toggle("active", which === "boards");
}

const SCORE_LABELS = { "-2":"Eagle", "-1":"Birdie", "0":"Par", "1":"Bogey", "2":"Dbl", "3":"Tpl+" };

function renderEntry(){
  const hole = scorerData.holes.find(h => h.holeNumber === scorerHole);
  const finished = scorerData.round.status === "finished";
  document.getElementById("holeLabel").textContent = `Hole ${scorerHole} · Par ${hole.par} · SI ${hole.strokeIndex}`;
  const card = document.getElementById("entryCard");

  const chipOffsets = [-2,-1,0,1,2,3];

  const scrambleHtml = scorerData.round.scrambleDrive ? buildScrambleDriveHtml(finished) : "";

  const playersHtml = scorerData.players.map(p => {
    const existing = scorerData.scores.find(s => s.playerId === p.id && s.holeNumber === scorerHole);
    const currentVal = existing ? existing.grossStrokes : null;

    // running gross total through holes entered so far
    let total = 0, thru = 0;
    scorerData.holes.forEach(h => {
      const s = scorerData.scores.find(sc => sc.playerId === p.id && sc.holeNumber === h.holeNumber);
      if (s && s.grossStrokes != null){ total += s.grossStrokes; thru++; }
    });

    const chips = chipOffsets.map(off => {
      const val = Math.max(1, hole.par + off);
      const isActive = currentVal === val;
      return `<button type="button" class="score-chip" data-player="${p.id}" data-val="${val}"
        style="flex:1;min-width:0;padding:10px 2px;font-size:.95rem;
        background:${isActive ? "var(--green-dark)" : "#fff"};
        color:${isActive ? "#fff" : "var(--ink)"};
        border:1px solid ${isActive ? "var(--green-dark)" : "var(--line)"};
        border-radius:8px;" ${finished ? "disabled" : ""}>
        <div style="font-weight:700;">${val}</div>
        <div style="font-size:.62rem;opacity:.75;">${SCORE_LABELS[String(off)]}</div>
      </button>`;
    }).join("");

    return `
      <div class="card" style="padding:12px;">
        <div class="row" style="justify-content:space-between;margin-bottom:8px;">
          <strong>${p.name}</strong>
          <span class="muted">hcp ${p.playingHandicap}${p.team ? " · team "+p.team : ""} · thru ${thru}: ${thru ? total : "-"}</span>
        </div>
        <div class="row" style="gap:6px;flex-wrap:nowrap;">${chips}</div>
        <div class="row" style="margin-top:6px;">
          <button type="button" class="ghost custom-btn" data-player="${p.id}" style="font-size:.75rem;padding:4px 10px;" ${finished ? "disabled" : ""}>Other score…</button>
          ${currentVal != null ? `<span class="muted" style="font-size:.75rem;">Entered: ${currentVal}</span>` : ""}
        </div>
      </div>`;
  }).join("");

  card.innerHTML = scrambleHtml + playersHtml;

  card.querySelectorAll(".scramble-pick").forEach(btn => {
    btn.addEventListener("click", () => saveScrambleDrive("playerId", btn.dataset.player));
  });
  card.querySelectorAll(".scramble-pick-team").forEach(btn => {
    btn.addEventListener("click", () => saveScrambleDrive(btn.dataset.field, btn.dataset.player));
  });
  card.querySelectorAll(".score-chip").forEach(btn => {
    btn.addEventListener("click", () => {
      const val = parseInt(btn.dataset.val, 10);
      const already = scorerData.scores.find(s => s.playerId === btn.dataset.player && s.holeNumber === scorerHole);
      if (already && already.grossStrokes === val){
        clearScore(btn.dataset.player);
      } else {
        saveScore(btn.dataset.player, val);
      }
    });
  });
  card.querySelectorAll(".custom-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const val = prompt("Enter gross strokes for this hole:");
      if (val === null || val.trim() === "") return;
      const n = parseInt(val, 10);
      if (!Number.isFinite(n) || n < 1) return;
      saveScore(btn.dataset.player, n);
    });
  });

  if (scorerData.round.gameModes.includes("bbb")){
    renderBBBPicker(finished);
  }
}

function getScrambleDriveForHole(holeNumber){
  return (scorerData.scrambleDrives || []).find(s => s.holeNumber === holeNumber) || null;
}

function buildScrambleDriveHtml(finished){
  const isBetterball = scorerData.round.gameModes.includes("betterball");
  if (isBetterball){
    return buildScrambleDriveTeamHtml(finished, "A", "team-a") + buildScrambleDriveTeamHtml(finished, "B", "team-b");
  }

  // Alliance: one fourball-wide pick per hole
  const current = getScrambleDriveForHole(scorerHole);
  return `
    <div class="card" style="padding:12px;border-color:var(--gold);margin-bottom:8px;">
      <strong>Scramble drive</strong>
      <div class="muted" style="font-size:.78rem;margin-bottom:4px;">Whose tee shot did the fourball play from?</div>
      <div class="row" style="gap:6px;flex-wrap:nowrap;">
        ${scorerData.players.map(p => {
          const isActive = current && current.playerId === p.id;
          return `<button type="button" class="scramble-pick" data-player="${p.id}"
            style="flex:1;min-width:0;padding:8px 2px;font-size:.78rem;
            background:${isActive ? "var(--gold)" : "#fff"};
            color:${isActive ? "var(--green-dark)" : "var(--ink)"};
            border:1px solid ${isActive ? "var(--gold)" : "var(--line)"};
            border-radius:8px;font-weight:${isActive ? "800" : "500"};" ${finished ? "disabled" : ""}>
            ${p.name}
          </button>`;
        }).join("")}
      </div>
    </div>`;
}

function buildScrambleDriveTeamHtml(finished, teamKey, colorClass){
  const teamPlayers = scorerData.players.filter(p => p.team === teamKey);
  if (teamPlayers.length === 0) return "";
  const field = teamKey === "A" ? "teamA" : "teamB";
  const current = getScrambleDriveForHole(scorerHole);
  const currentPlayerId = current ? current[field] : null;

  return `
    <div class="card" style="padding:12px;border-color:var(--gold);margin-bottom:8px;">
      <strong class="${colorClass}">Team ${teamKey} scramble drive</strong>
      <div class="muted" style="font-size:.78rem;margin-bottom:4px;">Whose tee shot did this pair play from?</div>
      <div class="row" style="gap:6px;flex-wrap:nowrap;">
        ${teamPlayers.map(p => {
          const isActive = currentPlayerId === p.id;
          return `<button type="button" class="scramble-pick-team" data-field="${field}" data-player="${p.id}"
            style="flex:1;min-width:0;padding:8px 2px;font-size:.78rem;
            background:${isActive ? "var(--gold)" : "#fff"};
            color:${isActive ? "var(--green-dark)" : "var(--ink)"};
            border:1px solid ${isActive ? "var(--gold)" : "var(--line)"};
            border-radius:8px;font-weight:${isActive ? "800" : "500"};" ${finished ? "disabled" : ""}>
            ${p.name}
          </button>`;
        }).join("")}
      </div>
    </div>`;
}

async function saveScrambleDrive(field, playerId){
  const current = getScrambleDriveForHole(scorerHole) || { holeNumber: scorerHole };
  const newVal = current[field] === playerId ? null : playerId;
  const rec = { ...current, holeNumber: scorerHole, [field]: newVal };

  const hasAnyValue = ["playerId", "teamA", "teamB"].some(k => rec[k]);
  if (!hasAnyValue){
    await deleteDoc(doc(db, "golf_rounds", scorerData.round.id, "scrambleDrives", String(scorerHole)));
  } else {
    await setDoc(doc(db, "golf_rounds", scorerData.round.id, "scrambleDrives", String(scorerHole)), rec);
  }

  if (!scorerData.scrambleDrives) scorerData.scrambleDrives = [];
  const idx = scorerData.scrambleDrives.findIndex(s => s.holeNumber === scorerHole);
  if (!hasAnyValue){
    if (idx >= 0) scorerData.scrambleDrives.splice(idx, 1);
  } else {
    if (idx >= 0) scorerData.scrambleDrives[idx] = rec; else scorerData.scrambleDrives.push(rec);
  }
  renderEntry();
  renderBoards();
}

const BBB_CATEGORIES = [
  { key: "bingo", label: "Bingo", hint: "First on the green" },
  { key: "bango", label: "Bango", hint: "Closest to the pin once all on" },
  { key: "bongo", label: "Bongo", hint: "First to hole out" },
];

function getBBBForHole(holeNumber){
  const existing = (scorerData.bbb || []).find(b => b.holeNumber === holeNumber);
  return existing || { holeNumber, bingo: null, bango: null, bongo: null };
}

function renderBBBPicker(finished){
  const card = document.getElementById("entryCard");
  const rec = getBBBForHole(scorerHole);

  const html = `
    <div class="card" style="padding:12px;border-color:var(--gold);">
      <strong>Bingo Bango Bongo</strong>
      ${BBB_CATEGORIES.map(cat => `
        <div style="margin-top:10px;">
          <div class="muted" style="font-size:.78rem;margin-bottom:4px;"><strong style="color:var(--ink);">${cat.label}</strong> — ${cat.hint}</div>
          <div class="row" style="gap:6px;flex-wrap:nowrap;">
            ${scorerData.players.map(p => {
              const isActive = rec[cat.key] === p.id;
              return `<button type="button" class="bbb-pick" data-cat="${cat.key}" data-player="${p.id}"
                style="flex:1;min-width:0;padding:8px 2px;font-size:.75rem;
                background:${isActive ? "var(--gold)" : "#fff"};
                color:${isActive ? "var(--green-dark)" : "var(--ink)"};
                border:1px solid ${isActive ? "var(--gold)" : "var(--line)"};
                border-radius:8px;font-weight:${isActive ? "800" : "500"};" ${finished ? "disabled" : ""}>
                ${p.name}
              </button>`;
            }).join("")}
          </div>
        </div>`).join("")}
    </div>`;

  const wrapper = document.createElement("div");
  wrapper.innerHTML = html;
  card.appendChild(wrapper.firstElementChild);

  card.querySelectorAll(".bbb-pick").forEach(btn => {
    btn.addEventListener("click", () => saveBBB(btn.dataset.cat, btn.dataset.player));
  });
}

async function saveBBB(category, playerId){
  const rec = getBBBForHole(scorerHole);
  const newVal = rec[category] === playerId ? null : playerId; // tap again to clear
  const updated = { ...rec, [category]: newVal };

  await setDoc(doc(db, "golf_rounds", scorerData.round.id, "bbb", String(scorerHole)), updated, { merge: true });

  const idx = (scorerData.bbb || []).findIndex(b => b.holeNumber === scorerHole);
  if (!scorerData.bbb) scorerData.bbb = [];
  if (idx >= 0) scorerData.bbb[idx] = updated; else scorerData.bbb.push(updated);

  renderEntry();
  renderBoards();
}

async function saveScore(playerId, val){
  const docId = `${playerId}_${scorerHole}`;
  await setDoc(doc(db, "golf_rounds", scorerData.round.id, "scores", docId), {
    playerId, holeNumber: scorerHole, grossStrokes: val, updatedAt: serverTimestamp()
  });
  const idx = scorerData.scores.findIndex(s => s.playerId === playerId && s.holeNumber === scorerHole);
  const rec = { playerId, holeNumber: scorerHole, grossStrokes: val };
  if (idx >= 0) scorerData.scores[idx] = rec; else scorerData.scores.push(rec);
  renderEntry();
  renderBoards();
}

async function clearScore(playerId){
  const docId = `${playerId}_${scorerHole}`;
  await deleteDoc(doc(db, "golf_rounds", scorerData.round.id, "scores", docId));
  const idx = scorerData.scores.findIndex(s => s.playerId === playerId && s.holeNumber === scorerHole);
  if (idx >= 0) scorerData.scores.splice(idx, 1);
  renderEntry();
  renderBoards();
}

function renderBoards(){
  currentBundle = scorerData;
  document.getElementById("boards").innerHTML = buildBoardsHtml(scorerData);
}

let spectatorUnsub = null;
let spectatorBbbUnsub = null;
let spectatorScrambleUnsub = null;

async function renderSpectator(code){
  const app = document.getElementById("app");
  app.innerHTML = `<p class="muted">Loading…</p>`;

  const q = query(collection(db, "golf_rounds"), where("spectatorCode", "==", code), limit(1));
  const snap = await getDocs(q);
  if (snap.empty){ app.innerHTML = `<p>Round not found.</p>`; return; }
  const roundId = snap.docs[0].id;

  const bundle = await loadRoundBundle(roundId);
  currentBundle = bundle;

  app.innerHTML = `
    ${renderAppHeader(bundle.round.name, bundle.round.courseName, bundle.round.status === "finished" ? "final" : "live")}
    <div class="content">
    <div>${bundle.round.gameModes.map(m => `<span class="pill mode">${GAME_MODES.find(g=>g.key===m).label}</span>`).join("")}</div>
    ${bundle.round.status === "finished" ? `<div class="card" style="text-align:center;border-color:var(--green);"><strong>Final result</strong></div>` : ""}
    <h2>Leaderboards</h2>
    <div id="boards">${buildBoardsHtml(bundle)}</div>
    </div>
  `;

  if (spectatorUnsub) spectatorUnsub();
  spectatorUnsub = onSnapshot(collection(db, "golf_rounds", roundId, "scores"), snap => {
    bundle.scores = snap.docs.map(d => d.data());
    currentBundle = bundle;
    document.getElementById("boards").innerHTML = buildBoardsHtml(bundle);
  });

  if (spectatorBbbUnsub) spectatorBbbUnsub();
  spectatorBbbUnsub = onSnapshot(collection(db, "golf_rounds", roundId, "bbb"), snap => {
    bundle.bbb = snap.docs.map(d => d.data());
    currentBundle = bundle;
    document.getElementById("boards").innerHTML = buildBoardsHtml(bundle);
  });

  if (spectatorScrambleUnsub) spectatorScrambleUnsub();
  spectatorScrambleUnsub = onSnapshot(collection(db, "golf_rounds", roundId, "scrambleDrives"), snap => {
    bundle.scrambleDrives = snap.docs.map(d => d.data());
    currentBundle = bundle;
    document.getElementById("boards").innerHTML = buildBoardsHtml(bundle);
  });
}
