async function loadRoundBundle(roundId){
  const roundSnap = await getDoc(doc(db, "golf_rounds", roundId));
  if (!roundSnap.exists()) return { round: null };
  const round = { id: roundSnap.id, ...roundSnap.data() };

  const holesSnap = await getDocs(collection(db, "golf_rounds", roundId, "holes"));
  const holes = holesSnap.docs.map(d => d.data()).sort((a,b)=>a.holeNumber-b.holeNumber);

  const playersSnap = await getDocs(collection(db, "golf_rounds", roundId, "players"));
  const players = playersSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>a.sortOrder-b.sortOrder);

  const scoresSnap = await getDocs(collection(db, "golf_rounds", roundId, "scores"));
  const scores = scoresSnap.docs.map(d => d.data());

  const bbbSnap = await getDocs(collection(db, "golf_rounds", roundId, "bbb"));
  const bbb = bbbSnap.docs.map(d => d.data());

  const scrambleSnap = await getDocs(collection(db, "golf_rounds", roundId, "scrambleDrives"));
  const scrambleDrives = scrambleSnap.docs.map(d => d.data());

  return { round, holes, players, scores, bbb, scrambleDrives };
}

let scheduleEditMode = false;

/* ---------- Round timer: a required "Start round" checkpoint, then an elapsed-time display ---------- */
function toDateMaybe(val){
  if (!val) return null;
  if (val instanceof Date) return val;
  if (typeof val.toDate === "function") return val.toDate();   // a Firestore Timestamp, once reloaded from the server
  return new Date(val);
}
function formatDuration(ms){
  const totalMin = Math.max(0, Math.round(ms / 60000));
  const h = Math.floor(totalMin / 60), m = totalMin % 60;
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}
function finishedDurationText(round){
  const start = toDateMaybe(round.startedAt), end = toDateMaybe(round.finishedAt);
  return (start && end) ? ` · Round time: ${formatDuration(end.getTime() - start.getTime())}` : "";
}
let elapsedTimerInterval = null;
function startElapsedTimer(elId, startedAt){
  if (elapsedTimerInterval) clearInterval(elapsedTimerInterval);
  const start = toDateMaybe(startedAt);
  const el = document.getElementById(elId);
  if (!start || !el) return;
  function tick(){
    const target = document.getElementById(elId);
    if (!target){ clearInterval(elapsedTimerInterval); return; }   // navigated away — stop ticking
    target.textContent = "Elapsed: " + formatDuration(Date.now() - start.getTime());
  }
  tick();
  elapsedTimerInterval = setInterval(tick, 30000);
}
function buildStartGateHtml(players){
  return `
    <div class="card" style="border-color:var(--gold);text-align:center;">
      <strong>Check the names and handicaps below</strong>
      <p class="muted" style="font-size:.85rem;margin:6px 0 10px;">Tap a handicap to fix it. Once everything looks right, tap Start to begin scoring and start the round timer.</p>
      <table style="margin-bottom:12px;">
        <tr><th class="name-col">Player</th><th>Handicap</th></tr>
        ${players.map(p => `<tr><td class="name-col">${escapeHtml(p.name)}</td><td><input type="number" class="hole-input hcp-edit-input" data-player="${p.id}" value="${p.playingHandicap}" style="width:60px;" onfocus="this.select()"></td></tr>`).join("")}
      </table>
      <button id="startRoundBtn" style="width:100%;">Start round</button>
    </div>`;
}
// Wired wherever a handicap is shown in the Score tab (the Start gate, and each player's
// entry card) — lets the scorer fix a wrong handicap without needing the Schedule tab, which the
// shared scoring-only link doesn't even have.
async function updatePlayerHandicap(roundId, playerId, rawValue, inputEl){
  const hcp = parseInt(rawValue, 10);
  const player = scorerData.players.find(p => p.id === playerId);
  if (!Number.isFinite(hcp) || hcp < 0){
    if (inputEl && player) inputEl.value = player.playingHandicap;   // reject and restore what it was
    return;
  }
  await updateDoc(doc(db, "golf_rounds", roundId, "players", playerId), { playingHandicap: hcp });
  if (player) player.playingHandicap = hcp;
  renderBoards();   // net scores, points and match results all depend on handicap
}
function wireHandicapInputs(roundId, selector, root){
  (root || document).querySelectorAll(selector).forEach(inp => {
    inp.addEventListener("change", () => updatePlayerHandicap(roundId, inp.dataset.player, inp.value, inp));
  });
}
async function startRound(roundId){
  await updateDoc(doc(db, "golf_rounds", roundId), { startedAt: serverTimestamp() });
  scorerData.round.startedAt = new Date();   // optimistic, so the gate closes immediately without waiting on a reload
}

// Live scoring entry is phone-only, same split as Fishing's desktop (data entry stays on the
// phone; desktop is for setup and reviewing stats) - shown instead of the real scorer/
// scoring-only screens whenever they're opened at desktop width, so nobody tries to run a

}

  scheduleEditMode = false;
  piekfynActiveTab = "fourballs";
  rememberRound(scorerData.round, "score");

  const spectatorUrl = location.origin + location.pathname + `#/spectate/${scorerData.round.spectatorCode}`;
  const finished = scorerData.round.status === "finished";
  const needsStart = !finished && !scorerData.round.startedAt && scorerData.scores.length === 0;

  app.innerHTML = `
    ${renderAppHeader(scorerData.round.name, scorerData.round.courseName, finished ? "final" : "live")}

      <button class="tab-btn" id="tabScheduleBtn">Schedule</button>

        <p class="muted" style="margin:4px 0 10px;">It's hidden from your rounds list but hasn't been erased.</p>

    ` : ""}

    <div id="scheduleTab" style="display:none;"></div>

    <div id="scoreTab">
      <div>${scorerData.round.gameModes.map(m => `<span class="pill mode">${GAME_MODES.find(g=>g.key===m).label}</span>`).join("")}</div>
      ${finished
        ? `<div class="card" style="text-align:center;border-color:var(--brand);"><strong>Round finished</strong><p class="muted" style="margin:4px 0 0;">Scores are locked. See the Leaderboards tab for final results.${finishedDurationText(scorerData.round)}</p></div>`
        : needsStart
          ? buildStartGateHtml(scorerData.players)
          : `<div class="row" style="margin:10px 0;justify-content:space-between;align-items:center;"><button id="finishBtn" style="background:var(--danger);border-color:var(--danger);">Finish round</button><span id="elapsedTimer" class="muted" style="font-size:.85rem;"></span></div>`}
      ${needsStart ? "" : `
      <div class="hole-nav">
        <button id="prevHole" class="secondary">&larr;</button>
        <div class="current" id="holeLabel"></div>
        <button id="nextHole" class="secondary">&rarr;</button>
      </div>
      <div id="entryCard"></div>`}
    </div>

    <div id="boardsTab" style="display:none;">
      <h2>Leaderboards</h2>
      <div id="boards"></div>

    </div>
  `;

  document.getElementById("tabScheduleBtn").onclick = () => switchScorerTab("schedule");
  document.getElementById("tabScoreBtn").onclick = () => switchScorerTab("score");
  document.getElementById("tabBoardsBtn").onclick = () => switchScorerTab("boards");
  if (!needsStart){
    document.getElementById("prevHole").onclick = () => { scorerHole = Math.max(1, scorerHole-1); renderEntry(); };
    document.getElementById("nextHole").onclick = () => { scorerHole = Math.min(18, scorerHole+1); renderEntry(); };
  }
  const finishBtn = document.getElementById("finishBtn");

  const startRoundBtn = document.getElementById("startRoundBtn");

  if (needsStart) wireHandicapInputs(roundId, ".hcp-edit-input");
  const restoreBannerBtn = document.getElementById("restoreBannerBtn");
  if (restoreBannerBtn) restoreBannerBtn.onclick = () => restoreRound(roundId);

  renderScheduleTab(spectatorUrl);
  if (!needsStart){
    renderEntry();
    if (!finished) startElapsedTimer("elapsedTimer", scorerData.round.startedAt);
  }
  renderBoards();

  if (scorerUnsub) scorerUnsub();
  scorerUnsub = onSnapshot(collection(db, "golf_rounds", roundId, "scores"), snap => {
    scorerData.scores = snap.docs.map(d => d.data());
    renderEntry();
    renderBoards();
  });

  if (scorerBbbUnsub) scorerBbbUnsub();
  scorerBbbUnsub = onSnapshot(collection(db, "golf_rounds", roundId, "bbb"), snap => {
    scorerData.bbb = snap.docs.map(d => d.data());
    renderEntry();
    renderBoards();
  });

  if (scorerScrambleUnsub) scorerScrambleUnsub();
  scorerScrambleUnsub = onSnapshot(collection(db, "golf_rounds", roundId, "scrambleDrives"), snap => {
    scorerData.scrambleDrives = snap.docs.map(d => d.data());
    renderEntry();
    renderBoards();
  });

  loadSiblingBundles(scorerData.round).then(() => renderFourballSwitcher(roundId, "score"));
}

/* ---------- Schedule tab: view mode + edit mode ---------- */
function renderScheduleTab(spectatorUrl){
  currentBundle = scorerData;
  const tab = document.getElementById("scheduleTab");
  tab.innerHTML = scheduleEditMode ? buildScheduleEditHtml(scorerData) : buildScheduleViewHtml(scorerData, spectatorUrl);

  if (!scheduleEditMode){
    const copyBtn = document.getElementById("copyBtn");
    if (copyBtn) copyBtn.onclick = () => navigator.clipboard.writeText(spectatorUrl);
    const copyScoreBtn = document.getElementById("copyScoreLinkBtn");
    if (copyScoreBtn) copyScoreBtn.onclick = () => navigator.clipboard.writeText(copyScoreBtn.dataset.url);
    document.getElementById("editScheduleBtn").onclick = () => { scheduleEditMode = true; renderScheduleTab(spectatorUrl); };
    const deleteBtn = document.getElementById("deleteRoundBtn");
    if (deleteBtn) deleteBtn.onclick = () => deleteRound(scorerData.round.id);
  } else {
    document.getElementById("cancelEditBtn").onclick = () => { scheduleEditMode = false; renderScheduleTab(spectatorUrl); };
    document.getElementById("saveScheduleBtn").onclick = () => saveSchedule(spectatorUrl);
    if (scorerData.round.gameModes.includes("piekfyn")){
      document.querySelectorAll(".edit-p-name, .edit-p-team").forEach(el => {
        el.addEventListener(el.tagName === "SELECT" ? "change" : "input", refreshEditPairingOptions);
      });
      wireTeamColorPreview("editTeamAColor", "editTeamBColor");
    }
  }
}

function buildEditPairingRadios(positions, currentPairs){
  const teamA = positions.filter(p => p.team === "A");
  const teamB = positions.filter(p => p.team === "B");
  if (teamA.length !== 2 || teamB.length !== 2){
    return `<p class="muted" style="font-size:.78rem;">Piekfyn needs exactly 2 players on Team A and 2 on Team B (set below).</p>`;
  }
  const [a1,a2] = teamA, [b1,b2] = teamB;
  const opt1 = [{a:a1.sortOrder,b:b1.sortOrder},{a:a2.sortOrder,b:b2.sortOrder}];
  const opt2 = [{a:a1.sortOrder,b:b2.sortOrder},{a:a2.sortOrder,b:b1.sortOrder}];
  const opt1Checked = currentPairs ? JSON.stringify(currentPairs) === JSON.stringify(opt1) : true;
  return `
    <div class="checkbox-row">
      <input type="radio" name="editPairingChoice" id="editPairing1" value='${JSON.stringify(opt1)}' ${opt1Checked ? "checked" : ""}>
      <label style="margin:0" for="editPairing1">${escapeHtml(a1.name)} vs ${escapeHtml(b1.name)} &nbsp;·&nbsp; ${escapeHtml(a2.name)} vs ${escapeHtml(b2.name)}</label>
    </div>
    <div class="checkbox-row">
      <input type="radio" name="editPairingChoice" id="editPairing2" value='${JSON.stringify(opt2)}' ${!opt1Checked ? "checked" : ""}>
      <label style="margin:0" for="editPairing2">${escapeHtml(a1.name)} vs ${escapeHtml(b2.name)} &nbsp;·&nbsp; ${escapeHtml(a2.name)} vs ${escapeHtml(b1.name)}</label>
    </div>`;
}

async function saveSchedule(spectatorUrl){
  const msg = document.getElementById("scheduleMsg");
  const courseName = document.getElementById("editCourseName").value.trim() || scorerData.round.courseName;
  const roundDate = document.getElementById("editRoundDate").value.trim();
  const teeTime = document.getElementById("editTeeTime").value.trim();
  const teeBox = document.getElementById("editTeeBox").value;
  const creatorIsPlaying = (document.querySelector('input[name="editCreatorRole"]:checked') || {}).value !== "marking";
  const holes = scorerData.holes.map(h => ({
    holeNumber: h.holeNumber,
    par: parseInt(document.querySelector(`.h-par-edit[data-hole="${h.holeNumber}"]`).value || h.par, 10),
    strokeIndex: parseInt(document.querySelector(`.h-si-edit[data-hole="${h.holeNumber}"]`).value || h.strokeIndex, 10),
  }));

  const players = scorerData.players.map(p => ({
    id: p.id,
    name: document.querySelector(`.edit-p-name[data-id="${p.id}"]`).value.trim() || p.name,
    playingHandicap: parseInt(document.querySelector(`.edit-p-hcp[data-id="${p.id}"]`).value || p.playingHandicap, 10),
    team: document.querySelector(`.edit-p-team[data-id="${p.id}"]`).value,
  }));

  const updates = { courseName, roundDate, teeTime, teeBox, creatorIsPlaying };
  if (scorerData.round.gameModes.includes("alliance")){
    const allianceCountEl = document.getElementById("editAllianceCount");
    if (allianceCountEl) updates.allianceCount = parseInt(allianceCountEl.value, 10);
  }
  if (scorerData.round.gameModes.includes("alliance") || scorerData.round.gameModes.includes("betterball")){
    const scrambleCb = document.getElementById("editScrambleDriveCb");
    if (scrambleCb){
      updates.scrambleDrive = scrambleCb.checked;
      updates.scrambleDriveParTypes = Array.from(document.querySelectorAll(".edit-scramble-par-cb:checked")).map(cb => parseInt(cb.value, 10));
    }
  }
  if (scorerData.round.gameModes.includes("piekfyn")){
    const teamAEl = document.getElementById("editTeamAName");
    const teamBEl = document.getElementById("editTeamBName");
    if (teamAEl && teamBEl){
      updates.teamAName = teamAEl.value.trim() || "Team A";
      updates.teamBName = teamBEl.value.trim() || "Team B";
    }
    const colorStyleEl = document.querySelector('input[name="editTeamColorStyle"]:checked');
    if (colorStyleEl) updates.teamColorStyle = colorStyleEl.value;
    const teamAColorEl = document.getElementById("editTeamAColor");
    const teamBColorEl = document.getElementById("editTeamBColor");
    if (teamAColorEl) updates.teamAColor = teamAColorEl.value;
    if (teamBColorEl) updates.teamBColor = teamBColorEl.value;
    const pairingEl = document.querySelector('input[name="editPairingChoice"]:checked');
    if (pairingEl) updates.piekfynPairs = JSON.parse(pairingEl.value);
  }

  msg.textContent = "Saving…";
  try{
    await updateDoc(doc(db, "golf_rounds", scorerData.round.id), updates);

    const batch = writeBatch(db);
    holes.forEach(h => batch.set(doc(db, "golf_rounds", scorerData.round.id, "holes", String(h.holeNumber)), h));
    players.forEach(p => batch.update(doc(db, "golf_rounds", scorerData.round.id, "players", p.id), {
      name: p.name, playingHandicap: p.playingHandicap, team: p.team
    }));
    await batch.commit();
    await saveCourseToDatabase(courseName, holes);

    Object.assign(scorerData.round, updates);
    scorerData.holes = holes;
    scorerData.players = scorerData.players.map(p => {
      const updated = players.find(pl => pl.id === p.id);
      return updated ? { ...p, ...updated } : p;
    });
    scheduleEditMode = false;

// header shows course name in the subtitle — refresh the whole scorer view
    await renderScorer(scorerData.round.id);
    switchScorerTab("schedule");
  } catch(err){
    msg.textContent = "Error: " + err.message;
  }
}

async function deleteRound(roundId){
  if (!confirm("Delete this round? It'll be hidden from your rounds list, but can be restored later.")) return;
  try{
    await updateDoc(doc(db, "golf_rounds", roundId), { deleted: true, deletedAt: serverTimestamp() });
    location.hash = "";
  } catch(err){
    alert("Couldn't delete round: " + err.message);
  }
}

async function restoreRound(roundId){
  await updateDoc(doc(db, "golf_rounds", roundId), { deleted: false, deletedAt: null });
  scorerData.round.deleted = false;
  renderScorer(roundId);
}

async function finishRound(roundId){
  if (!confirm("Finish this round? Scores will be locked from further entry.")) return;
  await updateDoc(doc(db, "golf_rounds", roundId), { status: "finished", finishedAt: serverTimestamp() });
  scorerData.round.status = "finished";
  scorerData.round.finishedAt = new Date();
  renderScorer(roundId);
}

function switchScorerTab(which){

const SCORE_LABELS = { "-2":"Eagle", "-1":"Birdie", "0":"Par", "1":"Bogey", "2":"Dbl", "3":"Tpl+" };

function renderEntry(){
  const holeLabel = document.getElementById("holeLabel");
  const card = document.getElementById("entryCard");
  if (!holeLabel || !card) return;   // the "Start round" gate is showing instead — nothing to fill in yet
  const hole = scorerData.holes.find(h => h.holeNumber === scorerHole);
  const finished = scorerData.round.status === "finished";
  holeLabel.textContent = `Hole ${scorerHole} · Par ${hole.par} · SI ${hole.strokeIndex}`;

  const chipOffsets = [-2,-1,0,1,2,3];

  // undefined means an older round saved before this setting existed — default to all pars.
  // An empty array means the user was shown the checkboxes and picked none — respect that as "never applies".
  const parTypes = scorerData.round.scrambleDriveParTypes !== undefined
    ? scorerData.round.scrambleDriveParTypes
    : [3,4,5];
  const scrambleApplies = scorerData.round.scrambleDrive && parTypes.includes(hole.par);
  const scrambleHtml = scrambleApplies ? buildScrambleDriveHtml(finished) : "";

  const playersHtml = scorerData.players.map(p => {
    const existing = scorerData.scores.find(s => s.playerId === p.id && s.holeNumber === scorerHole);
    const currentVal = existing ? existing.grossStrokes : null;

    // running gross total through holes entered so far
    let total = 0, thru = 0;
    scorerData.holes.forEach(h => {
      const s = scorerData.scores.find(sc => sc.playerId === p.id && sc.holeNumber === h.holeNumber);
      if (s && s.grossStrokes != null){ total += s.grossStrokes; thru++; }
    });

    // Net Stableford points this exact gross score would be worth for this player,
    // so the points on offer are visible right where the score gets picked - not
    // just after the fact on the Stableford board.
    const sr = strokesReceived(p.playingHandicap, hole.strokeIndex);
    const chips = chipOffsets.map(off => {
      const val = Math.max(1, hole.par + off);
      const isActive = currentVal === val;
      const pts = stablefordPoints(hole.par, val - sr);
      return `<button type="button" class="score-chip" data-player="${p.id}" data-val="${val}"
        style="flex:1;min-width:0;padding:10px 2px;font-size:.95rem;
        background:${isActive ? "var(--brand-dark)" : "#fff"};
        color:${isActive ? "#fff" : "var(--ink)"};
        border:1px solid ${isActive ? "var(--brand-dark)" : "var(--line)"};
        border-radius:8px;" ${finished ? "disabled" : ""}>
        <div style="font-weight:700;">${val}</div>
        <div style="font-size:.62rem;opacity:.75;">${SCORE_LABELS[String(off)]}</div>
        <div style="font-size:.6rem;opacity:.9;font-weight:700;">${pts} pt${pts===1?"":"s"}</div>
      </button>`;
    }).join("");

    return `
      <div class="card" style="padding:12px;">
        <div class="row" style="justify-content:space-between;margin-bottom:8px;">
          <strong>${escapeHtml(p.name)}</strong>
          <span class="muted">hcp ${p.playingHandicap}${p.team ? " · team "+p.team : ""} · thru ${thru}: ${thru ? total : "-"}</span>
        </div>
        <div class="row" style="gap:6px;flex-wrap:nowrap;">${chips}</div>
        <div class="row" style="margin-top:6px;">
          <button type="button" class="ghost custom-btn" data-player="${p.id}" style="font-size:.75rem;padding:4px 10px;" ${finished ? "disabled" : ""}>Other score…</button>
          ${currentVal != null ? `<span class="muted" style="font-size:.75rem;">Entered: ${currentVal}</span>` : ""}
        </div>
      </div>`;
  }).join("");

  card.innerHTML = scrambleHtml + playersHtml;

  card.querySelectorAll(".scramble-pick").forEach(btn => {
    btn.addEventListener("click", () => saveScrambleDrive("playerId", btn.dataset.player));
  });
  card.querySelectorAll(".scramble-pick-team").forEach(btn => {
    btn.addEventListener("click", () => saveScrambleDrive(btn.dataset.field, btn.dataset.player));
  });
  card.querySelectorAll(".score-chip").forEach(btn => {
    btn.addEventListener("click", () => {
      const val = parseInt(btn.dataset.val, 10);
      const already = scorerData.scores.find(s => s.playerId === btn.dataset.player && s.holeNumber === scorerHole);
      if (already && already.grossStrokes === val){
        clearScore(btn.dataset.player);
      } else {
        saveScore(btn.dataset.player, val);
      }
    });
  });
  card.querySelectorAll(".custom-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const val = prompt("Enter gross strokes for this hole:");
      if (val === null || val.trim() === "") return;
      const n = parseInt(val, 10);
      if (!Number.isFinite(n) || n < 1) return;
      saveScore(btn.dataset.player, n);
    });
  });

  if (scorerData.round.gameModes.includes("bbb")){
    renderBBBPicker(finished);
  }
}

function getScrambleDriveForHole(holeNumber){
  return (scorerData.scrambleDrives || []).find(s => s.holeNumber === holeNumber) || null;
}

function buildScrambleDriveHtml(finished){
  const isBetterball = scorerData.round.gameModes.includes("betterball");
  if (isBetterball){
    return buildScrambleDriveTeamHtml(finished, "A", "team-a") + buildScrambleDriveTeamHtml(finished, "B", "team-b");
  }

  // Alliance: one fourball-wide pick per hole
  const current = getScrambleDriveForHole(scorerHole);
  return `
    <div class="card" style="padding:12px;border-color:var(--gold);margin-bottom:8px;">
      <strong>Scramble drive</strong>
      <div class="muted" style="font-size:.78rem;margin-bottom:4px;">Whose tee shot did the fourball play from?</div>
      <div class="row" style="gap:6px;flex-wrap:nowrap;">
        ${scorerData.players.map(p => {
          const isActive = current && current.playerId === p.id;
          return `<button type="button" class="scramble-pick" data-player="${p.id}"
            style="flex:1;min-width:0;padding:8px 2px;font-size:.78rem;
            background:${isActive ? "var(--gold)" : "#fff"};
            color:${isActive ? "var(--brand-dark)" : "var(--ink)"};
            border:1px solid ${isActive ? "var(--gold)" : "var(--line)"};
            border-radius:8px;font-weight:${isActive ? "800" : "500"};" ${finished ? "disabled" : ""}>
            ${escapeHtml(p.name)}
          </button>`;
        }).join("")}
      </div>
    </div>`;
}

function buildScrambleDriveTeamHtml(finished, teamKey, colorClass){
  const teamPlayers = scorerData.players.filter(p => p.team === teamKey);
  if (teamPlayers.length === 0) return "";
  const field = teamKey === "A" ? "teamA" : "teamB";
  const current = getScrambleDriveForHole(scorerHole);
  const currentPlayerId = current ? current[field] : null;

  return `
    <div class="card" style="padding:12px;border-color:var(--gold);margin-bottom:8px;">
      <strong class="${colorClass}">Team ${teamKey} scramble drive</strong>
      <div class="muted" style="font-size:.78rem;margin-bottom:4px;">Whose tee shot did this pair play from?</div>
      <div class="row" style="gap:6px;flex-wrap:nowrap;">
        ${teamPlayers.map(p => {
          const isActive = currentPlayerId === p.id;
          return `<button type="button" class="scramble-pick-team" data-field="${field}" data-player="${p.id}"
            style="flex:1;min-width:0;padding:8px 2px;font-size:.78rem;
            background:${isActive ? "var(--gold)" : "#fff"};
            color:${isActive ? "var(--brand-dark)" : "var(--ink)"};
            border:1px solid ${isActive ? "var(--gold)" : "var(--line)"};
            border-radius:8px;font-weight:${isActive ? "800" : "500"};" ${finished ? "disabled" : ""}>
            ${escapeHtml(p.name)}
          </button>`;
        }).join("")}
      </div>
    </div>`;
}

async function saveScrambleDrive(field, playerId){
  const current = getScrambleDriveForHole(scorerHole) || { holeNumber: scorerHole };
  const newVal = current[field] === playerId ? null : playerId;
  const rec = { ...current, holeNumber: scorerHole, [field]: newVal };

  const hasAnyValue = ["playerId", "teamA", "teamB"].some(k => rec[k]);
  if (!hasAnyValue){
    await deleteDoc(doc(db, "golf_rounds", scorerData.round.id, "scrambleDrives", String(scorerHole)));
  } else {
    await setDoc(doc(db, "golf_rounds", scorerData.round.id, "scrambleDrives", String(scorerHole)), rec);
  }

  if (!scorerData.scrambleDrives) scorerData.scrambleDrives = [];
  const idx = scorerData.scrambleDrives.findIndex(s => s.holeNumber === scorerHole);
  if (!hasAnyValue){
    if (idx >= 0) scorerData.scrambleDrives.splice(idx, 1);
  } else {
    if (idx >= 0) scorerData.scrambleDrives[idx] = rec; else scorerData.scrambleDrives.push(rec);
  }
  renderEntry();
  renderBoards();
}

function getBBBForHole(holeNumber){

async function saveBBB(category, playerId){
  const rec = getBBBForHole(scorerHole);
  const newVal = rec[category] === playerId ? null : playerId; // tap again to clear
  const updated = { ...rec, [category]: newVal };

  await setDoc(doc(db, "golf_rounds", scorerData.round.id, "bbb", String(scorerHole)), updated, { merge: true });

  const idx = (scorerData.bbb || []).findIndex(b => b.holeNumber === scorerHole);
  if (!scorerData.bbb) scorerData.bbb = [];
  if (idx >= 0) scorerData.bbb[idx] = updated; else scorerData.bbb.push(updated);

  renderEntry();
  renderBoards();
}

// Scores are applied to the screen first and written to Firestore after: setDoc only resolves once
// the server acknowledges, so awaiting it first left the chip, thru-count and every board frozen
// on a weak course signal. The write is queued by the SDK either way; a failure is surfaced.
function showScoreError(err){
  console.error(err);
  const el = document.getElementById("connIndicator");
  if (el){ el.className = "conn-indicator conn-offline"; el.innerHTML = `<span class="conn-dot"></span>Score not saved - retry`; }
}
function saveScore(playerId, val){
  const hole = scorerHole;
  const idx = scorerData.scores.findIndex(s => s.playerId === playerId && s.holeNumber === hole);
  // The hole of the very first score captured is where this round started - remember it, so the
  // match counts follow the real playing order.
  if (!scorerData.round.startHole && scorerData.scores.length === 0){
    scorerData.round.startHole = hole;
    updateDoc(doc(db, "golf_rounds", scorerData.round.id), { startHole: hole }).catch(() => {});
  }
  const rec = { playerId, holeNumber: hole, grossStrokes: val };
  if (idx >= 0) scorerData.scores[idx] = rec; else scorerData.scores.push(rec);
  renderEntry();
  renderBoards();
  return setDoc(doc(db, "golf_rounds", scorerData.round.id, "scores", `${playerId}_${hole}`), {
    playerId, holeNumber: hole, grossStrokes: val, updatedAt: serverTimestamp()
  }).catch(showScoreError);
}

function clearScore(playerId){
  const hole = scorerHole;
  const idx = scorerData.scores.findIndex(s => s.playerId === playerId && s.holeNumber === hole);
  if (idx >= 0) scorerData.scores.splice(idx, 1);
  if (scorerData.scores.length === 0 && scorerData.round.startHole){
    scorerData.round.startHole = null;   // nothing scored any more: the next first score sets it afresh
    updateDoc(doc(db, "golf_rounds", scorerData.round.id), { startHole: null }).catch(() => {});
  }
  renderEntry();
  renderBoards();
  return deleteDoc(doc(db, "golf_rounds", scorerData.round.id, "scores", `${playerId}_${hole}`)).catch(showScoreError);
}

// While scoring a fourball that's part of a (non-Piekfyn) competition, its own Leaderboards tab
// also embeds the full combined leaderboard below its own board, so the scorer can see both
// without leaving the scoring screen. Piekfyn already has its own cross-fourball board built in.
let siblingBundles = [];
let siblingUnsubs = [];
async function loadSiblingBundles(round){
  if (siblingUnsubs.length) siblingUnsubs.forEach(u => u());
  siblingUnsubs = [];
  siblingBundles = [];
  if (!round.competitionId || round.gameModes.includes("piekfyn")) return;

  const roundsSnap = await getDocs(query(collection(db, "golf_rounds"), where("competitionId", "==", round.competitionId)));
  const others = roundsSnap.docs.map(d => ({ id: d.id, ...d.data() }))
    .filter(r => !r.deleted && r.id !== round.id)
    .sort((a,b) => (a.fourballIndex||0) - (b.fourballIndex||0));
  siblingBundles = await Promise.all(others.map(r => loadRoundBundle(r.id)));

  const mode = round.gameModes[0];
  siblingUnsubs = others.flatMap(r => {
    const unsubs = [onSnapshot(collection(db, "golf_rounds", r.id, "scores"), snap => {
      const idx = siblingBundles.findIndex(b => b.round.id === r.id);
      if (idx >= 0){ siblingBundles[idx].scores = snap.docs.map(d => d.data()); renderBoards(); }
    })];
    if (mode === "bbb"){
      unsubs.push(onSnapshot(collection(db, "golf_rounds", r.id, "bbb"), snap => {
        const idx = siblingBundles.findIndex(b => b.round.id === r.id);
        if (idx >= 0){ siblingBundles[idx].bbb = snap.docs.map(d => d.data()); renderBoards(); }
      }));
    }
    return unsubs;
  });
  renderBoards();   // sibling data just arrived — refresh once now, on top of the live updates above
}

// Lets a marshal/marker scoring a whole competition jump straight between fourballs
// without backing out to the competition page each time.
function renderFourballSwitcher(roundId, routePrefix){
  const el = document.getElementById("fourballSwitcher");
  if (!el) return;
  if (!siblingBundles.length){ el.innerHTML = ""; return; }
  const all = [scorerData, ...siblingBundles].sort((a,b) => (a.round.fourballIndex||0) - (b.round.fourballIndex||0));
  el.innerHTML = `
    <label style="margin-top:0;">Switch fourball</label>
    <select id="fourballSwitchSelect">
      ${all.map(b => `<option value="${b.round.id}" ${b.round.id===roundId?"selected":""}>Fourball ${b.round.fourballIndex||"?"} — ${b.players.map(p=>escapeHtml(p.name)).join(", ")}</option>`).join("")}
    </select>`;
  document.getElementById("fourballSwitchSelect").onchange = (e) => { location.hash = `#/${routePrefix}/${e.target.value}`; };
}

function renderBoards(){
  currentBundle = scorerData;
  const { round } = scorerData;
  const showsCombined = !!round.competitionId && !round.gameModes.includes("piekfyn");
  let html = buildBoardsHtml(scorerData, { includeStandingsLink: !showsCombined });
  if (showsCombined){
    const mode = round.gameModes[0];
    const allBundles = [scorerData, ...siblingBundles].sort((a,b) => (a.round.fourballIndex||0) - (b.round.fourballIndex||0));
    html += `<h2 style="margin-top:20px;">Full leaderboard</h2>` + buildCompetitionBody({}, mode, allBundles);
  }
  document.getElementById("boards").innerHTML = html;
  if (round.gameModes.includes("piekfyn")) wirePiekfynTabs();
}

/* ============================================================
   SPECTATOR VIEW (read-only, realtime)
   ============================================================ */
let spectatorUnsub = null;
let spectatorBbbUnsub = null;
let spectatorScrambleUnsub = null;

async function renderSpectator(code){
  const app = document.getElementById("app");
  app.innerHTML = `<p class="muted">Loading…</p>`;

  const q = query(collection(db, "golf_rounds"), where("spectatorCode", "==", code), limit(1));
  const snap = await getDocs(q);
  if (snap.empty){ app.innerHTML = `<p>Round not found.</p>`; return; }
  const roundId = snap.docs[0].id;

  const bundle = await loadRoundBundle(roundId);
  currentBundle = bundle;
  piekfynActiveTab = "fourballs";

  function renderSpectatorBoards(){
    document.getElementById("boards").innerHTML = buildBoardsHtml(bundle, {alwaysIncludeStableford: false});
    if (bundle.round.gameModes.includes("piekfyn")) wirePiekfynTabs();
  }

  app.innerHTML = `
    ${renderAppHeader(bundle.round.name, bundle.round.courseName, bundle.round.status === "finished" ? "final" : "live")}
    <div class="content">
    <div>${bundle.round.gameModes.map(m => `<span class="pill mode">${GAME_MODES.find(g=>g.key===m).label}</span>`).join("")}</div>
    ${bundle.round.status === "finished" ? `<div class="card" style="text-align:center;border-color:var(--brand);"><strong>Final result</strong></div>` : ""}
    <h2>Leaderboards</h2>
    <div id="boards"></div>
    </div>
  `;
  renderSpectatorBoards();

  if (spectatorUnsub) spectatorUnsub();
  spectatorUnsub = onSnapshot(collection(db, "golf_rounds", roundId, "scores"), snap => {
    bundle.scores = snap.docs.map(d => d.data());
    currentBundle = bundle;
    renderSpectatorBoards();
  });

  if (spectatorBbbUnsub) spectatorBbbUnsub();
  spectatorBbbUnsub = onSnapshot(collection(db, "golf_rounds", roundId, "bbb"), snap => {
    bundle.bbb = snap.docs.map(d => d.data());
    currentBundle = bundle;
    renderSpectatorBoards();
  });

  if (spectatorScrambleUnsub) spectatorScrambleUnsub();
  spectatorScrambleUnsub = onSnapshot(collection(db, "golf_rounds", roundId, "scrambleDrives"), snap => {
    bundle.scrambleDrives = snap.docs.map(d => d.data());
    currentBundle = bundle;
    renderSpectatorBoards();
  });
}

async function saveCompetitionEdit(comp, mode, bundles){
  const msg = document.getElementById("competitionEditMsg");
  const name = document.getElementById("editCompName").value.trim() || comp.name;
  const courseName = document.getElementById("editCompCourseName").value.trim() || comp.courseName;
  const roundDate = document.getElementById("editCompDate").value.trim();
  const teeBox = document.getElementById("editCompTeeBox").value;
  const updates = { name, courseName, roundDate, teeBox };
  if (mode === "piekfyn"){
    updates.teamAName = document.getElementById("editCompTeamAName").value.trim() || "Team A";
    updates.teamBName = document.getElementById("editCompTeamBName").value.trim() || "Team B";
    const colorStyleEl = document.querySelector('input[name="editCompTeamColorStyle"]:checked');
    if (colorStyleEl) updates.teamColorStyle = colorStyleEl.value;
    updates.teamAColor = document.getElementById("editCompTeamAColor").value;
    updates.teamBColor = document.getElementById("editCompTeamBColor").value;
  }

  if (msg) msg.textContent = "Saving…";
  try{
    const batch = writeBatch(db);
    batch.update(doc(db, "golf_competitions", comp.id), updates);
    bundles.forEach(b => {
      const roundUpdates = { courseName, roundDate, teeBox, name: `${name} — Fourball ${b.round.fourballIndex}` };
      if (mode === "piekfyn"){
        roundUpdates.teamAName = updates.teamAName; roundUpdates.teamBName = updates.teamBName;
        roundUpdates.teamColorStyle = updates.teamColorStyle;
        roundUpdates.teamAColor = updates.teamAColor; roundUpdates.teamBColor = updates.teamBColor;
      }
      batch.update(doc(db, "golf_rounds", b.round.id), roundUpdates);
    });
    await batch.commit();
    competitionEditMode = false;
    await renderCompetition(comp.id);
  } catch(err){
    if (msg) msg.textContent = "Error: " + err.message;
  }
}

async function renderCompetition(competitionId){
  const app = document.getElementById("app");
  app.innerHTML = `<p class="muted">Loading…</p>`;

  const compSnap = await getDoc(doc(db, "golf_competitions", competitionId));
  if (!compSnap.exists()){ app.innerHTML = `<p>Competition not found.</p>`; return; }
  const comp = { id: compSnap.id, ...compSnap.data() };
  const mode = (comp.gameModes && comp.gameModes[0]) || "stroke";
  competitionEditMode = false;
  piekfynActiveTab = "fourballs";

  const roundsSnap = await getDocs(query(collection(db, "golf_rounds"), where("competitionId", "==", competitionId)));
  const fourballRounds = roundsSnap.docs.map(d => ({ id: d.id, ...d.data() }))
    .filter(r => !r.deleted)
    .sort((a,b) => (a.fourballIndex||0) - (b.fourballIndex||0));

  const bundles = await Promise.all(fourballRounds.map(r => loadRoundBundle(r.id)));
  competitionBundlesForLinks = bundles;

  function renderControls(){
    const el = document.getElementById("competitionControls");
    if (!el) return;
    el.innerHTML = competitionEditMode ? buildCompetitionEditHtml(comp, mode) : buildCompetitionControlsHtml(comp);
    if (competitionEditMode){
      document.getElementById("saveCompetitionBtn").onclick = () => saveCompetitionEdit(comp, mode, bundles);
      document.getElementById("cancelCompetitionEditBtn").onclick = () => { competitionEditMode = false; renderControls(); };
      if (mode === "piekfyn") wireTeamColorPreview("editCompTeamAColor", "editCompTeamBColor");
    } else if (comp.deleted){
      document.getElementById("restoreCompetitionBtn").onclick = async () => {
        await restoreCompetition(comp.id);
        comp.deleted = false;
        renderControls();
      };
    } else {
      document.getElementById("editCompetitionBtn").onclick = () => { competitionEditMode = true; renderControls(); };
      document.getElementById("deleteCompetitionBtn").onclick = async () => {
        if (!confirm("Delete this competition? Every fourball in it will be hidden too, but nothing is erased — you can restore it all later.")) return;
        await deleteCompetition(comp.id);
        location.hash = "";
      };
    }
  }

  function renderBody(){
    document.getElementById("competitionBody").innerHTML =
      buildCompetitionBody(comp, mode, bundles) + buildFourballLinksHtml(bundles);
    document.querySelectorAll(".copy-link-btn").forEach(btn => {
      btn.onclick = () => navigator.clipboard.writeText(btn.dataset.url);
    });
    if (mode === "piekfyn") wirePiekfynTabs();
  }

  const subtitle = mode === "piekfyn"
    ? `${comp.teamAName || "Team A"} vs ${comp.teamBName || "Team B"}`
    : `${competitionModeLabel(mode)}${comp.courseName ? " · " + comp.courseName : ""}`;
  // The competition's own page has Edit/Delete and every fourball's own scoring link — not safe
  // to hand to a spectator. #/standings/ is the read-only view built for exactly that: the
  // combined leaderboard with none of those controls, so sharing it can't touch anyone's scores.
  const standingsUrl = location.origin + location.pathname + `#/standings/${comp.id}`;

  mountPage({
    title: comp.name,
    subtitle,
    badge: "live",
    route: null,
    bodyHtml: `
    <div class="link-box">
      <span class="muted">Spectator link:</span>
      <input type="text" readonly value="${standingsUrl}" onclick="this.select()">
      <button class="ghost copy-link-btn" data-url="${standingsUrl}">Copy</button>
    </div>
    <div id="competitionControls"></div>
    <div id="competitionBody"><p class="muted">Loading…</p></div>
    `,
  });
  renderControls();
  renderBody();

  if (competitionUnsubs.length) competitionUnsubs.forEach(u => u());
  competitionUnsubs = fourballRounds.flatMap(r => {
    const unsubs = [onSnapshot(collection(db, "golf_rounds", r.id, "scores"), snap => {
      const idx = bundles.findIndex(b => b.round.id === r.id);
      if (idx >= 0){ bundles[idx].scores = snap.docs.map(d => d.data()); renderBody(); }
    })];
    if (mode === "bbb"){
      unsubs.push(onSnapshot(collection(db, "golf_rounds", r.id, "bbb"), snap => {
        const idx = bundles.findIndex(b => b.round.id === r.id);
        if (idx >= 0){ bundles[idx].bbb = snap.docs.map(d => d.data()); renderBody(); }
      }));
    }
    return unsubs;
  });
}
