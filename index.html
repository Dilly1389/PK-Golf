/* ============================================================
   SCORING ENGINE + BOARD RENDERING (shared by scorer & spectator)
   ============================================================ */
function computeDetail(bundle){
  const { players, holes, scores } = bundle;
  const scoreMap = {};
  players.forEach(p => scoreMap[p.id] = {});
  scores.forEach(s => { if (scoreMap[s.playerId]) scoreMap[s.playerId][s.holeNumber] = s.grossStrokes; });

  const detail = {};
  players.forEach(p => {
    detail[p.id] = {};
    holes.forEach(h => {
      const gross = scoreMap[p.id][h.holeNumber];
      if (gross == null){ detail[p.id][h.holeNumber] = { gross:null, net:null, pts:null }; return; }
      const sr = strokesReceived(p.playingHandicap, h.strokeIndex);
      const net = gross - sr;
      const pts = stablefordPoints(h.par, net);
      detail[p.id][h.holeNumber] = { gross, net, pts, sr };
    });
  });
  return detail;
}

function buildBoardsHtml(bundle){
  const { round, holes, players } = bundle;
  const detail = computeDetail(bundle);

  let html = "";
  if (round.gameModes.includes("stroke")) html += buildStrokeBoard(players, holes, detail);
  if (round.gameModes.includes("stableford")) html += buildStablefordBoard(players, holes, detail);
  if (round.gameModes.includes("matchplay")) html += buildMatchPlayBoard(players, holes, detail);
  if (round.gameModes.includes("betterball")) html += buildBetterballBoard(bundle, detail);
  if (round.gameModes.includes("alliance")) html += buildAllianceBoard(bundle, detail);
  if (round.gameModes.includes("bbb")) html += buildBBBBoard(bundle);
  if (round.gameModes.includes("piekfyn")) html += buildPiekfynBoard(bundle, detail);
  return html;
}

function totalsFor(players, holes, detail, field){
  const totals = {};
  players.forEach(p => {
    let sum = 0, count = 0;
    holes.forEach(h => {
      const v = detail[p.id][h.holeNumber][field];
      if (v != null){ sum += v; count++; }
    });
    totals[p.id] = { sum, count };
  });
  return totals;
}

function playerLink(p){
  return `<span class="player-name-link" data-player="${p.id}">${p.name}</span><span class="muted" style="font-size:.72rem;font-weight:400;"> (${p.playingHandicap})</span>`;
}

function buildStrokeBoard(players, holes, detail){
  const gross = totalsFor(players, holes, detail, "gross");
  const net = totalsFor(players, holes, detail, "net");
  const rows = players.map(p => ({ p, g: gross[p.id], n: net[p.id] }))
    .sort((a,b) => (a.n.count ? a.n.sum : 999) - (b.n.count ? b.n.sum : 999));

  return `
  <div class="card">
    <strong>Stroke play</strong> <span class="muted">— gross / net</span>
    <table style="margin-top:8px;">
      <tr><th class="name-col">Player</th><th>Thru</th><th>Gross</th><th>Net</th><th>Net vs par</th></tr>
      ${rows.map(r => `
        <tr>
          <td class="name-col">${playerLink(r.p)}</td>
          <td>${r.g.count}</td>
          <td>${r.g.count ? r.g.sum : "-"}</td>
          <td>${r.n.count ? r.n.sum : "-"}</td>
          <td>${r.n.count ? fmtDiff(r.n.sum - holes.slice(0,r.n.count).reduce((a,h)=>a+h.par,0)) : "-"}</td>
        </tr>`).join("")}
    </table>
  </div>`;
}

function buildStablefordBoard(players, holes, detail){
  const pts = totalsFor(players, holes, detail, "pts");
  const rows = players.map(p => ({ p, s: pts[p.id] })).sort((a,b) => b.s.sum - a.s.sum);
  return `
  <div class="card">
    <strong>Stableford</strong> <span class="muted">— points, higher is better</span>
    <table style="margin-top:8px;">
      <tr><th class="name-col">Player</th><th>Thru</th><th>Points</th></tr>
      ${rows.map((r,i) => `
        <tr class="${i===0 && r.s.count ? 'leader-row' : ''}">
          <td class="name-col">${playerLink(r.p)}</td>
          <td>${r.s.count}</td>
          <td>${r.s.count ? r.s.sum : "-"}</td>
        </tr>`).join("")}
    </table>
  </div>`;
}

function buildMatchPlayBoard(players, holes, detail){
  const teamA = players.filter(p => p.team === "A");
  const teamB = players.filter(p => p.team === "B");
  if (teamA.length === 0 || teamB.length === 0){
    return `<div class="card"><strong>Match play</strong><p class="muted">Needs players on both Team A and Team B.</p></div>`;
  }
  let holesUp = 0, holesPlayed = 0;
  for (const h of holes){
    const aNets = teamA.map(p => detail[p.id][h.holeNumber].net).filter(v => v != null);
    const bNets = teamB.map(p => detail[p.id][h.holeNumber].net).filter(v => v != null);
    if (aNets.length < teamA.length || bNets.length < teamB.length) break;
    const aBest = Math.min(...aNets), bBest = Math.min(...bNets);
    holesPlayed++;
    if (aBest < bBest) holesUp++;
    else if (bBest < aBest) holesUp--;
  }
  const remaining = 18 - holesPlayed;
  let statusText, statusClass;
  if (holesPlayed === 0){ statusText = "Not started"; statusClass = "status-all-sq"; }
  else if (Math.abs(holesUp) > remaining){
    statusText = `${Math.abs(holesUp)} & ${remaining} — Team ${holesUp>0?'A':'B'} wins`;
    statusClass = holesUp>0 ? "status-up" : "status-down";
  } else if (holesUp === 0){ statusText = "All square"; statusClass = "status-all-sq"; }
  else { statusText = `Team ${holesUp>0?'A':'B'} ${Math.abs(holesUp)} up`; statusClass = holesUp>0 ? "status-up" : "status-down"; }

  return `
  <div class="card">
    <strong>Match play</strong>
    <span class="muted">— <span class="team-a">Team A</span>: ${teamA.map(p=>playerLink(p)).join(", ")}
    vs <span class="team-b">Team B</span>: ${teamB.map(p=>playerLink(p)).join(", ")} · better-ball net</span>
    <p class="${statusClass}" style="font-size:1.1rem;margin:10px 0 0;">${statusText}</p>
    <p class="muted" style="margin:2px 0 0;">Through ${holesPlayed} hole${holesPlayed===1?"":"s"}</p>
  </div>`;
}

function computeBetterballData(bundle, detail){
  const { players, holes } = bundle;
  const teamA = players.filter(p => p.team === "A");
  const teamB = players.filter(p => p.team === "B");
  function bestFor(teamPlayers, holeNumber){
    let best = null, bestPlayerId = null;
    teamPlayers.forEach(p => {
      const v = detail[p.id][holeNumber].pts;
      if (v != null && (best == null || v > best)){ best = v; bestPlayerId = p.id; }
    });
    return { best, bestPlayerId };
  }
  return holes.map(h => ({
    holeNumber: h.holeNumber,
    teamA: bestFor(teamA, h.holeNumber),
    teamB: bestFor(teamB, h.holeNumber),
  }));
}

function buildBetterballBoard(bundle, detail){
  const { players } = bundle;
  const teamA = players.filter(p => p.team === "A");
  const teamB = players.filter(p => p.team === "B");
  if (teamA.length === 0 || teamB.length === 0){
    return `<div class="card"><strong>Betterball Stableford</strong><p class="muted">Needs players on both Team A and Team B.</p></div>`;
  }
  const data = computeBetterballData(bundle, detail);
  const thruA = data.filter(d => d.teamA.best != null).length;
  const thruB = data.filter(d => d.teamB.best != null).length;
  const totalA = data.reduce((a,d) => a + (d.teamA.best || 0), 0);
  const totalB = data.reduce((a,d) => a + (d.teamB.best || 0), 0);

  return `
  <div class="card">
    <strong>Betterball Stableford</strong>
    <span class="muted">— <span class="team-a">Team A</span>: ${teamA.map(p=>playerLink(p)).join(", ")}
    vs <span class="team-b">Team B</span>: ${teamB.map(p=>playerLink(p)).join(", ")} · best net-Stableford score of the pair counts</span>
    <table style="margin-top:8px;">
      <tr><th class="name-col">Team</th><th>Thru</th><th>Points</th></tr>
      <tr><td class="name-col team-a">Team A</td><td>${thruA}</td><td>${thruA ? totalA : "-"}</td></tr>
      <tr><td class="name-col team-b">Team B</td><td>${thruB}</td><td>${thruB ? totalB : "-"}</td></tr>
    </table>
    <div class="team-scorecard-link" data-betterball-link="1">View full scorecard</div>
  </div>`;
}

function computeAllianceData(bundle, detail){
  const { players, holes, round } = bundle;
  const n = Math.max(1, Math.min(round.allianceCount || 2, players.length));
  return holes.map(h => {
    const entries = players.map(p => ({ playerId: p.id, pts: detail[p.id][h.holeNumber].pts }));
    const allEntered = entries.every(e => e.pts != null);
    const counted = new Set();
    let teamPts = null;
    if (allEntered){
      const sorted = [...entries].sort((a,b) => b.pts - a.pts);
      teamPts = sorted.slice(0, n).reduce((a,e) => a + e.pts, 0);
      sorted.slice(0, n).forEach(e => counted.add(e.playerId));
    }
    return { holeNumber: h.holeNumber, entries, counted, teamPts };
  });
}

function buildAllianceBoard(bundle, detail){
  const { players, round } = bundle;
  const n = Math.max(1, Math.min(round.allianceCount || 2, players.length));
  const data = computeAllianceData(bundle, detail);
  const thru = data.filter(d => d.teamPts != null).length;
  const total = data.reduce((a,d) => a + (d.teamPts || 0), 0);
  return `
  <div class="card">
    <strong>Alliance</strong> <span class="muted">— best ${n} of ${players.length} net-stableford scores per hole</span>
    <p style="font-size:1.1rem;margin:10px 0 4px;">${thru ? total + " points" : "Not started"} <span class="muted" style="font-size:.85rem;">(thru ${thru})</span></p>
    <div class="team-scorecard-link">Fourball: ${players.map(p=>p.name).join(", ")} — view full scorecard</div>
  </div>`;
}

function buildBBBBoard(bundle){
  const { players, bbb } = bundle;
  const totals = {};
  players.forEach(p => totals[p.id] = { bingo: 0, bango: 0, bongo: 0 });
  let holesRecorded = 0;
  (bbb || []).forEach(rec => {
    let any = false;
    BBB_CATEGORIES.forEach(cat => {
      if (rec[cat.key] && totals[rec[cat.key]]){ totals[rec[cat.key]][cat.key]++; any = true; }
    });
    if (any) holesRecorded++;
  });
  const rows = players.map(p => {
    const t = totals[p.id];
    return { p, total: t.bingo + t.bango + t.bongo, t };
  }).sort((a,b) => b.total - a.total);

  return `
  <div class="card">
    <strong>Bingo Bango Bongo</strong> <span class="muted">— 1 point each for first on green, closest once all on, first to hole out</span>
    <table style="margin-top:8px;">
      <tr><th class="name-col">Player</th><th>Bingo</th><th>Bango</th><th>Bongo</th><th>Total</th></tr>
      ${rows.map((r,i) => `
        <tr class="${i===0 && r.total>0 ? 'leader-row' : ''}">
          <td class="name-col">${playerLink(r.p)}</td>
          <td>${r.t.bingo}</td>
          <td>${r.t.bango}</td>
          <td>${r.t.bongo}</td>
          <td><strong>${r.total}</strong></td>
        </tr>`).join("")}
    </table>
    <p class="muted" style="font-size:.75rem;margin-top:6px;">${holesRecorded} hole${holesRecorded===1?"":"s"} recorded</p>
  </div>`;
}

/* ---------- Piekfyn Kompetisie: 2 singles matches + 1 team match, 1pt win / 0.5pt halve ---------- */
function computeMatch(holes, detail, sideAPlayers, sideBPlayers){
  let holesUp = 0, holesPlayed = 0;
  for (const h of holes){
    const aNets = sideAPlayers.map(p => detail[p.id][h.holeNumber].net).filter(v => v != null);
    const bNets = sideBPlayers.map(p => detail[p.id][h.holeNumber].net).filter(v => v != null);
    if (aNets.length < sideAPlayers.length || bNets.length < sideBPlayers.length) break;
    const aBest = Math.min(...aNets), bBest = Math.min(...bNets);
    holesPlayed++;
    if (aBest < bBest) holesUp++;
    else if (bBest < aBest) holesUp--;
  }
  const remaining = 18 - holesPlayed;
  let decided = false, winner = null, statusText;
  if (holesPlayed === 0){
    statusText = "Not started";
  } else if (Math.abs(holesUp) > remaining){
    decided = true;
    winner = holesUp > 0 ? "A" : "B";
    statusText = `${Math.abs(holesUp)} & ${remaining}`;
  } else if (holesPlayed === 18){
    decided = true;
    if (holesUp === 0){ winner = null; statusText = "Halved"; }
    else { winner = holesUp > 0 ? "A" : "B"; statusText = `${Math.abs(holesUp)} up`; }
  } else {
    statusText = holesUp === 0 ? `All square thru ${holesPlayed}` : `${holesUp > 0 ? "A" : "B"} ${Math.abs(holesUp)} up thru ${holesPlayed}`;
  }
  return { holesUp, holesPlayed, decided, winner, statusText };
}

function computePiekfynPoints(bundle, detail){
  const { round, holes, players } = bundle;
  const pairs = round.piekfynPairs || [];
  const byOrder = {};
  players.forEach(p => byOrder[p.sortOrder] = p);

  const matches = pairs.map(pair => {
    const pA = byOrder[pair.a], pB = byOrder[pair.b];
    if (!pA || !pB) return null;
    return { pA, pB, m: computeMatch(holes, detail, [pA], [pB]) };
  }).filter(Boolean);

  const teamAPlayers = players.filter(p => p.team === "A");
  const teamBPlayers = players.filter(p => p.team === "B");
  const teamMatch = computeMatch(holes, detail, teamAPlayers, teamBPlayers);

  let teamAPts = 0, teamBPts = 0;
  function tally(m){
    if (!m.decided) return;
    if (m.winner === "A") teamAPts += 1;
    else if (m.winner === "B") teamBPts += 1;
    else { teamAPts += 0.5; teamBPts += 0.5; }
  }
  matches.forEach(({m}) => tally(m));
  tally(teamMatch);

  const decidedCount = matches.filter(({m}) => m.decided).length + (teamMatch.decided ? 1 : 0);
  return { matches, teamMatch, teamAPts, teamBPts, decidedCount };
}

function piekfynStatusClass(m){
  if (m.decided) return m.winner === null ? "status-all-sq" : (m.winner === "A" ? "status-up" : "status-down");
  if (m.holesPlayed === 0) return "status-all-sq";
  return m.holesUp === 0 ? "status-all-sq" : (m.holesUp > 0 ? "status-up" : "status-down");
}

function buildPiekfynBoard(bundle, detail){
  const { round } = bundle;
  const teamAName = round.teamAName || "Team A";
  const teamBName = round.teamBName || "Team B";
  const { matches, teamMatch, teamAPts, teamBPts, decidedCount } = computePiekfynPoints(bundle, detail);

  function matchLine(label, m){
    return `<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);">
      <span>${label}</span>
      <span class="${piekfynStatusClass(m)}">${m.statusText}</span>
    </div>`;
  }

  return `
  <div class="card">
    <strong>Piekfyn Kompetisie</strong> <span class="muted">— ${teamAName} vs ${teamBName}</span>
    ${round.competitionId ? `<div class="team-scorecard-link" data-standings-link="${round.competitionId}">Part of a multi-fourball competition — view overall standings</div>` : ""}
    <div style="margin-top:8px;">
      ${matches.map(({pA,pB,m}) => matchLine(`${playerLink(pA)} vs ${playerLink(pB)}`, m)).join("")}
      ${matchLine(`${teamAName} vs ${teamBName} (fourball)`, teamMatch)}
    </div>
    <p style="font-size:1.2rem;margin:12px 0 0;text-align:center;">
      <strong>${teamAName} ${teamAPts}</strong> — <strong>${teamBPts} ${teamBName}</strong>
    </p>
    <p class="muted" style="text-align:center;font-size:.78rem;margin-top:2px;">
      ${decidedCount < 3 ? `${decidedCount} of 3 matches decided` : (teamAPts>teamBPts ? `${teamAName} win` : teamAPts<teamBPts ? `${teamBName} win` : "Tied — halved competition")}
    </p>
  </div>`;
}

/* ============================================================
   INDIVIDUAL SCORECARD (clickable player names)
   ============================================================ */
function countEntered(subset, player, detail, field){
  return subset.filter(h => detail[player.id][h.holeNumber][field] != null).length;
}
function sumField(subset, player, detail, field){
  return subset.reduce((acc,h) => {
    const v = detail[player.id][h.holeNumber][field];
    return v == null ? acc : acc + v;
  }, 0);
}
function scoreCell(subset, player, detail, field){
  return subset.map(h => {
    const v = detail[player.id][h.holeNumber][field];
    return `<td>${v == null ? "-" : v}</td>`;
  }).join("");
}
function aggCell(subset, player, detail, field){
  const n = countEntered(subset, player, detail, field);
  return `<td class="agg-col">${n === 0 ? "-" : sumField(subset, player, detail, field)}</td>`;
}

function openScorecard(playerId){
  if (!currentBundle) return;
  const { round, holes, players } = currentBundle;
  const player = players.find(p => p.id === playerId);
  if (!player) return;
  const detail = computeDetail(currentBundle);

  const front = holes.filter(h => h.holeNumber <= 9);
  const back = holes.filter(h => h.holeNumber > 9);
  const showPts = round.gameModes.includes("stableford");

  const parTotal = holes.reduce((a,h)=>a+h.par,0);

  const grossThru = countEntered(holes, player, detail, "gross");

  const html = `
    <div class="scorecard-overlay" id="scorecardOverlay">
      <div class="scorecard-panel">
        <button class="scorecard-close" id="scorecardCloseBtn">&times;</button>
        <div class="scorecard-heading">
          <div class="course">${round.courseName}</div>
          <div class="meta">${round.roundDate || ""}${round.teeTime ? " · " + round.teeTime : ""}${round.teeBox ? " · " + round.teeBox + " tees" : ""}</div>
        </div>
        <div class="scorecard-player-name">${player.name} <span class="muted" style="font-size:.85rem;font-weight:600;">(hcp ${player.playingHandicap}${player.team ? " · team " + player.team : ""})</span></div>

        <div class="scorecard-table-wrap">
        <table class="scorecard-table">
          <thead>
            <tr>
              <th class="label-col">Hole</th>
              ${front.map(h=>`<th>${h.holeNumber}${scrambleHoleMark(currentBundle, h.holeNumber)}</th>`).join("")}
              <th class="agg-col">OUT</th>
              ${back.map(h=>`<th>${h.holeNumber}${scrambleHoleMark(currentBundle, h.holeNumber)}</th>`).join("")}
              <th class="agg-col">IN</th>
              <th class="agg-col">TOTAL</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="label-col">Par</td>
              ${front.map(h=>`<td>${h.par}</td>`).join("")}
              <td class="agg-col">${front.reduce((a,h)=>a+h.par,0)}</td>
              ${back.map(h=>`<td>${h.par}</td>`).join("")}
              <td class="agg-col">${back.reduce((a,h)=>a+h.par,0)}</td>
              <td class="agg-col">${parTotal}</td>
            </tr>
            <tr>
              <td class="label-col">S.I.</td>
              ${front.map(h=>`<td>${h.strokeIndex}</td>`).join("")}
              <td class="agg-col">-</td>
              ${back.map(h=>`<td>${h.strokeIndex}</td>`).join("")}
              <td class="agg-col">-</td>
              <td class="agg-col">-</td>
            </tr>
            <tr class="gross-row">
              <td class="label-col">Gross</td>
              ${scoreCell(front, player, detail, "gross")}
              ${aggCell(front, player, detail, "gross")}
              ${scoreCell(back, player, detail, "gross")}
              ${aggCell(back, player, detail, "gross")}
              ${aggCell(holes, player, detail, "gross")}
            </tr>
            <tr>
              <td class="label-col">Net</td>
              ${scoreCell(front, player, detail, "net")}
              ${aggCell(front, player, detail, "net")}
              ${scoreCell(back, player, detail, "net")}
              ${aggCell(back, player, detail, "net")}
              ${aggCell(holes, player, detail, "net")}
            </tr>
            ${showPts ? `
            <tr>
              <td class="label-col">Points</td>
              ${scoreCell(front, player, detail, "pts")}
              ${aggCell(front, player, detail, "pts")}
              ${scoreCell(back, player, detail, "pts")}
              ${aggCell(back, player, detail, "pts")}
              ${aggCell(holes, player, detail, "pts")}
            </tr>` : ""}
          </tbody>
        </table>
        </div>

        <div class="scorecard-summary">
          <div><div class="val">${grossThru}/18</div><div class="lbl">Thru</div></div>
          <div><div class="val">${countEntered(holes,player,detail,"gross") ? sumField(holes,player,detail,"gross") : "-"}</div><div class="lbl">Gross</div></div>
          <div><div class="val">${countEntered(holes,player,detail,"net") ? sumField(holes,player,detail,"net") : "-"}</div><div class="lbl">Net</div></div>
          ${showPts ? `<div><div class="val">${countEntered(holes,player,detail,"pts") ? sumField(holes,player,detail,"pts") : "-"}</div><div class="lbl">Points</div></div>` : ""}
        </div>
        ${scrambleLegend(currentBundle)}
      </div>
    </div>
  `;

  const wrapper = document.createElement("div");
  wrapper.innerHTML = html;
  document.body.appendChild(wrapper.firstElementChild);

  const overlay = document.getElementById("scorecardOverlay");
  document.getElementById("scorecardCloseBtn").onclick = closeScorecard;
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeScorecard(); });
}

function closeScorecard(){
  const overlay = document.getElementById("scorecardOverlay");
  if (overlay) overlay.remove();
}

function scrambleHoleMark(bundle, holeNumber){
  const rec = (bundle.scrambleDrives || []).find(s => s.holeNumber === holeNumber);
  return rec ? `<span title="Scramble drive">*</span>` : "";
}
function scrambleLegend(bundle){
  const recs = (bundle.scrambleDrives || []).slice().sort((a,b) => a.holeNumber - b.holeNumber);
  if (recs.length === 0) return "";
  const byId = {};
  bundle.players.forEach(p => byId[p.id] = p.name);
  const parts = recs.map(r => {
    if (r.teamA || r.teamB){
      const bits = [];
      if (r.teamA) bits.push(`A: ${byId[r.teamA] || "?"}`);
      if (r.teamB) bits.push(`B: ${byId[r.teamB] || "?"}`);
      return `Hole ${r.holeNumber}: ${bits.join(", ")}`;
    }
    return `Hole ${r.holeNumber}: ${byId[r.playerId] || "?"}`;
  });
  return `<p class="muted" style="font-size:.72rem;margin-top:8px;">* Scramble drive — ${parts.join(" · ")}</p>`;
}

function openTeamScorecard(){
  if (!currentBundle) return;
  const { round, holes, players } = currentBundle;
  const detail = computeDetail(currentBundle);
  const n = Math.max(1, Math.min(round.allianceCount || 2, players.length));
  const data = computeAllianceData(currentBundle, detail); // per-hole: {holeNumber, entries, counted, teamPts}
  const byHole = {};
  data.forEach(d => byHole[d.holeNumber] = d);

  const front = holes.filter(h => h.holeNumber <= 9);
  const back = holes.filter(h => h.holeNumber > 9);

  function ptsCell(playerId, h){
    const d = byHole[h.holeNumber];
    const entry = d.entries.find(e => e.playerId === playerId);
    const pts = entry ? entry.pts : null;
    const gross = detail[playerId][h.holeNumber].gross;
    if (pts == null) return `<td>-</td>`;
    const isCounted = d.counted.has(playerId);
    return `<td>
      <div class="shot-count">${gross}</div>
      <div class="${isCounted ? 'circled-score' : 'pts-plain'}">${pts}</div>
    </td>`;
  }
  function playerAggCell(playerId, subset){
    const vals = subset.map(h => {
      const d = byHole[h.holeNumber];
      const entry = d.entries.find(e => e.playerId === playerId);
      return entry ? entry.pts : null;
    }).filter(v => v != null);
    return `<td class="agg-col">${vals.length ? vals.reduce((a,b)=>a+b,0) : "-"}</td>`;
  }
  function teamCell(h){
    const d = byHole[h.holeNumber];
    return `<td>${d.teamPts == null ? "-" : `<strong>${d.teamPts}</strong>`}</td>`;
  }
  function teamAggCell(subset){
    const vals = subset.map(h => byHole[h.holeNumber].teamPts).filter(v => v != null);
    return `<td class="agg-col">${vals.length ? vals.reduce((a,b)=>a+b,0) : "-"}</td>`;
  }

  const thru = data.filter(d => d.teamPts != null).length;
  const total = data.reduce((a,d) => a + (d.teamPts || 0), 0);

  const html = `
    <div class="scorecard-overlay" id="scorecardOverlay">
      <div class="scorecard-panel">
        <button class="scorecard-close" id="scorecardCloseBtn">&times;</button>
        <div class="scorecard-heading">
          <div class="course">${round.courseName}</div>
          <div class="meta">${round.roundDate || ""}${round.teeTime ? " · " + round.teeTime : ""}${round.teeBox ? " · " + round.teeBox + " tees" : ""}</div>
        </div>
        <div class="scorecard-player-name">Alliance — Fourball <span class="muted" style="font-size:.85rem;font-weight:600;">(best ${n} of ${players.length} count · small number = shots, circled = points counted)</span></div>

        <div class="scorecard-table-wrap">
        <table class="scorecard-table">
          <thead>
            <tr>
              <th class="label-col">Player</th>
              ${front.map(h=>`<th>${h.holeNumber}${scrambleHoleMark(currentBundle, h.holeNumber)}</th>`).join("")}
              <th class="agg-col">OUT</th>
              ${back.map(h=>`<th>${h.holeNumber}${scrambleHoleMark(currentBundle, h.holeNumber)}</th>`).join("")}
              <th class="agg-col">IN</th>
              <th class="agg-col">TOTAL</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="label-col">S.I.</td>
              ${front.map(h=>`<td>${h.strokeIndex}</td>`).join("")}
              <td class="agg-col">-</td>
              ${back.map(h=>`<td>${h.strokeIndex}</td>`).join("")}
              <td class="agg-col">-</td>
              <td class="agg-col">-</td>
            </tr>
            ${players.map(p => `
            <tr>
              <td class="label-col">${p.name}<div class="muted" style="font-size:.62rem;font-weight:600;">hcp ${p.playingHandicap}</div></td>
              ${front.map(h => ptsCell(p.id, h)).join("")}
              ${playerAggCell(p.id, front)}
              ${back.map(h => ptsCell(p.id, h)).join("")}
              ${playerAggCell(p.id, back)}
              ${playerAggCell(p.id, holes)}
            </tr>`).join("")}
            <tr class="gross-row">
              <td class="label-col">Fourball</td>
              ${front.map(h => teamCell(h)).join("")}
              ${teamAggCell(front)}
              ${back.map(h => teamCell(h)).join("")}
              ${teamAggCell(back)}
              ${teamAggCell(holes)}
            </tr>
          </tbody>
        </table>
        </div>

        <div class="scorecard-summary">
          <div><div class="val">${thru}/18</div><div class="lbl">Thru</div></div>
          <div><div class="val">${thru ? total : "-"}</div><div class="lbl">Alliance points</div></div>
        </div>
        ${scrambleLegend(currentBundle)}
      </div>
    </div>
  `;

  const wrapper = document.createElement("div");
  wrapper.innerHTML = html;
  document.body.appendChild(wrapper.firstElementChild);

  const overlay = document.getElementById("scorecardOverlay");
  document.getElementById("scorecardCloseBtn").onclick = closeScorecard;
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeScorecard(); });
}

function openBetterballScorecard(){
  if (!currentBundle) return;
  const { round, holes, players } = currentBundle;
  const detail = computeDetail(currentBundle);
  const teamA = players.filter(p => p.team === "A");
  const teamB = players.filter(p => p.team === "B");
  const data = computeBetterballData(currentBundle, detail);
  const byHole = {};
  data.forEach(d => byHole[d.holeNumber] = d);

  const front = holes.filter(h => h.holeNumber <= 9);
  const back = holes.filter(h => h.holeNumber > 9);

  function ptsCell(playerId, teamKey, h){
    const gross = detail[playerId][h.holeNumber].gross;
    const pts = detail[playerId][h.holeNumber].pts;
    if (pts == null) return `<td>-</td>`;
    const isCounted = byHole[h.holeNumber][teamKey].bestPlayerId === playerId;
    return `<td>
      <div class="shot-count">${gross}</div>
      <div class="${isCounted ? 'circled-score' : 'pts-plain'}">${pts}</div>
    </td>`;
  }
  function playerAggCell(playerId, subset){
    const vals = subset.map(h => detail[playerId][h.holeNumber].pts).filter(v => v != null);
    return `<td class="agg-col">${vals.length ? vals.reduce((a,b)=>a+b,0) : "-"}</td>`;
  }
  function teamCell(teamKey, h){
    const v = byHole[h.holeNumber][teamKey].best;
    return `<td>${v == null ? "-" : `<strong>${v}</strong>`}</td>`;
  }
  function teamAggCell(teamKey, subset){
    const vals = subset.map(h => byHole[h.holeNumber][teamKey].best).filter(v => v != null);
    return `<td class="agg-col">${vals.length ? vals.reduce((a,b)=>a+b,0) : "-"}</td>`;
  }
  function teamRows(teamPlayers, teamKey, teamLabel){
    return `
      ${teamPlayers.map(p => `
      <tr>
        <td class="label-col">${p.name}<div class="muted" style="font-size:.62rem;font-weight:600;">hcp ${p.playingHandicap}</div></td>
        ${front.map(h => ptsCell(p.id, teamKey, h)).join("")}
        ${playerAggCell(p.id, front)}
        ${back.map(h => ptsCell(p.id, teamKey, h)).join("")}
        ${playerAggCell(p.id, back)}
        ${playerAggCell(p.id, holes)}
      </tr>`).join("")}
      <tr class="gross-row">
        <td class="label-col">${teamLabel}</td>
        ${front.map(h => teamCell(teamKey, h)).join("")}
        ${teamAggCell(teamKey, front)}
        ${back.map(h => teamCell(teamKey, h)).join("")}
        ${teamAggCell(teamKey, back)}
        ${teamAggCell(teamKey, holes)}
      </tr>`;
  }

  const thruA = data.filter(d => d.teamA.best != null).length;
  const thruB = data.filter(d => d.teamB.best != null).length;
  const totalA = data.reduce((a,d) => a + (d.teamA.best || 0), 0);
  const totalB = data.reduce((a,d) => a + (d.teamB.best || 0), 0);

  const html = `
    <div class="scorecard-overlay" id="scorecardOverlay">
      <div class="scorecard-panel">
        <button class="scorecard-close" id="scorecardCloseBtn">&times;</button>
        <div class="scorecard-heading">
          <div class="course">${round.courseName}</div>
          <div class="meta">${round.roundDate || ""}${round.teeTime ? " · " + round.teeTime : ""}${round.teeBox ? " · " + round.teeBox + " tees" : ""}</div>
        </div>
        <div class="scorecard-player-name">Betterball Stableford <span class="muted" style="font-size:.85rem;font-weight:600;">(small number = shots, circled = the score that counted)</span></div>

        <div class="scorecard-table-wrap">
        <table class="scorecard-table">
          <thead>
            <tr>
              <th class="label-col">Player</th>
              ${front.map(h=>`<th>${h.holeNumber}${scrambleHoleMark(currentBundle, h.holeNumber)}</th>`).join("")}
              <th class="agg-col">OUT</th>
              ${back.map(h=>`<th>${h.holeNumber}${scrambleHoleMark(currentBundle, h.holeNumber)}</th>`).join("")}
              <th class="agg-col">IN</th>
              <th class="agg-col">TOTAL</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="label-col">S.I.</td>
              ${front.map(h=>`<td>${h.strokeIndex}</td>`).join("")}
              <td class="agg-col">-</td>
              ${back.map(h=>`<td>${h.strokeIndex}</td>`).join("")}
              <td class="agg-col">-</td>
              <td class="agg-col">-</td>
            </tr>
            ${teamRows(teamA, "teamA", "Team A")}
            ${teamRows(teamB, "teamB", "Team B")}
          </tbody>
        </table>
        </div>

        <div class="scorecard-summary">
          <div><div class="val">${thruA}/18</div><div class="lbl">Team A thru</div></div>
          <div><div class="val">${thruA ? totalA : "-"}</div><div class="lbl">Team A pts</div></div>
          <div><div class="val">${thruB}/18</div><div class="lbl">Team B thru</div></div>
          <div><div class="val">${thruB ? totalB : "-"}</div><div class="lbl">Team B pts</div></div>
        </div>
        ${scrambleLegend(currentBundle)}
      </div>
    </div>
  `;

  const wrapper = document.createElement("div");
  wrapper.innerHTML = html;
  document.body.appendChild(wrapper.firstElementChild);

  const overlay = document.getElementById("scorecardOverlay");
  document.getElementById("scorecardCloseBtn").onclick = closeScorecard;
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeScorecard(); });
}

document.addEventListener("click", (e) => {
  const link = e.target.closest(".player-name-link");
  if (link){ openScorecard(link.dataset.player); return; }
  const standingsLink = e.target.closest("[data-standings-link]");
  if (standingsLink){ location.hash = `#/standings/${standingsLink.dataset.standingsLink}`; return; }
  const betterballLink = e.target.closest("[data-betterball-link]");
  if (betterballLink){ openBetterballScorecard(); return; }
  const teamLink = e.target.closest(".team-scorecard-link");
  if (teamLink){ openTeamScorecard(); }
});

function updateConnIndicator(){
  const el = document.getElementById("connIndicator");
  if (!el) return;
  const online = navigator.onLine;
  el.className = "conn-indicator " + (online ? "conn-online" : "conn-offline");
  el.innerHTML = `<span class="conn-dot"></span>${online ? "Connected" : "Offline"}`;
}
window.addEventListener("online", updateConnIndicator);
window.addEventListener("offline", updateConnIndicator);

render();
</script>
