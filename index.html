/* ============================================================
   SCORING ENGINE + BOARD RENDERING (shared by scorer & spectator)
   ============================================================ */
function computeDetail(bundle){
  const { players, holes, scores } = bundle;
  const scoreMap = {};
  players.forEach(p => scoreMap[p.id] = {});
  scores.forEach(s => { if (scoreMap[s.playerId]) scoreMap[s.playerId][s.holeNumber] = s.grossStrokes; });

  const detail = {};
  players.forEach(p => {
    detail[p.id] = {};
    holes.forEach(h => {
      const gross = scoreMap[p.id][h.holeNumber];
      if (gross == null){ detail[p.id][h.holeNumber] = { gross:null, net:null, pts:null }; return; }
      const sr = strokesReceived(p.playingHandicap, h.strokeIndex);
      const net = gross - sr;
      const pts = stablefordPoints(h.par, net);
      detail[p.id][h.holeNumber] = { gross, net, pts, sr };
    });
  });
  return detail;
}

function buildBoardsHtml(bundle, opts){
  opts = opts || {};
  const { round, holes, players } = bundle;
  const detail = computeDetail(bundle);

  let html = "";
  // Stableford points are useful regardless of which mode is actually being
  // competed for, so they show by default even when Stableford wasn't itself
  // picked as a mode - except on the spectator view (opts.alwaysIncludeStableford:
  // false), which shows only the actual mode(s) being played. Never duplicated
  // when Stableford is itself the selected mode.
  const isStablefordMode = round.gameModes.includes("stableford");
  const isPiekfynMode = round.gameModes.includes("piekfyn");
  const alwaysIncludeStableford = opts.alwaysIncludeStableford !== false;
  // Piekfyn's own board (below) already has an Individual result tab covering this same
  // per-player Stableford data, so skip the standalone board here to avoid showing it twice.
  if ((isStablefordMode || alwaysIncludeStableford) && !isPiekfynMode) html += buildStablefordBoard(players, holes, detail);
  if (round.gameModes.includes("stroke")) html += buildStrokeBoard(players, holes, detail);
  if (round.gameModes.includes("matchplay")) html += buildMatchPlayBoard(players, holes, detail, startHoleFor(bundle));
  if (round.gameModes.includes("matchplay3")) html += buildMatchPlay3Board(bundle, detail);
  if (round.gameModes.includes("betterball")) html += buildBetterballBoard(bundle, detail) + buildBetterballContributionBoard(bundle, detail);
  if (round.gameModes.includes("alliance")) html += buildAllianceBoard(bundle, detail) + buildAllianceContributionBoard(bundle, detail);
  if (round.gameModes.includes("bbb")) html += buildBBBBoard(bundle, detail);
  if (isPiekfynMode) html += buildPiekfynRoundBoard(bundle);
  if (round.competitionId && !round.gameModes.includes("piekfyn") && opts.includeStandingsLink !== false){
    html += `<div class="team-scorecard-link" data-standings-link="${round.competitionId}" role="button" tabindex="0">Part of a multi-fourball competition — view overall leaderboard</div>`;
  }
  return html;
}

function totalsFor(players, holes, detail, field){
  const totals = {};
  players.forEach(p => {
    let sum = 0, count = 0;
    holes.forEach(h => {
      const v = detail[p.id][h.holeNumber][field];
      if (v != null){ sum += v; count++; }
    });
    totals[p.id] = { sum, count };
  });
  return totals;
}

function playerLink(p, roundId){
  return `<span class="player-name-link" data-player="${p.id}"${roundId ? ` data-round="${roundId}"` : ""} role="button" tabindex="0">${escapeHtml(p.name)}</span><span class="muted" style="font-size:.72rem;font-weight:400;"> (${p.playingHandicap})</span>`;
}

function buildStrokeBoard(players, holes, detail){
  const gross = totalsFor(players, holes, detail, "gross");
  const net = totalsFor(players, holes, detail, "net");
  const rows = players.map(p => ({ p, g: gross[p.id], n: net[p.id] }))
    .sort((a,b) => (a.n.count ? a.n.sum : 999) - (b.n.count ? b.n.sum : 999));

  return `
  <div class="card">
    <strong>Stroke play</strong> <span class="muted">— gross / net</span>
    <table style="margin-top:8px;">
      <tr><th class="name-col">Player</th><th>Thru</th><th>Gross</th><th>Net</th><th>Net vs par</th></tr>
      ${rows.map(r => `
        <tr>
          <td class="name-col">${playerLink(r.p)}</td>
          <td>${r.g.count}</td>
          <td>${r.g.count ? r.g.sum : "-"}</td>
          <td>${r.n.count ? r.n.sum : "-"}</td>
          <td>${r.n.count ? fmtDiff(r.n.sum - holes.slice(0,r.n.count).reduce((a,h)=>a+h.par,0)) : "-"}</td>
        </tr>`).join("")}
    </table>
  </div>`;
}

function buildStablefordBoard(players, holes, detail){
  const pts = totalsFor(players, holes, detail, "pts");
  const gross = totalsFor(players, holes, detail, "gross");
  const rows = players.map(p => ({ p, s: pts[p.id], g: gross[p.id] })).sort((a,b) => b.s.sum - a.s.sum);
  return `
  <div class="card">
    <strong>Stableford</strong> <span class="muted">— points, higher is better</span>
    <table style="margin-top:8px;">
      <tr><th class="name-col">Player</th><th>Thru</th><th>Points</th><th>Total shots</th></tr>
      ${rows.map((r,i) => `
        <tr class="${i===0 && r.s.count ? 'leader-row' : ''}">
          <td class="name-col">${playerLink(r.p)}</td>
          <td>${r.s.count}</td>
          <td>${r.s.count ? r.s.sum : "-"}</td>
          <td>${r.g.count ? r.g.sum : "-"}</td>
        </tr>`).join("")}
    </table>
  </div>`;
}

function buildMatchPlayBoard(players, holes, detail, startHole){
  const teamA = players.filter(p => p.team === "A");
  const teamB = players.filter(p => p.team === "B");
  if (teamA.length === 0 || teamB.length === 0){
    return `<div class="card"><strong>Match play</strong><p class="muted">Needs players on both Team A and Team B.</p></div>`;
  }
  const mp = computeMatch(holes, detail, teamA, teamB, inferPlayOrder(holes, detail, players, startHole));   // locks once decided
  const holesUp = mp.holesUp, holesPlayed = mp.holesPlayed;
  const remaining = mp.remaining;
  let statusText, statusClass;
  if (holesPlayed === 0){ statusText = "Not started"; statusClass = "status-all-sq"; }
  else if (remaining > 0 && Math.abs(holesUp) > remaining){
    statusText = `${Math.abs(holesUp)} & ${remaining} — Team ${holesUp>0?'A':'B'} wins`;
    statusClass = holesUp>0 ? "status-up" : "status-down";
  } else if (holesUp === 0){ statusText = "All square"; statusClass = "status-all-sq"; }
  else { statusText = `Team ${holesUp>0?'A':'B'} ${Math.abs(holesUp)} up`; statusClass = holesUp>0 ? "status-up" : "status-down"; }

  return `
  <div class="card">
    <strong>Match play</strong>
    <span class="muted">— <span class="team-a">Team A</span>: ${teamA.map(p=>playerLink(p)).join(", ")}
    vs <span class="team-b">Team B</span>: ${teamB.map(p=>playerLink(p)).join(", ")} · better-ball net</span>
    <p class="${statusClass}" style="font-size:1.1rem;margin:10px 0 0;">${statusText}</p>
    <p class="muted" style="margin:2px 0 0;">Through ${holesPlayed} hole${holesPlayed===1?"":"s"}</p>
    <table style="margin-top:8px;">
      <tr><th class="name-col">Player</th><th>Total shots</th></tr>
      ${[...teamA, ...teamB].map(p => {
        const g = totalsFor([p], holes, detail, "gross")[p.id];
        return `<tr><td class="name-col">${playerLink(p)}</td><td>${g.count ? g.sum : "-"}</td></tr>`;
      }).join("")}
    </table>
  </div>`;
}

// 3-way match play ("Three-ball"): every hole compares all three players' net
// scores at once and hands out points per hole - 2 to a sole winner, 1 each to
// a pair tied for best with the third beaten, or 1 each if all three tie.
// Unlike the 2-player match (a running holes-up/down count), this totals to a
// points table since a three-way tie has no "up/down" equivalent.
function computeMatchPlay3Points(players, holes, detail){
  const points = {};
  players.forEach(p => { points[p.id] = { sum: 0, thru: 0 }; });

  for (const h of holes){
    const nets = players.map(p => ({ p, net: detail[p.id][h.holeNumber].net }));
    if (nets.some(n => n.net == null)) continue;   // skip holes not scored yet (a round can start on any hole)

    const best = Math.min(...nets.map(n => n.net));
    const winners = nets.filter(n => n.net === best);
    // 1 outright winner -> 2 points; 2 tied for best -> 1 point each; all 3 tied -> 1 each
    const pointsForWinner = winners.length === 1 ? 2 : 1;
    winners.forEach(w => { points[w.p.id].sum += pointsForWinner; });
    players.forEach(p => { points[p.id].thru++; });
  }
  return points;
}

// Which holes a specific player won OUTRIGHT (sole lowest net, worth 2
// points) - used to mark those holes on their individual scorecard. Deliberately
// excludes ties (1-point shares), since "won" reads as beating the field
// outright, not squaring it.
function matchPlay3WonHoles(players, holes, detail, playerId){
  const won = new Set();
  for (const h of holes){
    const nets = players.map(p => ({ id: p.id, net: detail[p.id][h.holeNumber].net }));
    if (nets.some(n => n.net == null)) continue;
    const best = Math.min(...nets.map(n => n.net));
    const winners = nets.filter(n => n.net === best);
    if (winners.length === 1 && winners[0].id === playerId) won.add(h.holeNumber);
  }
  return won;
}

function buildMatchPlay3Board(bundle, detail){
  const { players, holes } = bundle;
  if (players.length !== 3){
    return `<div class="card"><strong>3-way match play</strong><p class="muted">Needs exactly 3 players.</p></div>`;
  }
  const points = computeMatchPlay3Points(players, holes, detail);
  const gross = totalsFor(players, holes, detail, "gross");
  const rows = players.map(p => ({ p, pts: points[p.id], g: gross[p.id] }))
    .sort((a,b) => b.pts.sum - a.pts.sum);

  return `
  <div class="card">
    <strong>3-way match play</strong>
    <span class="muted">— net score wins the hole: 2 pts outright, 1 pt each on a tie for best, 1 pt each if all square</span>
    <table style="margin-top:8px;">
      <tr><th class="name-col">Player</th><th>Thru</th><th>Points</th><th>Total shots</th></tr>
      ${rows.map((r,i) => `
        <tr class="${i===0 && r.pts.thru ? 'leader-row' : ''}">
          <td class="name-col">${playerLink(r.p)}</td>
          <td>${r.pts.thru}</td>
          <td>${r.pts.thru ? r.pts.sum : "-"}</td>
          <td>${r.g.count ? r.g.sum : "-"}</td>
        </tr>`).join("")}
    </table>
  </div>`;
}

function computeBetterballData(bundle, detail){
  const { players, holes } = bundle;
  const teamA = players.filter(p => p.team === "A");
  const teamB = players.filter(p => p.team === "B");
  function bestFor(teamPlayers, holeNumber){
    const entries = teamPlayers
      .map(p => ({ playerId: p.id, pts: detail[p.id][holeNumber].pts }))
      .filter(e => e.pts != null);
    if (!entries.length) return { best: null, bestPlayerId: null };
    const { sum, counted } = unambiguousTopN(entries, 1);
    return { best: sum, bestPlayerId: counted.size ? [...counted][0] : null };
  }
  return holes.map(h => ({
    holeNumber: h.holeNumber,
    teamA: bestFor(teamA, h.holeNumber),
    teamB: bestFor(teamB, h.holeNumber),
  }));
}

function buildBetterballBoard(bundle, detail){
  const { players, holes } = bundle;
  const teamA = players.filter(p => p.team === "A");
  const teamB = players.filter(p => p.team === "B");
  if (teamA.length === 0 || teamB.length === 0){
    return `<div class="card"><strong>Betterball Stableford</strong><p class="muted">Needs players on both Team A and Team B.</p></div>`;
  }
  const data = computeBetterballData(bundle, detail);
  const thruA = data.filter(d => d.teamA.best != null).length;
  const thruB = data.filter(d => d.teamB.best != null).length;
  const totalA = data.reduce((a,d) => a + (d.teamA.best || 0), 0);
  const totalB = data.reduce((a,d) => a + (d.teamB.best || 0), 0);
  const grossA = totalsFor(teamA, holes, detail, "gross");
  const grossB = totalsFor(teamB, holes, detail, "gross");
  const shotsA = teamA.reduce((a,p) => a + (grossA[p.id].count ? grossA[p.id].sum : 0), 0);
  const shotsB = teamB.reduce((a,p) => a + (grossB[p.id].count ? grossB[p.id].sum : 0), 0);

  return `
  <div class="card">
    <strong>Betterball Stableford</strong>
    <span class="muted">— <span class="team-a">Team A</span>: ${teamA.map(p=>playerLink(p)).join(", ")}
    vs <span class="team-b">Team B</span>: ${teamB.map(p=>playerLink(p)).join(", ")} · best net-Stableford score of the pair counts</span>
    <table style="margin-top:8px;">
      <tr><th class="name-col">Team</th><th>Thru</th><th>Points</th><th>Total shots</th></tr>
      <tr><td class="name-col team-a">Team A</td><td>${thruA}</td><td>${thruA ? totalA : "-"}</td><td>${shotsA || "-"}</td></tr>
      <tr><td class="name-col team-b">Team B</td><td>${thruB}</td><td>${thruB ? totalB : "-"}</td><td>${shotsB || "-"}</td></tr>
    </table>
    <div class="team-scorecard-link" data-betterball-link="1" role="button" tabindex="0">View full scorecard</div>
  </div>`;
}

// How many holes each player's score was the clear one that counted for their pair
// (only 1 of each team's 2 scores counts per hole — see unambiguousTopN for the tie rule).
function buildBetterballContributionBoard(bundle, detail){
  const { players, round } = bundle;
  const teamA = players.filter(p => p.team === "A");
  const teamB = players.filter(p => p.team === "B");
  if (teamA.length === 0 || teamB.length === 0) return "";
  const data = computeBetterballData(bundle, detail);
  const hasScrambleDrive = !!round.scrambleDrive;

  function groupFor(teamPlayers, teamKey){
    const thru = data.filter(d => d[teamKey].best != null).length;
    const rows = teamPlayers
      .map(p => ({
        p,
        contributed: data.filter(d => d[teamKey].bestPlayerId === p.id).length,
        drives: hasScrambleDrive ? (bundle.scrambleDrives || []).filter(s => s[teamKey] === p.id).length : 0
      }))
      .sort((a,b) => b.contributed - a.contributed);
    return { rows, thru };
  }
  function rowsHtml(group, teamClass){
    return group.rows.map((r,i) => `
      <tr class="${i===0 && r.contributed>0 ? 'leader-row' : ''}">
        <td class="name-col ${teamClass}">${playerLink(r.p)}</td>
        <td>${r.contributed}</td>
        ${hasScrambleDrive ? `<td>${r.drives}</td>` : ""}
        <td>${group.thru}</td>
        <td>${group.thru ? Math.round(r.contributed / group.thru * 100) + "%" : "-"}</td>
      </tr>`).join("");
  }

  const a = groupFor(teamA, "teamA");
  const b = groupFor(teamB, "teamB");
  return `
  <div class="card">
    <strong>Contribution</strong> <span class="muted">— holes each player's score was the clear one that counted for their pair${hasScrambleDrive ? ", plus whose tee shot the pair played from" : ""}</span>
    <table style="margin-top:8px;">
      <tr><th class="name-col">Player</th><th>Contributed</th>${hasScrambleDrive ? `<th>Drives</th>` : ""}<th>Thru</th><th>%</th></tr>
      ${rowsHtml(a, "team-a")}
      ${rowsHtml(b, "team-b")}
    </table>
  </div>`;
}

// Picks the best n of a set of {playerId, pts} entries, but only credits ("counts") a
// player when their place in the top n is unambiguous. A tie straddling the cutoff
// (e.g. needing 2 of 4 identical scores, or 1 of 2 tied Betterball partners) means
// several players have an equally valid claim to the same slot(s), so none of that
// tied group gets marked — only a clean cutoff (nobody tied at the boundary, or a tie
// that exactly fills what's left) counts as a clear winner. The sum itself is always
// correct regardless, since it's tie-invariant.
function unambiguousTopN(entries, n){
  const sorted = [...entries].sort((a,b) => b.pts - a.pts);
  const sum = sorted.slice(0, n).reduce((a,e) => a + e.pts, 0);
  const counted = new Set();
  const cutoff = sorted[n - 1].pts;
  const aboveCutoff = sorted.filter(e => e.pts > cutoff);
  const atCutoff = sorted.filter(e => e.pts === cutoff);
  const neededFromCutoff = n - aboveCutoff.length;
  aboveCutoff.forEach(e => counted.add(e.playerId));
  if (atCutoff.length === neededFromCutoff){
    atCutoff.forEach(e => counted.add(e.playerId));
  }
  return { sum, counted };
}

function computeAllianceData(bundle, detail){
  const { players, holes, round } = bundle;
  const n = Math.max(1, Math.min(round.allianceCount || 2, players.length));
  return holes.map(h => {
    const entries = players.map(p => ({ playerId: p.id, pts: detail[p.id][h.holeNumber].pts }));
    const allEntered = entries.every(e => e.pts != null);
    let counted = new Set(), teamPts = null;
    if (allEntered){
      const r = unambiguousTopN(entries, n);
      teamPts = r.sum;
      counted = r.counted;
    }
    return { holeNumber: h.holeNumber, entries, counted, teamPts };
  });
}

function buildAllianceBoard(bundle, detail){
  const { players, round } = bundle;
  const n = Math.max(1, Math.min(round.allianceCount || 2, players.length));
  const data = computeAllianceData(bundle, detail);
  const thru = data.filter(d => d.teamPts != null).length;
  const total = data.reduce((a,d) => a + (d.teamPts || 0), 0);
  return `
  <div class="card">
    <strong>Alliance</strong> <span class="muted">— best ${n} of ${players.length} net-stableford scores per hole</span>
    <p style="font-size:1.1rem;margin:10px 0 4px;">${thru ? total + " points" : "Not started"} <span class="muted" style="font-size:.85rem;">(thru ${thru})</span></p>
    <div class="team-scorecard-link" role="button" tabindex="0">Fourball: ${players.map(p=>escapeHtml(p.name)).join(", ")} — view full scorecard</div>
  </div>`;
}

// How many holes each player's score was unambiguously counted toward the team total
// (see computeAllianceData's tie handling — a score only counts here when there was a
// clear winner for that slot, not an arbitrary pick among tied players).
function buildAllianceContributionBoard(bundle, detail){
  const { players, round } = bundle;
  const n = Math.max(1, Math.min(round.allianceCount || 2, players.length));
  const data = computeAllianceData(bundle, detail);
  const thru = data.filter(d => d.teamPts != null).length;
  const hasScrambleDrive = !!round.scrambleDrive;
  const rows = players
    .map(p => ({
      p,
      contributed: data.filter(d => d.counted.has(p.id)).length,
      drives: hasScrambleDrive ? (bundle.scrambleDrives || []).filter(s => s.playerId === p.id).length : 0
    }))
    .sort((a,b) => b.contributed - a.contributed);
  return `
  <div class="card">
    <strong>Contribution</strong> <span class="muted">— holes each player's score clearly counted toward the team total (best ${n} of ${players.length})${hasScrambleDrive ? ", plus whose tee shot the team played from" : ""}</span>
    <table style="margin-top:8px;">
      <tr><th class="name-col">Player</th><th>Contributed</th>${hasScrambleDrive ? `<th>Drives</th>` : ""}<th>Thru</th><th>%</th></tr>
      ${rows.map((r,i) => `
        <tr class="${i===0 && r.contributed>0 ? 'leader-row' : ''}">
          <td class="name-col">${playerLink(r.p)}</td>
          <td>${r.contributed}</td>
          ${hasScrambleDrive ? `<td>${r.drives}</td>` : ""}
          <td>${thru}</td>
          <td>${thru ? Math.round(r.contributed / thru * 100) + "%" : "-"}</td>
        </tr>`).join("")}
    </table>
    ${thru === 0 ? `<p class="muted" style="margin-top:6px;">No holes finished yet.</p>` : ""}
  </div>`;
}

function buildBBBBoard(bundle, detail){
  const { players, bbb, holes } = bundle;
  const totals = {};
  players.forEach(p => totals[p.id] = { bingo: 0, bango: 0, bongo: 0 });
  let holesRecorded = 0;
  (bbb || []).forEach(rec => {
    let any = false;
    BBB_CATEGORIES.forEach(cat => {
      if (rec[cat.key] && totals[rec[cat.key]]){ totals[rec[cat.key]][cat.key]++; any = true; }
    });
    if (any) holesRecorded++;
  });
  const gross = totalsFor(players, holes, detail, "gross");
  const rows = players.map(p => {
    const t = totals[p.id];
    return { p, total: t.bingo + t.bango + t.bongo, t, g: gross[p.id] };
  }).sort((a,b) => b.total - a.total);

  return `
  <div class="card">
    <strong>Bingo Bango Bongo</strong> <span class="muted">— 1 point each for first on green, closest once all on, first to hole out</span>
    <table style="margin-top:8px;">
      <tr><th class="name-col">Player</th><th>Bingo</th><th>Bango</th><th>Bongo</th><th>Total</th><th>Total shots</th></tr>
      ${rows.map((r,i) => `
        <tr class="${i===0 && r.total>0 ? 'leader-row' : ''}">
          <td class="name-col">${playerLink(r.p)}</td>
          <td>${r.t.bingo}</td>
          <td>${r.t.bango}</td>
          <td>${r.t.bongo}</td>
          <td><strong>${r.total}</strong></td>
          <td>${r.g.count ? r.g.sum : "-"}</td>
        </tr>`).join("")}
    </table>
    <p class="muted" style="font-size:.75rem;margin-top:6px;">${holesRecorded} hole${holesRecorded===1?"":"s"} recorded</p>
  </div>`;
}

/* ============================================================
   MULTI-FOURBALL COMPETITION BOARDS (non-Piekfyn modes)
   Piekfyn already links fourballs together via computePiekfynPoints/buildPiekfynCompetitionBoard,
   below. These give the other modes the same ability: several fourballs sharing one
   competition, with a leaderboard that makes sense for that mode.
   ============================================================ */
function buildCombinedIndividualBoard(bundles, field, opts){
  // "Net vs par" only makes sense for the Stroke play board — Stableford already shows
  // performance relative to par via its points (2 = par), so it has no separate column here,
  // matching how the single-fourball Stroke play board already works.
  const showVsPar = field === "net";
  const rows = [];
  bundles.forEach(bundle => {
    const detail = computeDetail(bundle);
    const gross = totalsFor(bundle.players, bundle.holes, detail, "gross");
    bundle.players.forEach(p => {
      const t = totalsFor([p], bundle.holes, detail, field)[p.id];
      const parThru = bundle.holes.slice(0, t.count).reduce((a,h)=>a+h.par,0);
      rows.push({ p, roundId: bundle.round.id, fourballLabel: `Fourball ${bundle.round.fourballIndex || "?"}`, count: t.count, sum: t.sum, gross: gross[p.id], vsPar: t.count ? fmtDiff(t.sum - parThru) : null });
    });
  });
  rows.sort((a,b) => {
    if (!a.count && !b.count) return 0;
    if (!a.count) return 1;
    if (!b.count) return -1;
    return opts.sortAsc ? (a.sum - b.sum) : (b.sum - a.sum);
  });
  return `
  <div class="card">
    <strong>${opts.title}</strong> <span class="muted">— combined leaderboard, all fourballs</span>
    <table style="margin-top:8px;">
      <tr><th class="name-col">Player</th><th>Fourball</th><th>Thru</th><th>${opts.unitLabel}</th>${showVsPar ? "<th>Net vs par</th>" : ""}<th>Total shots</th></tr>
      ${rows.map((r,i) => `
        <tr class="${i===0 && r.count ? 'leader-row' : ''}">
          <td class="name-col">${playerLink(r.p, r.roundId)}</td>
          <td class="muted">${r.fourballLabel}</td>
          <td>${r.count}</td>
          <td>${r.count ? r.sum : "-"}</td>
          ${showVsPar ? `<td>${r.vsPar != null ? r.vsPar : "-"}</td>` : ""}
          <td>${r.gross.count ? r.gross.sum : "-"}</td>
        </tr>`).join("")}
    </table>
  </div>`;
}

function buildCombinedBBBBoard(bundles){
  const rows = [];
  bundles.forEach(bundle => {
    const detail = computeDetail(bundle);
    const totals = {};
    bundle.players.forEach(p => totals[p.id] = { bingo: 0, bango: 0, bongo: 0 });
    (bundle.bbb || []).forEach(rec => {
      BBB_CATEGORIES.forEach(cat => { if (rec[cat.key] && totals[rec[cat.key]]) totals[rec[cat.key]][cat.key]++; });
    });
    const gross = totalsFor(bundle.players, bundle.holes, detail, "gross");
    bundle.players.forEach(p => {
      const t = totals[p.id];
      rows.push({ p, roundId: bundle.round.id, fourballLabel: `Fourball ${bundle.round.fourballIndex || "?"}`, total: t.bingo + t.bango + t.bongo, t, gross: gross[p.id] });
    });
  });
  rows.sort((a,b) => b.total - a.total);
  return `
  <div class="card">
    <strong>Bingo Bango Bongo</strong> <span class="muted">— combined leaderboard, all fourballs</span>
    <table style="margin-top:8px;">
      <tr><th class="name-col">Player</th><th>Fourball</th><th>Bingo</th><th>Bango</th><th>Bongo</th><th>Total</th><th>Total shots</th></tr>
      ${rows.map((r,i) => `
        <tr class="${i===0 && r.total>0 ? 'leader-row' : ''}">
          <td class="name-col">${playerLink(r.p, r.roundId)}</td>
          <td class="muted">${r.fourballLabel}</td>
          <td>${r.t.bingo}</td>
          <td>${r.t.bango}</td>
          <td>${r.t.bongo}</td>
          <td><strong>${r.total}</strong></td>
          <td>${r.gross.count ? r.gross.sum : "-"}</td>
        </tr>`).join("")}
    </table>
  </div>`;
}

function buildCombinedAllianceBoard(bundles){
  const rows = bundles.map(bundle => {
    const detail = computeDetail(bundle);
    const data = computeAllianceData(bundle, detail);
    const thru = data.filter(d => d.teamPts != null).length;
    const total = data.reduce((a,d) => a + (d.teamPts || 0), 0);
    return { bundle, thru, total };
  }).sort((a,b) => b.total - a.total);

  return `
  <div class="card">
    <strong>Alliance</strong> <span class="muted">— fourballs ranked against each other</span>
    <table style="margin-top:8px;">
      <tr><th class="name-col">Fourball</th><th>Players</th><th>Thru</th><th>Points</th></tr>
      ${rows.map((r,i) => `
        <tr class="${i===0 && r.total>0 ? 'leader-row' : ''}">
          <td class="name-col">Fourball ${r.bundle.round.fourballIndex || "?"}</td>
          <td class="muted" style="text-align:left;">${r.bundle.players.map(p=>escapeHtml(p.name)).join(", ")}</td>
          <td>${r.thru}</td>
          <td>${r.thru ? r.total : "-"}</td>
        </tr>`).join("")}
    </table>
  </div>`;
}

// Match play and Betterball are inherently one fourball vs itself (2v2), so there's no
// single combined score across fourballs the way Stroke/Stableford/Alliance/BBB have —
// each fourball just gets its own board, one after another.
function buildPerFourballBoards(bundles, builderFn){
  return bundles.map(bundle => `
    <p class="muted" style="margin:14px 0 4px;font-weight:700;color:var(--ink);">Fourball ${bundle.round.fourballIndex || "?"} <span style="font-weight:400;color:var(--muted);">— ${bundle.players.map(p=>escapeHtml(p.name)).join(", ")}</span></p>
    ${builderFn(bundle)}`).join("");
}

function buildFourballLinksHtml(bundles){
  return `
  <h2>Fourball scoring links</h2>
  ${bundles.map(bundle => {
    const scoreUrl = location.origin + location.pathname + `#/play/${bundle.round.id}`;
    return `
    <div class="card">
      <strong>Fourball ${bundle.round.fourballIndex || "?"}</strong>
      <p class="muted" style="margin:4px 0 8px;">${bundle.players.map(p=>escapeHtml(p.name)).join(", ")}</p>
      <div class="link-box">
        <span class="muted">Scoring link:</span>
        <input type="text" readonly value="${scoreUrl}" onclick="this.select()">
        <button class="ghost copy-link-btn" data-url="${scoreUrl}">Copy</button>
      </div>
    </div>`;
  }).join("")}`;
}

function competitionModeLabel(mode){
  return (GAME_MODES.find(g => g.key === mode) || {}).label || mode;
}

function buildCompetitionBody(comp, mode, bundles){
  // Stableford points are useful regardless of which mode the competition is
  // actually being decided by, so a combined Stableford leaderboard always
  // shows first - never duplicated if Stableford is itself the primary mode.
  const stablefordHtml = (bundles.length && mode !== "stableford")
    ? buildCombinedIndividualBoard(bundles, "pts", {title:"Stableford", unitLabel:"Points", sortAsc:false})
    : "";

  if (mode === "piekfyn"){
    return bundles.length ? buildPiekfynCompetitionBoard(comp, bundles) : `<p class="muted">No fourballs found for this competition.</p>`;
  }
  if (bundles.length === 0) return `<p class="muted">No fourballs found for this competition.</p>`;
  if (mode === "stroke") return stablefordHtml + buildCombinedIndividualBoard(bundles, "net", {title:"Stroke play", unitLabel:"Net", sortAsc:true});
  if (mode === "stableford") return buildCombinedIndividualBoard(bundles, "pts", {title:"Stableford", unitLabel:"Points", sortAsc:false});
  if (mode === "bbb") return stablefordHtml + buildCombinedBBBBoard(bundles);
  if (mode === "alliance") return stablefordHtml + buildCombinedAllianceBoard(bundles);
  if (mode === "matchplay") return stablefordHtml + buildPerFourballBoards(bundles, bundle => buildMatchPlayBoard(bundle.players, bundle.holes, computeDetail(bundle), startHoleFor(bundle)));
  if (mode === "matchplay3") return stablefordHtml + buildPerFourballBoards(bundles, bundle => buildMatchPlay3Board(bundle, computeDetail(bundle)));
  if (mode === "betterball") return stablefordHtml + buildPerFourballBoards(bundles, bundle => buildBetterballBoard(bundle, computeDetail(bundle)));
  return stablefordHtml + `<p class="muted">Unsupported game mode for a competition.</p>`;
}

/* ---------- Piekfyn Kompetisie: 2 singles matches + 1 team match, 1pt win / 0.5pt halve ---------- */
// `order` is the sequence of hole numbers in the order they were played (a round can start on any
// hole). Once the match can't be caught (e.g. 4 up with 3 to play = "4 & 3") the result is locked:
// holes scored after that are ignored, so a closed-out match can't change or reopen.
// `steps` holds the running count after each hole that counted, for the match scorecard.
function computeMatch(holes, detail, sideAPlayers, sideBPlayers, order){
  const byNum = {}; holes.forEach(h => byNum[h.holeNumber] = h);
  const seq = (order || holes.map(h => h.holeNumber)).map(n => byNum[n]).filter(Boolean);
  let holesUp = 0, holesPlayed = 0, decided = false, winner = null;
  const steps = {};
  for (const h of seq){
    const aNets = sideAPlayers.map(p => detail[p.id][h.holeNumber].net).filter(v => v != null);
    const bNets = sideBPlayers.map(p => detail[p.id][h.holeNumber].net).filter(v => v != null);
    if (aNets.length < sideAPlayers.length || bNets.length < sideBPlayers.length) continue;   // not scored yet
    const aBest = Math.min(...aNets), bBest = Math.min(...bNets);
    holesPlayed++;
    if (aBest < bBest) holesUp++;
    else if (bBest < aBest) holesUp--;
    steps[h.holeNumber] = { running: holesUp, aBest, bBest };
    const left = 18 - holesPlayed;
    if (Math.abs(holesUp) > left){
      decided = true; winner = holesUp > 0 ? "A" : "B";
      break;
    }
    if (holesPlayed === 18){
      decided = true; winner = holesUp === 0 ? null : (holesUp > 0 ? "A" : "B");
    }
  }
  return { holesUp, holesPlayed, decided, winner, remaining: 18 - holesPlayed, steps };
}

function formatMatchStatus(m, nameA, nameB){
  // Every call site renders this return value straight into innerHTML (including on
  // unauthenticated spectator pages), so escape the names here once rather than relying on
  // every caller to remember.
  nameA = escapeHtml(nameA);
  nameB = escapeHtml(nameB);
  if (m.holesPlayed === 0) return "Not started";
  if (m.decided){
    if (m.winner === null) return "Halved";
    const name = m.winner === "A" ? nameA : nameB;
    return (m.remaining > 0 && Math.abs(m.holesUp) > m.remaining)
      ? `${name} ${Math.abs(m.holesUp)} & ${m.remaining}`
      : `${name} ${Math.abs(m.holesUp)} up`;
  }
  if (m.holesUp === 0) return `All square thru ${m.holesPlayed}`;
  const name = m.holesUp > 0 ? nameA : nameB;
  return `${name} ${Math.abs(m.holesUp)} up thru ${m.holesPlayed}`;
}

function computePiekfynPoints(bundle, detail){
  const { round, holes, players } = bundle;
  const pairs = round.piekfynPairs || [];
  const byOrder = {};
  players.forEach(p => byOrder[p.sortOrder] = p);

  const playOrder = inferPlayOrder(holes, detail, players, startHoleFor(bundle));
  const matches = pairs.map(pair => {
    const pA = byOrder[pair.a], pB = byOrder[pair.b];
    if (!pA || !pB) return null;
    return { pA, pB, m: computeMatch(holes, detail, [pA], [pB], playOrder) };
  }).filter(Boolean);

  const teamAPlayers = players.filter(p => p.team === "A");
  const teamBPlayers = players.filter(p => p.team === "B");
  const teamMatch = computeMatch(holes, detail, teamAPlayers, teamBPlayers, playOrder);

  let teamAPts = 0, teamBPts = 0;
  function tally(m){
    if (!m.decided) return;
    if (m.winner === "A") teamAPts += 1;
    else if (m.winner === "B") teamBPts += 1;
    else { teamAPts += 0.5; teamBPts += 0.5; }
  }
  matches.forEach(({m}) => tally(m));
  tally(teamMatch);

  const decidedCount = matches.filter(({m}) => m.decided).length + (teamMatch.decided ? 1 : 0);

  // "If play stopped now": decided matches as above, plus every match in progress counted for
  // whoever is up (halves for all square). Decided points alone sit at 0-0 until a match is
  // mathematically over, which tells nobody what's happening live.
  let liveA = teamAPts, liveB = teamBPts, inProgress = 0;
  [...matches.map(x => x.m), teamMatch].forEach(m => {
    if (m.decided || m.holesPlayed === 0) return;
    inProgress++;
    if (m.holesUp > 0) liveA += 1;
    else if (m.holesUp < 0) liveB += 1;
    else { liveA += 0.5; liveB += 0.5; }
  });
  return { matches, teamMatch, teamAPts, teamBPts, decidedCount, liveA, liveB, inProgress };
}

// Curated so every swatch stays legible — dark/saturated ones get white text, "White" (the
// original jersey pairing's other half) is flagged light so it gets dark red text + a border
// instead, both here and on its own swatch button (invisible otherwise on a white card).
const TEAM_COLOR_SWATCHES = [
  { key: "red", label: "Red", hex: "#7a0f0f" },
  { key: "white", label: "White", hex: "#ffffff", light: true },
  { key: "navy", label: "Navy", hex: "#1c3f66" },
  { key: "gold", label: "Gold", hex: "#a9841c" },
  { key: "green", label: "Green", hex: "#1f6b3a" },
  { key: "purple", label: "Purple", hex: "#5b2a86" },
  { key: "black", label: "Black", hex: "#202020" },
  { key: "orange", label: "Orange", hex: "#b05a12" },
  { key: "teal", label: "Teal", hex: "#146b6b" },
];
function teamColorSwatch(key){
  return TEAM_COLOR_SWATCHES.find(c => c.key === key) || TEAM_COLOR_SWATCHES[0];
}
function teamColorHex(key){
  return teamColorSwatch(key).hex;
}
// For text drawn directly on the card background (not inside a colored chip/pill) - a light
// color like white would be invisible as text color there, so fall back to the dark-red accent.
function teamColorTextColor(key){
  const c = teamColorSwatch(key);
  return c.light ? "var(--brand-dark)" : c.hex;
}
// One combined row of color swatches for Team A and Team B, plus a live preview of each
// team's chip underneath — shows the actual colors (not names) and sets a hidden input per
// team, wired by the global .pf-swatch click handler below.
function buildTeamColorSwatchPicker(aInputId, bInputId, selectedA, selectedB, aNameId, bNameId, styleRadioName, aNameVal, bNameVal){
  const swatchBtn = (c, inputId, selected) => `<button type="button" class="pf-swatch${c.key===selected?" selected":""}" data-color="${c.key}" data-for="${inputId}" style="background:${c.hex};" title="${c.label}" aria-label="${c.label}"></button>`;
  return `
    <label>Team colors</label>
    <div class="pf-color-picker-row">
      <div class="pf-color-group">
        <span class="pf-color-group-label">A</span>
        <div class="pf-swatches">${TEAM_COLOR_SWATCHES.map(c => swatchBtn(c, aInputId, selectedA)).join("")}</div>
      </div>
      <div class="pf-color-group">
        <span class="pf-color-group-label">B</span>
        <div class="pf-swatches">${TEAM_COLOR_SWATCHES.map(c => swatchBtn(c, bInputId, selectedB)).join("")}</div>
      </div>
    </div>
    <input type="hidden" id="${aInputId}" value="${selectedA}" data-preview-name="${aNameId}" data-preview-style-radio="${styleRadioName}" data-pair-with="${bInputId}" data-role="a">
    <input type="hidden" id="${bInputId}" value="${selectedB}" data-preview-name="${bNameId}" data-preview-style-radio="${styleRadioName}" data-pair-with="${aInputId}" data-role="b">
    <div class="pf-hero-chips" style="margin-top:10px;max-width:360px;">
      <div class="pf-chip" id="${aInputId}_preview" style="${teamChipStyle(selectedA, false)}"><div class="pf-chip-name">${escapeHtml(aNameVal) || "Team A"}</div></div>
      <div class="pf-vs">&ndash;</div>
      <div class="pf-chip" id="${bInputId}_preview" style="${teamChipStyle(selectedB, false)}"><div class="pf-chip-name">${escapeHtml(bNameVal) || "Team B"}</div></div>
    </div>`;
}
// Keeps a swatch picker's two preview chips in sync with the name fields, the chosen colors
// and the Jersey fade/Plain radio — called on load and whenever any of those change.
function syncTeamColorPreview(aInputId, bInputId){
  const aColorEl = document.getElementById(aInputId), bColorEl = document.getElementById(bInputId);
  const aPreview = document.getElementById(`${aInputId}_preview`), bPreview = document.getElementById(`${bInputId}_preview`);
  if (!aColorEl || !bColorEl || !aPreview || !bPreview) return;
  const aNameEl = document.getElementById(aColorEl.dataset.previewName);
  const bNameEl = document.getElementById(bColorEl.dataset.previewName);
  const flat = (document.querySelector(`input[name="${aColorEl.dataset.previewStyleRadio}"]:checked`) || {}).value === "flat";
  aPreview.setAttribute("style", teamChipStyle(aColorEl.value, flat));
  aPreview.querySelector(".pf-chip-name").textContent = (aNameEl && aNameEl.value.trim()) || "Team A";
  bPreview.setAttribute("style", teamChipStyle(bColorEl.value, flat));
  bPreview.querySelector(".pf-chip-name").textContent = (bNameEl && bNameEl.value.trim()) || "Team B";
}
function wireTeamColorPreview(aInputId, bInputId){
  const sync = () => syncTeamColorPreview(aInputId, bInputId);
  const aColorEl = document.getElementById(aInputId);
  if (!aColorEl) return;
  [aColorEl.dataset.previewName, document.getElementById(bInputId).dataset.previewName].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("input", sync);
  });
  document.querySelectorAll(`input[name="${aColorEl.dataset.previewStyleRadio}"]`).forEach(r => r.addEventListener("change", sync));
  sync();
}
// Jersey-fade: the chosen color at top fading to white, with the chevron texture. Flat: solid fill.
function teamChipStyle(colorKey, flat){
  const c = teamColorSwatch(colorKey);
  const textColor = c.light ? "var(--brand-dark)" : "#fff";
  const border = c.light ? "border:2px solid var(--brand-dark);" : "";
  const chevron = c.light ? "rgba(122,15,15,.08)" : "rgba(255,255,255,.08)";
  const fadeTo = c.light ? "var(--brand-dark)" : "#fff";
  return (flat
    ? `background:${c.hex};`
    : `background:repeating-linear-gradient(135deg, ${chevron} 0 2px, transparent 2px 9px), linear-gradient(180deg, ${c.hex} 0%, ${c.hex} 45%, ${fadeTo} 115%);`
  ) + `color:${textColor};${border}`;
}
function teamBarSegStyle(colorKey, flat){
  const c = teamColorSwatch(colorKey);
  const border = c.light ? "border:1px solid var(--brand-dark);box-sizing:border-box;" : "";
  const chevron = c.light ? "rgba(122,15,15,.15)" : "rgba(255,255,255,.2)";
  return (flat
    ? `background:${c.hex};`
    : `background:repeating-linear-gradient(135deg, ${chevron} 0 1.5px, transparent 1.5px 6px), linear-gradient(90deg, ${c.hex}, ${c.hex});`
  ) + border;
}
// Solid fill in the chosen team color, for pills/tags/point numbers — "all square"/"halved"
// status stays the neutral gold from its own CSS class, not team-colored.
function teamSolidStyle(colorKey){
  const c = teamColorSwatch(colorKey);
  const textColor = c.light ? "var(--brand-dark)" : "#fff";
  const border = c.light ? "border:1.5px solid var(--brand-dark);" : "";
  return `background:${c.hex};color:${textColor};${border}`;
}

function piekfynStatusClass(m){
  if (m.decided) return m.winner === null ? "status-all-sq" : (m.winner === "A" ? "status-up" : "status-down");
  if (m.holesPlayed === 0) return "status-all-sq";
  return m.holesUp === 0 ? "status-all-sq" : (m.holesUp > 0 ? "status-up" : "status-down");
}

// Same Ryder Cup-style scoreboard as a multi-fourball competition (buildPiekfynCompetitionBoard
// below), reused for a single standalone Piekfyn round by treating it as a one-fourball
// "competition" — the round itself already carries teamAName/teamBName, so it stands in for
// the comp argument directly.
function buildPiekfynRoundBoard(bundle){
  const linkHtml = bundle.round.competitionId
    ? `<div class="team-scorecard-link" data-standings-link="${bundle.round.competitionId}" role="button" tabindex="0">Part of a multi-fourball competition — view overall standings</div>`
    : "";
  return linkHtml + buildPiekfynCompetitionBoard(bundle.round, [bundle]);
}

// Which Piekfyn tab is open on the competition/standings scoreboard — module-level so it
// survives the re-renders every live score update triggers (renderBody() regenerates the
// whole innerHTML each time; without this the tab would snap back to "Fourballs" on every
// score entered). null = all tabs collapsed (clicking the open tab again closes it).
let piekfynActiveTab = "fourballs";
function wirePiekfynTabs(){
  const panelByTab = { fourballs: "pfTabFourballs", individual: "pfTabIndividual", team: "pfTabTeam" };
  document.querySelectorAll(".pf-tab-btn").forEach(btn => {
    btn.onclick = () => {
      const alreadyActive = btn.classList.contains("active");
      piekfynActiveTab = alreadyActive ? null : btn.dataset.pftab;
      document.querySelectorAll(".pf-tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".pf-tab-panel").forEach(p => p.classList.remove("active"));
      if (piekfynActiveTab){
        btn.classList.add("active");
        document.getElementById(panelByTab[piekfynActiveTab]).classList.add("active");
      }
    };
  });
}

// Ryder Cup-style scoreboard for a Piekfyn Kompetisie competition: overall team score +
// progress bar, then three tabs — the per-fourball match list (existing data), an individual
// Stableford leaderboard across every fourball, and a "best team" board ranking each
// fourball's own same-team pair (not the overall Team A/B split) by better-ball Stableford (the better of the two scores on each hole).
function buildPiekfynCompetitionBoard(comp, bundles){
  const teamAName = comp.teamAName || "Team A";
  const teamBName = comp.teamBName || "Team B";
  const isFlat = comp.teamColorStyle === "flat";
  const teamAColor = comp.teamAColor || "red";
  const teamBColor = comp.teamBColor || "navy";
  const isMulti = bundles.length > 1; // single standalone round: the Fourball column has nothing to say

  let teamATotal = 0, teamBTotal = 0, decidedCount = 0;
  const fourballCards = bundles.map((bundle, idx) => {
    const detail = computeDetail(bundle);
    const pts = computePiekfynPoints(bundle, detail);
    // Running points: a match counts for whoever is up in it right now (halved if all square), so
    // the headline moves hole by hole instead of sitting at 0-0 until a match is mathematically over.
    teamATotal += pts.liveA;
    teamBTotal += pts.liveB;
    decidedCount += pts.decidedCount;

    const matchRows = [
      ...pts.matches.map(({pA,pB,m}, i) => ({ key: String(i), label: `${escapeHtml(pA.name)} vs ${escapeHtml(pB.name)}`, text: formatMatchStatus(m, pA.name, pB.name), cls: piekfynStatusClass(m) })),
      { key: "team", label: `${escapeHtml(teamAName)} vs ${escapeHtml(teamBName)} (fourball)`, text: formatMatchStatus(pts.teamMatch, teamAName, teamBName), cls: piekfynStatusClass(pts.teamMatch) },
    ];

    return `
      <div class="card pf-fb-card">
        <div class="row" style="justify-content:space-between;align-items:baseline;">
          <strong style="font-size:.92rem;">Fourball ${bundle.round.fourballIndex || idx+1}</strong>
          <span class="muted" style="font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;">${pts.decidedCount === 3 ? "Final" : (pts.teamMatch.holesPlayed === 0 && !pts.inProgress ? "Not started" : "In progress")}</span>
        </div>
        <div class="muted" style="font-size:.78rem;margin:2px 0 6px;">${bundle.players.filter(p=>p.team==="A").map(p=>escapeHtml(p.name)).join(" & ")} &nbsp;vs&nbsp; ${bundle.players.filter(p=>p.team==="B").map(p=>escapeHtml(p.name)).join(" & ")}</div>
        ${matchRows.map(r => `
          <div class="pf-match-row" data-match="${r.key}" data-round="${bundle.round.id}" role="button" tabindex="0">
            <span style="font-size:.84rem;">${r.label}</span>
            <span class="row" style="gap:2px;flex-wrap:nowrap;"><span class="pf-pill ${r.cls}" style="${r.cls === "status-up" ? teamSolidStyle(teamAColor) : r.cls === "status-down" ? teamSolidStyle(teamBColor) : ""}">${r.text}</span><span class="pf-chev">&rsaquo;</span></span>
          </div>`).join("")}
        <div class="row" style="justify-content:center;align-items:baseline;gap:7px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);">
          <strong style="color:${teamColorTextColor(teamAColor)};font-size:.92rem;">${pts.liveA}</strong>
          <span class="muted" style="font-size:.7rem;">points</span>
          <strong style="color:${teamColorTextColor(teamBColor)};font-size:.92rem;">${pts.liveB}</strong>
        </div>
      </div>`;
  }).join("");

  const totalMatches = bundles.length * 3;
  const barA = totalMatches ? Math.round((teamATotal / totalMatches) * 100) : 0;
  const barB = totalMatches ? Math.round((teamBTotal / totalMatches) * 100) : 0;
  const barUndecided = Math.max(0, 100 - barA - barB);

  const indivRows = [];
  bundles.forEach(bundle => {
    const detail = computeDetail(bundle);
    const pts = totalsFor(bundle.players, bundle.holes, detail, "pts");
    bundle.players.forEach(p => {
      indivRows.push({ p, team: p.team, fourballIndex: bundle.round.fourballIndex, roundId: bundle.round.id, count: pts[p.id].count, sum: pts[p.id].sum });
    });
  });
  indivRows.sort((a,b) => (!a.count && !b.count) ? 0 : (!a.count ? 1 : (!b.count ? -1 : b.sum - a.sum)));

  const pairRows = [];
  bundles.forEach(bundle => {
    const detail = computeDetail(bundle);
    ["A","B"].forEach(team => {
      const teamPlayers = bundle.players.filter(p => p.team === team);
      if (!teamPlayers.length) return;
      // Best team = better-ball Stableford: on each hole the pair's score is the better of the two
      // players' Stableford points; those are added up over the holes played.
      let count = 0, sum = 0;
      bundle.holes.forEach(h => {
        const holePts = teamPlayers.map(p => detail[p.id][h.holeNumber].pts).filter(v => v != null);
        if (!holePts.length) return;
        count++;
        sum += Math.max(...holePts);
      });
      pairRows.push({
        fourballIndex: bundle.round.fourballIndex,
        roundId: bundle.round.id,
        team,
        label: teamPlayers.map(p=>escapeHtml(p.name)).join(" & "),
        count,
        sum,
      });
    });
  });
  pairRows.sort((a,b) => (!a.count && !b.count) ? 0 : (!a.count ? 1 : (!b.count ? -1 : b.sum - a.sum)));

  const isTab = t => piekfynActiveTab === t ? " active" : "";

  // Small LIVE tag while any fourball is being scored; FINAL once every fourball is finished.
  const allFinished = bundles.length > 0 && bundles.every(b => b.round.status === "finished");
  const anyScored = bundles.some(b => b.round.status !== "finished" && b.scores.length > 0);
  const liveBadge = allFinished
    ? `<div class="pf-live-wrap"><span class="pf-live pf-final">FINAL</span></div>`
    : (anyScored ? `<div class="pf-live-wrap"><span class="pf-live"><span class="pf-live-dot"></span>LIVE</span></div>` : "");

  return `
  <div class="card" style="padding:14px 16px 16px;">
    ${liveBadge}
    <div class="pf-hero-chips">
      <div class="pf-chip" style="${teamChipStyle(teamAColor, isFlat)}">
        <div class="pf-chip-name">${escapeHtml(teamAName)}</div>
        <div class="pf-chip-num">${teamATotal}</div>
      </div>
      <div class="pf-vs">&ndash;</div>
      <div class="pf-chip" style="${teamChipStyle(teamBColor, isFlat)}">
        <div class="pf-chip-name">${escapeHtml(teamBName)}</div>
        <div class="pf-chip-num">${teamBTotal}</div>
      </div>
    </div>
    <div class="pf-bar-track">
      <div class="pf-bar-seg-a" style="width:${barA}%;${teamBarSegStyle(teamAColor, isFlat)}"></div>
      <div style="width:${barUndecided}%;"></div>
      <div class="pf-bar-seg-b" style="width:${barB}%;${teamBarSegStyle(teamBColor, isFlat)}"></div>
    </div>
    <div class="row" style="font-size:.72rem;margin-top:6px;">
      <span class="muted">${decidedCount} of ${totalMatches} matches decided</span>
    </div>
  </div>

  <div class="pf-tab-bar">
    <button class="pf-tab-btn${isTab("fourballs")}" data-pftab="fourballs" type="button">Fourballs</button>
    <button class="pf-tab-btn${isTab("individual")}" data-pftab="individual" type="button">Individual result</button>
    <button class="pf-tab-btn${isTab("team")}" data-pftab="team" type="button">Best team</button>
  </div>

  <div id="pfTabFourballs" class="pf-tab-panel${isTab("fourballs")}">
    <div class="pf-fb-grid">${fourballCards}</div>
  </div>

  <div id="pfTabIndividual" class="pf-tab-panel${isTab("individual")}">
    <div class="card">
      <table>
        <tr><th class="name-col">Player</th><th>Team</th>${isMulti ? "<th>Fourball</th>" : ""}<th>Thru</th><th>Points</th></tr>
        ${indivRows.map((r,i) => `
          <tr class="${i===0 && r.count ? 'leader-row' : ''}">
            <td class="name-col">${playerLink(r.p, r.roundId)}</td>
            <td><span class="pf-team-tag" style="${r.team === "A" ? teamSolidStyle(teamAColor) : r.team === "B" ? teamSolidStyle(teamBColor) : ""}">${r.team || "-"}</span></td>
            ${isMulti ? `<td class="muted">Fourball ${r.fourballIndex || "?"}</td>` : ""}
            <td>${r.count}</td>
            <td>${r.count ? r.sum : "-"}</td>
          </tr>`).join("")}
      </table>
    </div>
  </div>

  <div id="pfTabTeam" class="pf-tab-panel${isTab("team")}">
    <div class="card">
      <table>
        <tr><th class="name-col">Pairing</th>${isMulti ? "<th>Fourball</th>" : ""}<th>Thru</th><th>Best ball</th></tr>
        ${pairRows.map((r,i) => `
          <tr class="pf-team-row ${i===0 && r.count ? 'leader-row' : ''}" data-bestteam="${r.team}" data-round="${r.roundId}" role="button" tabindex="0" style="cursor:pointer;">
            <td class="name-col">${r.label} <span class="pf-team-tag" style="${r.team === "A" ? teamSolidStyle(teamAColor) : teamSolidStyle(teamBColor)}">${r.team}</span> <span class="pf-chev">&rsaquo;</span></td>
            ${isMulti ? `<td class="muted">Fourball ${r.fourballIndex || "?"}</td>` : ""}
            <td>${r.count}</td>
            <td>${r.count ? r.sum : "-"}</td>
          </tr>`).join("")}
      </table>
    </div>
  </div>
  `;
}
/* ============================================================
   INDIVIDUAL SCORECARD (clickable player names)
   ============================================================ */
function countEntered(subset, player, detail, field){
  return subset.filter(h => detail[player.id][h.holeNumber][field] != null).length;
}
function sumField(subset, player, detail, field){
  return subset.reduce((acc,h) => {
    const v = detail[player.id][h.holeNumber][field];
    return v == null ? acc : acc + v;
  }, 0);
}
function scoreCell(subset, player, detail, field){
  return subset.map(h => {
    const v = detail[player.id][h.holeNumber][field];
    return `<td>${v == null ? "-" : v}</td>`;
  }).join("");
}
function scrambleDriveMarkFor(bundle, holeNumber, playerId){
  const rec = (bundle.scrambleDrives || []).find(s => s.holeNumber === holeNumber);
  if (!rec) return "";
  if (rec.playerId === playerId || rec.teamA === playerId || rec.teamB === playerId) return "*";
  return "";
}
function scoreCellGross(subset, player, detail, bundle, wonHoles){
  return subset.map(h => {
    const v = detail[player.id][h.holeNumber].gross;
    const mark = scrambleDriveMarkFor(bundle, h.holeNumber, player.id);
    if (v == null) return `<td>-</td>`;
    const label = `${v}${mark}`;
    // Same circled-score treatment already used elsewhere to mark a counted
    // score (Alliance/Betterball scorecards) - here it marks a hole this
    // player won outright in 3-way match play.
    const content = (wonHoles && wonHoles.has(h.holeNumber))
      ? `<span class="circled-score">${label}</span>`
      : label;
    return `<td>${content}</td>`;
  }).join("");
}
function aggCell(subset, player, detail, field){
  const n = countEntered(subset, player, detail, field);
  return `<td class="agg-col">${n === 0 ? "-" : sumField(subset, player, detail, field)}</td>`;
}

function openScorecard(playerId){
  if (!currentBundle) return;
  const { round, holes, players } = currentBundle;
  const player = players.find(p => p.id === playerId);
  if (!player) return;
  const detail = computeDetail(currentBundle);

  const front = holes.filter(h => h.holeNumber <= 9);
  const back = holes.filter(h => h.holeNumber > 9);
  const showPts = true; // stableford points are always computed from detail, so always worth showing
  const wonHoles = round.gameModes.includes("matchplay3")
    ? matchPlay3WonHoles(players, holes, detail, playerId)
    : null;

  const parTotal = holes.reduce((a,h)=>a+h.par,0);

  const grossThru = countEntered(holes, player, detail, "gross");

  const html = `
    <div class="scorecard-overlay" id="scorecardOverlay">
      <div class="scorecard-panel">
        <button class="scorecard-close" id="scorecardCloseBtn">&times;</button>
        <div class="scorecard-heading">
          <div class="course">${escapeHtml(round.courseName)}</div>
          <div class="meta">${escapeHtml(round.roundDate) || ""}${round.teeTime ? " · " + escapeHtml(round.teeTime) : ""}${round.teeBox ? " · " + round.teeBox + " tees" : ""}</div>
        </div>
        <div class="scorecard-player-name">${escapeHtml(player.name)} <span class="muted" style="font-size:.85rem;font-weight:600;">(hcp ${player.playingHandicap}${player.team ? " · team " + player.team : ""})</span></div>

        <div class="scorecard-table-wrap">
        <table class="scorecard-table">
          <thead>
            <tr>
              <th class="label-col">Hole</th>
              ${front.map(h=>`<th>${h.holeNumber}</th>`).join("")}
              <th class="agg-col">OUT</th>
              ${back.map(h=>`<th>${h.holeNumber}</th>`).join("")}
              <th class="agg-col">IN</th>
              <th class="agg-col">TOTAL</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="label-col">Par</td>
              ${front.map(h=>`<td>${h.par}</td>`).join("")}
              <td class="agg-col">${front.reduce((a,h)=>a+h.par,0)}</td>
              ${back.map(h=>`<td>${h.par}</td>`).join("")}
              <td class="agg-col">${back.reduce((a,h)=>a+h.par,0)}</td>
              <td class="agg-col">${parTotal}</td>
            </tr>
            <tr>
              <td class="label-col">S.I.</td>
              ${front.map(h=>`<td>${h.strokeIndex}</td>`).join("")}
              <td class="agg-col">-</td>
              ${back.map(h=>`<td>${h.strokeIndex}</td>`).join("")}
              <td class="agg-col">-</td>
              <td class="agg-col">-</td>
            </tr>
            <tr class="gross-row">
              <td class="label-col">Gross</td>
              ${scoreCellGross(front, player, detail, currentBundle, wonHoles)}
              ${aggCell(front, player, detail, "gross")}
              ${scoreCellGross(back, player, detail, currentBundle, wonHoles)}
              ${aggCell(back, player, detail, "gross")}
              ${aggCell(holes, player, detail, "gross")}
            </tr>
            <tr>
              <td class="label-col">Net</td>
              ${scoreCell(front, player, detail, "net")}
              ${aggCell(front, player, detail, "net")}
              ${scoreCell(back, player, detail, "net")}
              ${aggCell(back, player, detail, "net")}
              ${aggCell(holes, player, detail, "net")}
            </tr>
            ${showPts ? `
            <tr>
              <td class="label-col">Points</td>
              ${scoreCell(front, player, detail, "pts")}
              ${aggCell(front, player, detail, "pts")}
              ${scoreCell(back, player, detail, "pts")}
              ${aggCell(back, player, detail, "pts")}
              ${aggCell(holes, player, detail, "pts")}
            </tr>` : ""}
          </tbody>
        </table>
        </div>

        <div class="scorecard-summary">
          <div><div class="val">${grossThru}/18</div><div class="lbl">Thru</div></div>
          <div><div class="val">${countEntered(holes,player,detail,"gross") ? sumField(holes,player,detail,"gross") : "-"}</div><div class="lbl">Gross</div></div>
          <div><div class="val">${countEntered(holes,player,detail,"net") ? sumField(holes,player,detail,"net") : "-"}</div><div class="lbl">Net</div></div>
          ${showPts ? `<div><div class="val">${countEntered(holes,player,detail,"pts") ? sumField(holes,player,detail,"pts") : "-"}</div><div class="lbl">Points</div></div>` : ""}
        </div>
        ${wonHoles ? `<p class="muted" style="font-size:.72rem;margin-top:8px;">⬤ Circled score — won that hole outright in the 3-way match</p>` : ""}
        ${scrambleLegend(currentBundle)}
      </div>
    </div>
  `;

  const wrapper = document.createElement("div");
  wrapper.innerHTML = html;
  document.body.appendChild(wrapper.firstElementChild);

  const overlay = document.getElementById("scorecardOverlay");
  document.getElementById("scorecardCloseBtn").onclick = closeScorecard;
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeScorecard(); });
}

function closeScorecard(){
  const overlay = document.getElementById("scorecardOverlay");
  if (overlay) overlay.remove();
}

function scrambleHoleMark(bundle, holeNumber){
  const rec = (bundle.scrambleDrives || []).find(s => s.holeNumber === holeNumber);
  return rec ? `<span title="Scramble drive">*</span>` : "";
}
function scrambleLegend(bundle){
  const recs = (bundle.scrambleDrives || []).slice().sort((a,b) => a.holeNumber - b.holeNumber);
  if (recs.length === 0) return "";
  const byId = {};
  bundle.players.forEach(p => byId[p.id] = p.name);
  const parts = recs.map(r => {
    if (r.teamA || r.teamB){
      const bits = [];
      if (r.teamA) bits.push(`A: ${byId[r.teamA] || "?"}`);
      if (r.teamB) bits.push(`B: ${byId[r.teamB] || "?"}`);
      return `Hole ${r.holeNumber}: ${bits.join(", ")}`;
    }
    return `Hole ${r.holeNumber}: ${byId[r.playerId] || "?"}`;
  });
  return `<p class="muted" style="font-size:.72rem;margin-top:8px;">* Scramble drive — ${parts.join(" · ")}</p>`;
}

function openTeamScorecard(){
  if (!currentBundle) return;
  const { round, holes, players } = currentBundle;
  const detail = computeDetail(currentBundle);
  const n = Math.max(1, Math.min(round.allianceCount || 2, players.length));
  const data = computeAllianceData(currentBundle, detail); // per-hole: {holeNumber, entries, counted, teamPts}
  const byHole = {};
  data.forEach(d => byHole[d.holeNumber] = d);

  const front = holes.filter(h => h.holeNumber <= 9);
  const back = holes.filter(h => h.holeNumber > 9);

  function ptsCell(playerId, h){
    const d = byHole[h.holeNumber];
    const entry = d.entries.find(e => e.playerId === playerId);
    const pts = entry ? entry.pts : null;
    const gross = detail[playerId][h.holeNumber].gross;
    if (pts == null) return `<td>-</td>`;
    const isCounted = d.counted.has(playerId);
    const mark = scrambleDriveMarkFor(currentBundle, h.holeNumber, playerId);
    return `<td>
      <div class="shot-count">${gross}${mark}</div>
      <div class="${isCounted ? 'circled-score' : 'pts-plain'}">${pts}</div>
    </td>`;
  }
  function playerAggCell(playerId, subset){
    const ptsVals = subset.map(h => {
      const d = byHole[h.holeNumber];
      const entry = d.entries.find(e => e.playerId === playerId);
      return entry ? entry.pts : null;
    }).filter(v => v != null);
    const grossVals = subset.map(h => detail[playerId][h.holeNumber].gross).filter(v => v != null);
    const ptsSum = ptsVals.length ? ptsVals.reduce((a,b)=>a+b,0) : "-";
    const grossSum = grossVals.length ? grossVals.reduce((a,b)=>a+b,0) : "-";
    return `<td class="agg-col">
      <div class="shot-count">${grossSum}</div>
      <div class="pts-plain">${ptsSum}</div>
    </td>`;
  }
  function teamCell(h){
    const d = byHole[h.holeNumber];
    return `<td>${d.teamPts == null ? "-" : `<strong>${d.teamPts}</strong>`}</td>`;
  }
  function teamAggCell(subset){
    const vals = subset.map(h => byHole[h.holeNumber].teamPts).filter(v => v != null);
    return `<td class="agg-col">${vals.length ? vals.reduce((a,b)=>a+b,0) : "-"}</td>`;
  }

  const thru = data.filter(d => d.teamPts != null).length;
  const total = data.reduce((a,d) => a + (d.teamPts || 0), 0);

  const html = `
    <div class="scorecard-overlay" id="scorecardOverlay">
      <div class="scorecard-panel">
        <button class="scorecard-close" id="scorecardCloseBtn">&times;</button>

/* ---------- Piekfyn match scorecard (tap a match on the Fourballs tab) ---------- */
// Rounds can start on any hole (shotgun), so match counts and the lock-in have to follow the order
// the holes were actually played, not 1..18. The start hole is the hole of the FIRST score captured:
// stored on the round (startHole) when that score is saved, or - for rounds from before that was
// recorded - the hole of the earliest-entered score. Only if neither is known does it fall back to
// a scored hole whose previous hole (wrapping 1 -> 18) wasn't scored.
function startHoleFor(bundle){
  if (bundle.round && bundle.round.startHole) return bundle.round.startHole;
  let first = null, firstMs = Infinity;
  (bundle.scores || []).forEach(sc => {
    const ms = sc.updatedAt && sc.updatedAt.toMillis ? sc.updatedAt.toMillis() : null;
    if (ms != null && ms < firstMs){ firstMs = ms; first = sc.holeNumber; }
  });
  return first;
}
function inferPlayOrder(holes, detail, players, startHole){
  const nums = holes.map(h => h.holeNumber);
  const rotateTo = start => { const i = nums.indexOf(start); return [...nums.slice(i), ...nums.slice(0, i)]; };
  if (startHole && nums.includes(startHole)) return rotateTo(startHole);
  const scored = h => players.some(p => detail[p.id][h.holeNumber].gross != null);
  const scoredNums = holes.filter(scored).map(h => h.holeNumber);
  if (!scoredNums.length) return nums;
  const has = n => scoredNums.includes(n);
  const prev = n => n === nums[0] ? nums[nums.length - 1] : n - 1;
  const start = scoredNums.find(n => !has(prev(n))) || nums[0];
  return rotateTo(start);
}

function openMatchScorecard(bundle, matchKey){
  const { round, holes, players } = bundle;
  const detail = computeDetail(bundle);
  const byOrder = {};
  players.forEach(p => byOrder[p.sortOrder] = p);
  const teamAName = round.teamAName || "Team A", teamBName = round.teamBName || "Team B";

  let sideA, sideB, nameA, nameB, title;
  if (matchKey === "team"){
    sideA = players.filter(p => p.team === "A"); sideB = players.filter(p => p.team === "B");
    nameA = teamAName; nameB = teamBName;
    title = `${escapeHtml(teamAName)} vs ${escapeHtml(teamBName)} (fourball)`;
  } else {
    const pair = (round.piekfynPairs || [])[parseInt(matchKey, 10)];
    const pA = pair && byOrder[pair.a], pB = pair && byOrder[pair.b];
    if (!pA || !pB) return;
    sideA = [pA]; sideB = [pB]; nameA = pA.name; nameB = pB.name;
    title = `${escapeHtml(pA.name)} vs ${escapeHtml(pB.name)}`;
  }

  // Hole-by-hole running count, in playing order. It stops at the hole where the match was decided.
  const best = (side, h) => {
    const nets = side.map(p => detail[p.id][h.holeNumber].net);
    return nets.some(n => n == null) ? null : Math.min(...nets);
  };
  const holeByNum = {}; holes.forEach(h => holeByNum[h.holeNumber] = h);
  const order = inferPlayOrder(holes, detail, players, startHoleFor(bundle));
  const m = computeMatch(holes, detail, sideA, sideB, order);
  const result = {};
  Object.keys(m.steps).forEach(n => { result[n] = { running: m.steps[n].running }; });
  // Columns follow the order the holes were played (a shotgun start on 10 reads 10..18, 1..9).
  const cols = order.map(n => holeByNum[n]);

  // The running count sits in each side's own row: up when they win a hole, down when they lose it.
  const statusCells = (subset, sign) => subset.map(h => {
    const r = result[h.holeNumber];
    if (!r) return `<td>-</td>`;
    const v = r.running * sign;
    const cls = v > 0 ? "mc-up" : (v < 0 ? "mc-down" : "mc-sq");
    return `<td class="${cls}">${v > 0 ? v + " UP" : (v < 0 ? Math.abs(v) + " DN" : "AS")}</td>`;
  }).join("");
  const nets = (subset, side, p) => subset.map(h => {
    const v = detail[p.id][h.holeNumber].net;
    if (v == null) return `<td>-</td>`;
    const counted = side.length > 1 && best(side, h) === v;   // the better-ball score that counts
    return `<td>${counted ? `<span class="circled-score">${v}</span>` : v}</td>`;
  }).join("");
  // The two-ball's own score per hole (the circled better-ball net, stated as its own row) —
  // singles matches skip this since there's only one player's score to show.
  const teamScoreRow = (side, sideName) => side.length > 1
    ? `<tr class="mc-team-score-row"><td class="label-col">${escapeHtml(sideName)}</td>${cols.map(h => {
        const v = best(side, h);
        return v == null ? `<td>-</td>` : `<td><strong>${v}</strong></td>`;
      }).join("")}</tr>`
    : "";
  const sideRows = (side, sideName, sign) => `
    ${side.map(p => `
      <tr><td class="label-col">${escapeHtml(p.name)}${side.length > 1 ? "" : ""}</td>${nets(cols, side, p)}</tr>`).join("")}
    ${teamScoreRow(side, sideName)}
    <tr class="mc-side-row"><td class="label-col">Match</td>${statusCells(cols, sign)}</tr>`;

  const html = `
    <div class="scorecard-overlay" id="scorecardOverlay">
      <div class="scorecard-panel">
        <button class="scorecard-close" id="scorecardCloseBtn">&times;</button>
        <div class="scorecard-heading">
          <div class="course">${escapeHtml(round.courseName)}</div>
          <div class="meta">${escapeHtml(round.roundDate) || ""}${round.teeBox ? " · " + round.teeBox + " tees" : ""}</div>
        </div>
        <div class="scorecard-player-name">${title}</div>
        <p style="margin:2px 0 10px;font-weight:700;">${formatMatchStatus(m, nameA, nameB)}</p>
        <div class="scorecard-table-wrap">
        <table class="scorecard-table">
          <thead><tr>
            <th style="text-align:left;">Hole</th>
            ${cols.map(h=>`<th>${h.holeNumber}</th>`).join("")}
          </tr></thead>
          <tbody>
            <tr><td class="label-col">Par</td>${cols.map(h=>`<td>${h.par}</td>`).join("")}</tr>
            <tr><td class="label-col">S.I.</td>${cols.map(h=>`<td>${h.strokeIndex}</td>`).join("")}</tr>
            ${sideRows(sideA, nameA, 1)}
            ${sideRows(sideB, nameB, -1)}
          </tbody>
        </table>
        </div>
        <p class="muted" style="font-size:.75rem;margin:10px 0 0;">Net scores${matchKeyIsTeam(matchKey) ? " (circled = the better ball that counts, repeated as that two-ball's own score row)" : ""}. The Match row is that side's lead: it goes up when they win a hole and down when they lose one, in the order the holes were played.</p>
      </div>
    </div>`;
  const wrapper = document.createElement("div");
  wrapper.innerHTML = html;
  document.body.appendChild(wrapper.firstElementChild);
  const overlay = document.getElementById("scorecardOverlay");
  document.getElementById("scorecardCloseBtn").onclick = closeScorecard;
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeScorecard(); });
}
function matchKeyIsTeam(k){ return k === "team"; }

/* ---------- Best team scorecard (tap a pairing on the Best team tab) ---------- */
// Better-ball Stableford for one same-team pair: each player's gross and Stableford points per
// hole, the better of the two points circled, and a Best ball row that adds up to the total.
function openBestTeamScorecard(bundle, team){
  const { round, holes, players } = bundle;
  const detail = computeDetail(bundle);
  const pair = players.filter(p => p.team === team);
  if (!pair.length) return;
  const order = inferPlayOrder(holes, detail, players, startHoleFor(bundle));
  const holeByNum = {}; holes.forEach(h => holeByNum[h.holeNumber] = h);
  const cols = order.map(n => holeByNum[n]);
  const teamName = escapeHtml(team === "A" ? (round.teamAName || "Team A") : (round.teamBName || "Team B"));

  const holePts = h => pair.map(p => detail[p.id][h.holeNumber].pts).filter(v => v != null);
  const bestAt = h => { const v = holePts(h); return v.length ? Math.max(...v) : null; };
  const total = cols.reduce((a,h) => a + (bestAt(h) || 0), 0);
  const thru = cols.filter(h => bestAt(h) != null).length;

  const grossRow = p => cols.map(h => {
    const v = detail[p.id][h.holeNumber].gross;
    return `<td>${v == null ? "-" : v}</td>`;
  }).join("");
  const ptsRow = p => cols.map(h => {
    const v = detail[p.id][h.holeNumber].pts;
    if (v == null) return `<td>-</td>`;
    return `<td>${v === bestAt(h) ? `<span class="circled-score">${v}</span>` : v}</td>`;
  }).join("");
  const sumOf = (p, field) => {
    const vals = cols.map(h => detail[p.id][h.holeNumber][field]).filter(v => v != null);
    return vals.length ? vals.reduce((a,b) => a + b, 0) : "-";
  };

  const html = `
    <div class="scorecard-overlay" id="scorecardOverlay">
      <div class="scorecard-panel">
        <button class="scorecard-close" id="scorecardCloseBtn">&times;</button>
        <div class="scorecard-heading">
          <div class="course">${escapeHtml(round.courseName)}</div>
          <div class="meta">${escapeHtml(round.roundDate) || ""}${round.teeBox ? " · " + round.teeBox + " tees" : ""}</div>
        </div>
        <div class="scorecard-player-name">${pair.map(p => escapeHtml(p.name)).join(" &amp; ")} <span class="muted" style="font-size:.85rem;font-weight:600;">(${teamName})</span></div>
        <p style="margin:2px 0 10px;font-weight:700;">Best ball Stableford: ${thru ? total : "-"} pts thru ${thru}</p>
        <div class="scorecard-table-wrap">
        <table class="scorecard-table">
          <thead><tr>
            <th style="text-align:left;">Hole</th>
            ${cols.map(h => `<th>${h.holeNumber}</th>`).join("")}
            <th class="agg-col">TOT</th>
          </tr></thead>
          <tbody>
            <tr><td class="label-col">Par</td>${cols.map(h => `<td>${h.par}</td>`).join("")}<td class="agg-col">${cols.reduce((a,h)=>a+h.par,0)}</td></tr>
            <tr><td class="label-col">S.I.</td>${cols.map(h => `<td>${h.strokeIndex}</td>`).join("")}<td class="agg-col">-</td></tr>
            ${pair.map(p => `
            <tr class="gross-row"><td class="label-col">${escapeHtml(p.name)}<br><span class="muted" style="font-size:.65rem;font-weight:600;">gross · hcp ${p.playingHandicap}</span></td>${grossRow(p)}<td class="agg-col">${sumOf(p, "gross")}</td></tr>
            <tr><td class="label-col"><span class="muted" style="font-size:.7rem;">${escapeHtml(p.name)} pts</span></td>${ptsRow(p)}<td class="agg-col">${sumOf(p, "pts")}</td></tr>`).join("")}
            <tr class="mc-side-row"><td class="label-col">Best ball</td>${cols.map(h => { const v = bestAt(h); return `<td class="${v == null ? "" : "mc-up"}">${v == null ? "-" : v}</td>`; }).join("")}<td class="agg-col"><strong>${thru ? total : "-"}</strong></td></tr>
          </tbody>
        </table>
        </div>
        <p class="muted" style="font-size:.75rem;margin:10px 0 0;">Stableford points per hole. The circled score is the better ball that counts for the pair; the Best ball row adds up to their total. Holes are in the order they were played.</p>
      </div>
    </div>`;
  const wrapper = document.createElement("div");
  wrapper.innerHTML = html;
  document.body.appendChild(wrapper.firstElementChild);
  const overlay = document.getElementById("scorecardOverlay");
  document.getElementById("scorecardCloseBtn").onclick = closeScorecard;
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeScorecard(); });
}


let competitionBundlesForLinks = [];   // set by renderCompetition/renderStandings so player links on a
                                        // combined leaderboard open the right fourball's scorecard
function closeAppDrawer(){
  const drawer = document.getElementById("appDrawer");
  const overlay = document.getElementById("appDrawerOverlay");
  if (drawer) drawer.classList.remove("open");
  if (overlay) overlay.classList.remove("open");
}
document.addEventListener("click", (e) => {
  if (e.target.closest("#menuBtn")){
    const drawer = document.getElementById("appDrawer");
    const overlay = document.getElementById("appDrawerOverlay");
    if (drawer) drawer.classList.toggle("open");
    if (overlay) overlay.classList.toggle("open");
    return;
  }
  if (e.target.closest("#appDrawerOverlay") || e.target.closest(".drawer-link")){
    closeAppDrawer();
    if (!e.target.closest(".drawer-link")) return;
  }
  const swatch = e.target.closest(".pf-swatch[data-for]");
  if (swatch){
    swatch.closest(".pf-swatches").querySelectorAll(".pf-swatch").forEach(b => b.classList.remove("selected"));
    swatch.classList.add("selected");
    const input = document.getElementById(swatch.dataset.for);
    if (input){
      input.value = swatch.dataset.color;
      if (input.dataset.pairWith){
        const aId = input.dataset.role === "a" ? input.id : input.dataset.pairWith;
        const bId = input.dataset.role === "a" ? input.dataset.pairWith : input.id;
        syncTeamColorPreview(aId, bId);
      }
    }
    return;
  }
  const matchRow = e.target.closest(".pf-match-row[data-match]");
  const teamRow = e.target.closest("tr[data-bestteam]");
  if (matchRow || teamRow){
    // Competition/standings pages keep their live bundles in competitionBundlesForLinks; the
    // scorer and spectator pages keep theirs in currentBundle.
    const el = matchRow || teamRow;
    const onCompPage = document.getElementById("competitionBody") || document.getElementById("standingsBody");
    const bundle = onCompPage
      ? competitionBundlesForLinks.find(b => b.round.id === el.dataset.round)
      : currentBundle;
    if (bundle){
      if (matchRow) openMatchScorecard(bundle, matchRow.dataset.match);
      else openBestTeamScorecard(bundle, teamRow.dataset.bestteam);
    }
    return;
  }
  const link = e.target.closest(".player-name-link");
  if (link){
    if (link.dataset.round){
      const b = competitionBundlesForLinks.find(x => x.round.id === link.dataset.round);
      if (b) currentBundle = b;
    }
    openScorecard(link.dataset.player);
    return;
  }
  const standingsLink = e.target.closest("[data-standings-link]");
  if (standingsLink){ location.hash = `#/standings/${standingsLink.dataset.standingsLink}`; return; }
  const betterballLink = e.target.closest("[data-betterball-link]");
  if (betterballLink){ openBetterballScorecard(); return; }
  const teamLink = e.target.closest(".team-scorecard-link");
  if (teamLink){ openTeamScorecard(); }
});

// Makes every element marked role="button" tabindex="0" (the many custom clickable rows
// throughout the app - competition/history list items, scorecard links, etc.) keyboard-operable
// without writing a bespoke handler at each call site: Enter/Space re-dispatches as a real click,
// which the existing click handlers above (delegated or per-element) already know how to handle.
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest('[role="button"][tabindex]');
  if (!el) return;
  e.preventDefault();
  el.click();
});

function updateConnIndicator(){
  const el = document.getElementById("connIndicator");
  if (!el) return;
  const online = navigator.onLine;
  el.className = "conn-indicator " + (online ? "conn-online" : "conn-offline");
  el.innerHTML = `<span class="conn-dot"></span>${online ? "Connected" : "Offline"}`;
}
window.addEventListener("online", updateConnIndicator);
window.addEventListener("offline", updateConnIndicator);

// Cross the phone/desktop breakpoint live (resizing a window, rotating a tablet) without a
// manual reload - debounced, and only re-renders when the boolean actually flips, since the
// 5 mountPage() screens re-fetch Firestore data on every render.
let lastIsDesktopWidth = isDesktopWidth();
let resizeDebounceTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeDebounceTimer);
  resizeDebounceTimer = setTimeout(() => {
    const nowDesktop = isDesktopWidth();
    if (nowDesktop !== lastIsDesktopWidth){
      lastIsDesktopWidth = nowDesktop;
      render();
    }
  }, 200);
});

if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/golf/sw.js", { scope: "/golf" }).catch(() => {});
  });
}

render();
</script>
